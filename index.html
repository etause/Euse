function bkMakeExam(vc){
  var W=vc.words.filter(function(x){return x.ar}),N=bkExamN(vc.rd);
  var used={},pool={mean:[],rev:[],tf:[],spell:[],cloze:[]};
  function others(x,k,f){return bkShuf(W.filter(function(o){return o!==x&&bkShort(o.ar)!==bkShort(x.ar)})).slice(0,k).map(f)}
  bkShuf(W).forEach(function(x){
    if(W.length>=4){
      var o1=others(x,3,function(o){return bkShort(o.ar)});
      if(o1.length===3){var op=bkShuf(o1.concat([bkShort(x.ar)]));pool.mean.push({k:'mc',tag:'معنى كلمة',q:'ما معنى «'+x.w+'»؟',qltr:x.w,opts:op,a:op.indexOf(bkShort(x.ar)),w:x});}
      var o2=others(x,3,function(o){return o.w});
      if(o2.length===3){var op2=bkShuf(o2.concat([x.w]));pool.rev.push({k:'mc',tag:'من العربية إلى الإنجليزية',q:'ما الكلمة الإنجليزية التي معناها «'+bkShort(x.ar)+'»؟',opts:op2,ltr:true,a:op2.indexOf(x.w),w:x});}
    }
    if(W.length>=2){
      var tr=Math.random()<.5,oth=others(x,1,function(o){return bkShort(o.ar)})[0];
      if(tr||!oth)pool.tf.push({k:'tf',tag:'صح أم خطأ',q:'كلمة «'+x.w+'» تعني «'+bkShort(x.ar)+'»',a:true,w:x});
      else pool.tf.push({k:'tf',tag:'صح أم خطأ',q:'كلمة «'+x.w+'» تعني «'+oth+'»',a:false,w:x});
    }
    pool.spell.push({k:'sp',tag:'إملاء',q:'اكتب الكلمة الإنجليزية الصحيحة لهذا المعنى: «'+bkShort(x.ar)+'»',ans:x.w,w:x});
  });
  var all=vc.words.filter(function(x){return x.sent});
  bkShuf(all).forEach(function(x){
    var re=new RegExp('\\b'+x.w.replace(/[^a-z]/gi,'')+'\\b','i');
    if(!re.test(x.sent))return;
    var suf=function(w){return w.slice(-2)},cand=bkShuf(vc.words.filter(function(o){return o!==x&&o.w!==x.w}));
    var d=cand.filter(function(o){return suf(o.w)===suf(x.w)}).concat(cand.filter(function(o){return suf(o.w)!==suf(x.w)&&Math.abs(o.w.length-x.w.length)<=3})).slice(0,3);
    if(d.length<3)d=bkShuf(vc.words.filter(function(o){return o!==x})).slice(0,3);
    if(d.length<3)return;
    var op=bkShuf(d.map(function(o){return o.w}).concat([x.w]));
    pool.cloze.push({k:'mc',tag:'أكمل الجملة',q:x.sent.replace(re,'_____'),ltr:true,qltr:true,opts:op,a:op.indexOf(x.w),w:x,tg:1});
  });
  var order=['mean','cloze','tf','spell','rev','cloze','mean','tf','rev','spell'],out=[],guard=0;
  while(out.length<N&&guard++<400){
    var any=false;
    for(var i=0;i<order.length&&out.length<N;i++){
      var p=pool[order[i]];
      while(p.length){
        var q=p.shift(),k=q.w.w;
        if((used[k]||0)>=2)continue;
        used[k]=(used[k]||0)+1;out.push(q);any=true;break;
      }
    }
    if(!any)break;
  }
  return out;
}

function bkLoad(key){
  var id=key.slice(2);

    var t=bkTale(id);if(!t)return Promise.reject();
    return Promise.resolve({key:key,t:t.t,ch:t.ch.map(function(c){return {h:c.h,p:c.p}}),gl:t.gl});
  }
  if(key.charAt(0)==='a'){

    return Promise.resolve({key:key,t:ab.t,ch:ab.ch.map(function(c){return {h:c.h,p:c.p}}),ro:true});

  var m=bkMine(id);if(!m)return Promise.reject();

function bkOcr(files){
  var d=BK.draft;BK.err='';BK.busy='تحميل محرك قراءة الصور (مرة واحدة)...';renderSheet();
  var upd=function(m){BK.busy=m;var e=$('#bkBusy');if(e)e.textContent=m};
  (async function(){
    try{
      if(!window.Tesseract)await stLoad(LIB_TESS);
      var n=files.length,idx=0,out='';
      var w=await Tesseract.createWorker('eng',1,{logger:function(m){if(m&&m.status==='recognizing text')upd('قراءة النص من الصورة '+(idx+1)+' من '+n+'... '+Math.round(m.progress*100)+'%')}});
      try{for(idx=0;idx<n;idx++){var cv=await stImgCanvas(files[idx],2200);var r=await w.recognize(cv);out+=(r&&r.data&&r.data.text||'')+'\n\n'}}finally{try{await w.terminate()}catch(e){}}
      if(out.replace(/\s/g,'').length<20){BK.busy='';BK.err='لم أجد نصًا واضحًا في الصور.';renderSheet();return}
      d.text=out;d.file=null;d.name='مسح ضوئي';d.ext='TXT';d.src='scan';d.fn='نص ممسوح';
      BK.busy='';bkSaveDraft();
    }catch(e){BK.busy='';BK.err='تعذّر تحميل محرك قراءة الصور. تأكد من الإنترنت.';renderSheet()}
  })();
}
function bkLinesToParas(lines){
  var mx=0,out=[],cur='';
  lines=lines.map(function(l){return l.replace(/\s+/g,' ').trim()}).filter(function(l){return l&&!/^\d{1,4}$/.test(l)});
  lines.forEach(function(l){mx=Math.max(mx,l.length)});
  lines.forEach(function(l){
    if(cur&&/-$/.test(cur)&&/^[a-z]/.test(l))cur=cur.slice(0,-1)+l;else cur+=(cur?' ':'')+l;
    if(/[.!?:”"')\]]$/.test(l)&&l.length<mx*.85){out.push(cur);cur=''}
  });
  if(cur)out.push(cur);
  return out;
}
async function bkPdfBook(file,upd){
  if(!window.pdfjsLib){upd('تحميل قارئ PDF (مرة واحدة)...');await stLoad(LIB_PDF)}
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIB_PDFW;
  var doc=await lib.getDocument({data:await file.arrayBuffer()}).promise,total=Math.min(doc.numPages,1500),pages=[],chars=0;
  for(var i=1;i<=total;i++){
    var pg=await doc.getPage(i),tc=await pg.getTextContent();
    var txt=tc.items.map(function(it){return it.str+(it.hasEOL?'\n':' ')}).join('');
    var ps=bkLinesToParas(txt.split('\n'));
    pages.push(ps);chars+=ps.join('').length;
    if(i%4===0||i===total){upd('قراءة صفحات PDF '+i+' من '+total+'...');await new Promise(function(r){setTimeout(r,0)})}
  }
  if(chars<80){
    if(navigator.onLine===false)throw new Error('scan');
    if(!window.Tesseract){upd('تحميل محرك قراءة الصور (مرة واحدة)...');await stLoad(LIB_TESS)}
    var n=Math.min(doc.numPages,40),idx=0;pages=[];
    var w=await Tesseract.createWorker('eng',1,{logger:function(m){if(m&&m.status==='recognizing text')upd('قراءة الصفحة '+(idx+1)+' من '+n+' بالتعرف الضوئي... '+Math.round(m.progress*100)+'%')}});
    try{
      for(idx=0;idx<n;idx++){
        var p2=await doc.getPage(idx+1),vp=p2.getViewport({scale:2}),c=document.createElement('canvas');
        c.width=vp.width;c.height=vp.height;await p2.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
        var r=await w.recognize(c);pages.push(bkParas(r&&r.data&&r.data.text||''));
      }
    }finally{try{await w.terminate()}catch(e){}}
  }
  var out=[],cur=[],len=0,from=1;
  pages.forEach(function(ps,i){
    ps.forEach(function(p){cur.push(p);len+=p.length});
    if(len>=3500){out.push({h:'Pages '+from+(i+1>from?'–'+(i+1):''),p:cur});cur=[];len=0;from=i+2}
  });
  if(cur.length)out.push({h:'Pages '+from+(pages.length>from?'–'+pages.length:''),p:cur});
  return out.filter(function(c){return c.p.length});
}
function bkSaveDraft(){
  var d=BK.draft;BK.err='';
  var id='bk'+Date.now().toString(36),typed=d.t.trim(),meta={id:id,t:typed||d.fn||'كتاب',au:d.au.trim(),d:d.d.trim(),cat:d.cat,at:Date.now(),fav:false,cur:0,ext:d.ext,src:d.src};
  if(d.cov)meta.cov=d.cov;
  var done=function(){BK.busy='';BK.draft=null;BK.ft='all';BK.q='';BK.key='b:'+id;BK.hs=[{view:'lhome',cat:null,key:null,sel:null},{view:'home',cat:null,key:null,sel:null},{view:'cmap',cat:meta.cat,key:null,sel:'b:'+id}];toast('تمت إضافة الكتاب');bkOpenRead('b:'+id,0)};
  var fail=function(m){BK.busy='';BK.err=m;d.file=null;d.text='';d.name='';renderSheet()};
  var store1=function(ch){meta.kind='text';meta.n=ch.length;return bkPut(id,{ch:ch}).then(function(){BKM.unshift(meta);bkSave();done()})};
  BK.busy='جارٍ تجهيز الكتاب...';renderSheet();
  if(d.text){var ch=bkFromText(d.text);if(!ch.length)return fail('النص فارغ.');return store1(ch).catch(function(){fail('تعذّر حفظ الكتاب على هذا الجهاز.')})}
  var f=d.file,ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){
    if(f.size>60*1048576)return fail('الملف كبير جداً (الحد 60MB).');
    var upd=function(m){BK.busy=m;var e=$('#bkBusy');if(e)e.textContent=m};
    bkPdfBook(f,upd).then(function(ch){if(!ch.length)return fail('لم أجد نصاً في ملف PDF.');return store1(ch)}).catch(function(e){fail(e&&e.message==='scan'?'الملف عبارة عن صور ويحتاج إنترنت لقراءته.':'تعذّرت قراءة ملف PDF. تأكد من الإنترنت وجرّب مرة ثانية.')});
  }
  else if(ext==='txt'){
    if(f.size>6*1048576)return fail('الملف كبير جداً (الحد 6MB).');
    f.text().then(function(t){var ch=bkFromText(t);if(!ch.length)return fail('الملف فارغ.');return store1(ch)}).catch(function(){fail('تعذّر حفظ الكتاب على هذا الجهاز.')});
  }else if(ext==='epub'){
    if(f.size>40*1048576)return fail('الملف كبير جداً (الحد 40MB).');
    f.arrayBuffer().then(bkFromEpub).then(function(info){
      if(!info.ch.length)return fail('لم أجد نصاً قابلاً للقراءة في هذا الملف.');
      if(info.au&&!meta.au)meta.au=info.au;if(info.t&&!typed)meta.t=info.t;
      return store1(info.ch);
    }).catch(function(e){fail(e&&e.message==='nods'?'متصفحك لا يدعم قراءة EPUB. جرّب Chrome أو استخدم ملف TXT.':'تعذّرت قراءة ملف EPUB. جرّب ملفاً آخر.')});
  }else fail('الصيغة غير مدعومة.');
}

var LABD={"puz":[{"lv":1,"title":"The Quiet Neighbor","story":"Mr. Hadley was reluctant to talk to the police about the broken window. He looked at the floor and said he did not really want to get involved. Only after his wife begged him did he finally agree to speak.","word":"reluctant","pos":"adjective","syn":"unwilling; not eager","options":["غير راغب ومتردد","متحمس جدًا","غاضب جدًا","مستعد دائمًا"],"answer":0,"clues":[{"q":"did not really want to get involved","why":"عبارة تدل على أنه لا يريد المشاركة، أي أنه غير راغب في الأمر."},{"q":"Only after his wife begged him","why":"لم يوافق إلا بعد التوسل إليه، فهذا يعني أنه كان يقاوم الفكرة ولا يرغب فيها."}],"explain_ar":"كلمة reluctant تصف شخصًا لا يريد فعل شيء ما، ويفعله بتردد أو بعد إقناع.","translation_ar":"كان السيد هادلي غير راغب في التحدث إلى الشرطة بشأن النافذة المكسورة. نظر إلى الأرض وقال إنه لا يريد حقًا أن يتورط في الأمر. ولم يوافق على الكلام أخيرًا إلا بعد أن توسلت إليه زوجته.","examples":[{"en":"She was reluctant to leave her old house.","ar":"كانت غير راغبة في مغادرة بيتها القديم."},{"en":"He gave a reluctant smile and nodded.","ar":"ابتسم ابتسامة متردّدة وأومأ برأسه."}]},{"lv":1,"title":"The Old Bridge","story":"At the edge of the old bridge, Lina began to hesitate. She stopped, looked down at the river, and stepped back twice before moving forward. Her guide waited patiently until she was ready to cross.","word":"hesitate","pos":"verb","syn":"pause because you are unsure","options":["تندفع بسرعة","تتردد وتتوقف قليلًا","تصرخ بصوت عالٍ","تتجاهل الأمر"],"answer":1,"clues":[{"q":"stepped back twice before moving forward","why":"تراجعت خطوتين قبل التقدم، وهذا سلوك شخص متردد غير متأكد."},{"q":"waited patiently until she was ready to cross","why":"انتظر المرشد بصبر حتى تصبح جاهزة، أي أنها كانت تتوقف وتتردد ولم تعبر فورًا."}],"explain_ar":"الفعل hesitate يعني التوقف قليلًا قبل فعل شيء بسبب الخوف أو عدم التأكد.","translation_ar":"عند طرف الجسر القديم، بدأت لينا تتردد. توقفت ونظرت إلى النهر في الأسفل، وتراجعت خطو راحة، وتبين أن ابتسامتها تخفي شعورًا مؤلمًا."}],"explain_ar":"كلمة envious تعني أن تشعر بالغيرة أو الحسد لأن شخصًا آخر يملك شيئًا تتمنى أن تملكه.","translation_ar":"شعرت سارة بالحسد عندما فازت زميلتها بجائزة العلوم. فقد اجتهدت بالقدر نفسه، وتمنت لو كان الكأس لها. ورغم أنها ابتسمت وصفقت، فإن معدتها التوت من الغيرة.","examples":[{"en":"I am envious of your long holiday.","ar":"أشعر بالغيرة من إجازتك الطويلة."},{"en":"He gave his rich neighbor an envious look.","ar":"رمى جاره الثري بنظرة حاسدة."}]},{"lv":1,"title":"After the Marathon","story":"After the marathon, Khalid was completely exhausted. His legs shook, he could barely lift his water bottle, and he fell asleep on the bench before the medal ceremony ended.","word":"exhausted","pos":"adjective","syn":"extremely tired","options":["منهك تمامًا","غاضب","متحمس للمزيد","محرج"],"answer":0,"clues":[{"q":"he could barely lift his water bottle","why":"بالكاد يستطيع رفع زجاجة الماء، أي أنه بلا طاقة."},{"q":"fell asleep on the bench","why":"نام على المقعد قبل انتهاء الحفل، وهذا يدل على تعب شديد جدًا."}],"explain_ar":"كلمة exhausted تعني متعبًا إلى درجة أنك لا تملك أي طاقة متبقية.","translation_ar":"بعد الماراثون، كان خالد منهكًا تمامًا. ارتجفت ساقاه، وبالكاد استطاع رفع زجاجة الماء، ونام على المقعد قبل أن ينتهي حفل توزيع الميداليات.","examples":[{"en":"The nurses were exhausted after a long night shift.","ar":"كانت الممرضات منهكات بعد مناوبة ليلية طويلة."},{"en":"I felt exhausted by the end of the week.","ar":"شعرت بإرهاق شديد في نهاية الأسبوع."}]},{"lv":1,"title":"The Wrong Name","story":"Nadia felt embarrassed when she called her new manager by the wrong name in front of everyone. Her face turned bright red, and she wanted to disappear under her desk.","word":"embarrassed","pos":"adjective","syn":"ashamed and awkward in front of others","options":["فخورة بما فعلت","محرجة وتشعر بالخجل","مرتاحة وسعيدة","متعبة"],"answer":1,"clues":[{"q":"Her face turned bright red","why":"احمرار الوجه علامة معروفة على الإحراج والخجل."},{"q":"wanted to disappear under her desk","why":"تتمنى أن تختفي من شدة الموقف المحرج أمام الجميع."}],"explain_ar":"كلمة embarrassed تصف شعور الخجل أو الحرج عندما تفعل شيئًا غير مناسب أمام الآخرين.","translation_ar":"شعرت نادية بالإحراج عندما نادت مديرها الجديد باسم خاطئ أمام الجميع. احمرّ وجهها بشدة، وتمنت لو تختفي تحت مكتبها.","examples":[{"en":"He was embarrassed about his old clothes.","ar":"كان محرجًا من ملابسه القديمة."},{"en":"She felt embarrassed when her phone rang during the lecture.","ar":"شعرت بالإحراج عندما رنّ هاتفها أثناء المحاضرة."}]},{"lv":1,"title":"The Stranger at the Bank","story":"The baker grew suspicious when the same stranger came every morning but never bought any bread. He just stood across the street, watching the bank. The baker decided to call the sheriff and report what he had seen.","word":"suspicious","pos":"adjective","syn":"feeling that something is wrong","options":["ممتنًا للزائر","نعسانًا","يشك ويرتاب","سعيدًا بالزبون"],"answer":2,"clues":[{"q":"never bought any bread","why":"زائر يأتي كل صباح دون أن يشتري شيئًا، وهذا تصرف غريب يثير الشك."},{"q":"watching the bank","why":"مراقبته للمصرف جعل الخباز يعتقد أن هناك خطأ ما، فقرر إبلاغ الشرطة."}],"explain_ar":"كلمة suspicious تعني أنك تشك في شخص أو شيء وتعتقد أن هناك أمرًا خاطئًا أو غير شريف.","translation_ar":"أصبح الخباز يرتاب عندما كان الغريب نفسه يأتي كل صباح دون أن يشتري أي خبز. كان يقف فقط على الجانب الآخر من الشارع يراقب المصرف. فقرر الخباز أن يتصل بالشريف ويبلغه بما رآه.","examples":[{"en":"The guard was suspicious of the unmarked package.","ar":"ارتاب الحارس في الطرد الذي لا يحمل أي علامة."},{"en":"Her suspicious husband checked the door twice.","ar":"فحص زوجها المرتاب الباب مرتين."}]},{"lv":2,"title":"The Restorer","story":"The museum restorer was meticulous about every detail. She spent three weeks cleaning one tiny corner of the painting with a needle-thin brush, checking each stroke under a magnifying glass. Her colleagues joked that she would never finish.","word":"meticulous","pos":"adjective","syn":"extremely careful and precise","options":["متسرع وغير مبالٍ","سريع الغضب","خجول جدًا","دقيق جدًا ويهتم بأدق التفاصيل"],"answer":3,"clues":[{"q":"spent three weeks cleaning one tiny corner of the painting","why":"قضت أسابيع على زاوية صغيرة، أي أنها بالغة الدقة والصبر."},{"q":"checking each stroke under a magnifying glass","why":"تفحص كل ضربة فرشاة بعدسة مكبرة، وهذا اهتمام شديد بالتفاصيل."}],"explain_ar":"كلمة meticulous تصف شخصًا شديد الدقة والعناية بأصغر التفاصيل.","translation_ar":"كانت مرممة المتحف شديدة الدقة في كل تفصيل. قضت ثلاثة أسابيع في تنظيف زاوية صغيرة واحدة من اللوحة بفرشاة رفيعة كالإبرة، وتفحصت كل ضربة بعدسة مكبرة. ومازح زملاؤها قائلين إنها لن تنتهي أبدًا.","examples":[{"en":"He kept meticulous records of every sale.","ar":"كان يحتفظ بسجلات دقيقة جدًا لكل عملية بيع."},{"en":"The chef is meticulous about cleanliness.","ar":"الطاهي شديد الحرص على النظافة."}]},{"lv":2,"title":"The Mysterious Note","story":"The note was ambiguous, and the detective could read it in two ways. 'Meet me at the bank' might mean the river bank or the building on Main Street. Without more information, he could not tell which one the writer meant.","word":"ambiguous","pos":"adjective","syn":"having more than one possible meaning","options":["غامض يحتمل أكثر من معنى","واضح تمامًا","مكتوب بخط رديء","قديم جدًا"],"answer":0,"clues":[{"q":"could read it in two ways","why":"يمكن قراءة الرسالة بطريقتين، أي أن لها معنيين محتملين."},{"q":"he could not tell which one the writer meant","why":"لم يستطع تحديد مقصد الكاتب، فالمعنى غير محسوم."}],"explain_ar":"كلمة ambiguous تصف كلامًا أو موقفًا غير واضح لأنه يمكن فهمه بأكثر من طريقة.","translation_ar":"كانت الرسالة غامضة، وكان بإمكان المحقق أن يقرأها بطريقتين. فعبارة 'قابلني عند الضفة' قد تعني ضفة النهر أو المبنى الواقع في الشارع الرئيسي. ومن دون معلومات أكثر، لم يستطع أن يعرف أيهما قصد الكاتب.","examples":[{"en":"The law is ambiguous on this point.","ar":"القانون غامض في هذه النقطة."},{"en":"Her ambiguous answer left us confused.","ar":"تركتنا إجابتها الملتبسة في حيرة."}]},{"lv":2,"title":"The Mountain Road","story":"The young driver was reckless on the mountain road. He took sharp curves at full speed, ignored the warning signs, and laughed when his friends begged him to slow down. Everyone was relieved when the car finally stopped.","word":"reckless","pos":"adjective","syn":"careless about danger","options":["حذر جدًا","متهور لا يبالي بالخطر","مرهق","ماهر ومتمرس"],"answer":1,"clues":[{"q":"ignored the warning signs","why":"تجاهل علامات التحذير، فهو لا يهتم بالخطر."},{"q":"begged him to slow down","why":"توسل إليه أصدقاؤه أن يخفف السرعة لكنه ضحك، وهذا تصرف متهور."}],"explain_ar":"كلمة reckless تصف شخصًا يتصرف بتهور دون الاهتمام بالمخاطر أو بنتائج أفعاله.","translation_ar":"كان السائق الشاب متهورًا على الطريق الجبلي. أخذ المنعطفات الحادة بأقصى سرعة، وتجاهل لافتات التحذير، وضحك عندما توسل إليه أصدقاؤه أن يبطئ. ارتاح الجميع عندما توقفت السيارة أخيرًا.","examples":[{"en":"It was reckless to swim in such rough seas.","ar":"كان من التهور السباحة في بحر هائج كهذا."},{"en":"He was fined for reckless driving.","ar":"تم تغريمه بسبب القيادة المتهورة."}]},{"lv":2,"title":"Rising Water","story":"As the river rose for the fifth night in a row, the villagers knew the flood was inevitable. They stacked sandbags, but nobody believed they could stop what was coming. All they could do was move their animals to higher ground.","word":"inevitable","pos":"adjective","syn":"certain to happen; unavoidable","options":["مستحيل الحدوث","يمكن تجنبه بسهولة","حتمي لا مفر منه","نادر الحدوث"],"answer":2,"clues":[{"q":"nobody believed they could stop what was coming","why":"لا أحد يظن أنهم قادرون على إيقاف ما سيحدث، فهو لا مفر منه."},{"q":"move their animals to higher ground","why":"اكتفوا بالاستعداد للفيضان بدل منعه، لأنهم متأكدون من حدوثه."}],"explain_ar":"كلمة inevitable تصف شيئًا لا يمكن منعه أو تجنبه، وسيحدث بالتأكيد.","translation_ar":"مع ارتفاع النهر للليلة الخامسة على التوالي، أدرك القرويون أن الفيضان حتمي. كدّسوا أكياس الرمل، لكن لا أحد صدّق أنهم يستطيعون إيقاف ما هو قادم. وكل ما استطاعوا فعله هو نقل حيواناتهم إلى مكان أعلى.","examples":[{"en":"With so little time left, defeat seemed inevitable.","ar":"مع ضيق الوقت المتبقي، بدت الهزيمة حتمية."},{"en":"Change is inevitable in every career.","ar":"التغيير أمر لا مفر منه في كل مسيرة مهنية."}]},{"lv":2,"title":"The Million Dollar Offer","story":"Tariq is so gullible that he believes almost everything he reads online. Last week he sent money to a stranger who promised him a million dollars, and he never saw it again. His friends keep telling him to check facts before trusting anyone.","word":"gullible","pos":"adjective","syn":"too ready to believe things; easily fooled","options":["شكاك لا يصدق أحدًا","ذكي جدًا","غني","سريع التصديق وسهل الخداع"],"answer":3,"clues":[{"q":"believes almost everything he reads online","why":"يصدق تقريبًا كل ما يقرؤه، فهو سريع التصديق."},{"q":"sent money to a stranger who promised him a million dollars","why":"أرسل المال إلى غريب بسبب وعد كاذب، أي أنه وقع ضحية الخداع بسهولة."}],"explain_ar":"كلمة gullible تصف شخصًا يصدق الأشياء بسهولة فيسهل خداعه.","translation_ar":"طارق ساذج إلى درجة أنه يصدق تقريبًا كل ما يقرؤه على الإنترنت. في الأسبوع الماضي أرسل مالًا إلى غريب وعده بمليون دولار، ولم يره مرة أخرى. ويظل أصدقاؤه يقولون له أن يتحقق من الحقائق قبل أن يثق بأي أحد.","examples":[{"en":"Scammers target gullible people.","ar":"يستهدف المحتالون الأشخاص السذج."},{"en":"I was gullible enough to believe his story.","ar":"كنت ساذجًا لدرجة أنني صدقت قصته."}]},{"lv":2,"title":"Grandmother's Rules","story":"My grandmother is frugal and hates wasting money. She reuses tea bags, mends old socks instead of buying new ones, and walks to the market to save the bus fare. Even so, she is always happy to buy gifts for her grandchildren.","word":"frugal","pos":"adjective","syn":"careful about spending money","options":["مقتصدة تحرص على عدم التبذير","مبذرة","متكبرة","ثرية جدًا"],"answer":0,"clues":[{"q":"mends old socks instead of buying new ones","why":"ترقع الجوارب القديمة بدل شراء جديدة لتوفر المال."},{"q":"walks to the market to save the bus fare","why":"تمشي لتوفر أجرة الحافلة، وهذا سلوك شخص مقتصد."}],"explain_ar":"كلمة frugal تصف شخصًا يصرف المال بحذر ويتجنب التبذير، دون أن يعني ذلك بالضرورة البخل.","translation_ar":"جدتي مقتصدة وتكره إهدار المال. تعيد استخدام أكياس الشاي، وترقع الجوارب القديمة بدل شراء جديدة، وتمشي إلى السوق لتوفر أجرة الحافلة. ومع ذلك، تسعد دائمًا بشراء الهدايا لأحفادها.","examples":[{"en":"They lead a frugal life in a small apartment.","ar":"يعيشون حياة مقتصدة في شقة صغيرة."},{"en":"Be frugal now and you will save for the future.","ar":"اقتصد الآن وسوف تدخر للمستقبل."}]},{"lv":2,"title":"The Eyewitness","story":"The witness gave a vivid description of the robbery. She remembered the red scarf, the sound of breaking glass, and even the smell of smoke. The jury listened closely, as if they were standing there themselves.","word":"vivid","pos":"adjective","syn":"very clear and detailed, like a real picture","options":["مبهم وغير واضح","حي ومفصل كأنه ماثل أمامك","قصير جدًا","مكذوب"],"answer":1,"clues":[{"q":"remembered the red scarf, the sound of breaking glass","why":"تذكرت تفاصيل دقيقة من ألوان وأصوات، فالوصف غني وواضح."},{"q":"as if they were standing there themselves","why":"شعر المحلفون كأنهم في مكان الحادث، أي أن الوصف حي ومؤثر."}],"explain_ar":"كلمة vivid تصف وصفًا أو ذكرى أو صورة شديدة الوضوح والتفصيل والحيوية.","translation_ar":"قدمت الشاهدة وصفًا حيًا ومفصلًا للسطو. تذكرت الوشاح الأحمر، وصوت تحطم الزجاج، وحتى رائحة الدخان. أصغى المحلفون باهتمام كأنهم كانوا يقفون هناك بأنفسهم.","examples":[{"en":"I have vivid memories of my first day at school.","ar":"لدي ذكريات حيّة عن يومي الأول في المدرسة."},{"en":"The painter used vivid colors.","ar":"استخدم الرسام ألوانًا زاهية."}]},{"lv":3,"title":"Desert Bloom","story":"The desert flowers are ephemeral. They bloom after the rare rain, open at dawn, and are gone within two days. Tourists travel for hours just to see something that will not last.","word":"ephemeral","pos":"adjective","syn":"lasting a very short time","options":["دائم يدوم قرونًا","ضخم الحجم","قصير العمر سريع الزوال","سام وخطير"],"answer":2,"clues":[{"q":"gone within two days","why":"تختفي خلال يومين، أي أن عمرها قصير جدًا."},{"q":"will not last","why":"العبارة تقول صراحة إنها لا تدوم، وهذا هو معنى الزوال السريع."}],"explain_ar":"كلمة ephemeral تصف شيئًا يدوم فترة قصيرة جدًا ثم يزول.","translation_ar":"زهور الصحراء سريعة الزوال. تتفتح بعد المطر النادر، وتنفتح عند الفجر، وتختفي في غضون يومين. ويسافر السياح ساعات لمجرد رؤية شيء لن يدوم.","examples":[{"en":"Fame can be ephemeral.","ar":"قد تكون الشهرة زائلة سريعًا."},{"en":"The beauty of cherry blossoms is ephemeral.","ar":"جمال أزهار الكرز سريع الزوال."}]},{"lv":3,"title":"Sunday Dinner","story":"Uncle Farid was taciturn at family dinners. While everyone else chatted and laughed, he ate in silence and answered questions with a single word. Only when the talk turned to fishing would he suddenly say more.","word":"taciturn","pos":"adjective","syn":"quiet; not inclined to talk","options":["ثرثار كثير الكلام","غاضب دائمًا","كريم","قليل الكلام صموت"],"answer":3,"clues":[{"q":"ate in silence","why":"أكل في صمت بينما يتحدث الجميع، فهو قليل الكلام."},{"q":"answered questions with a single word","why":"يجيب بكلمة واحدة فقط، وهذا يدل على أنه لا يميل إلى الحديث."}],"explain_ar":"كلمة taciturn تصف شخصًا هادئًا وقليل الكلام بطبعه.","translation_ar":"كان العم فريد قليل الكلام في عشاء العائلة. وبينما كان الجميع يتحدثون ويضحكون، كان يأكل في صمت ويجيب عن الأسئلة بكلمة واحدة. ولم يكن يقول أكثر من ذلك فجأة إلا حين يتحول الحديث إلى صيد السمك.","examples":[{"en":"The taciturn farmer rarely spoke to visitors.","ar":"نادرًا ما كان المزارع الصموت يكلم الزوار."},{"en":"He is taciturn by nature, not unfriendly.","ar":"هو قليل الكلام بطبعه وليس غير ودود."}]},{"lv":3,"title":"Phones Everywhere","story":"Smartphones have become ubiquitous in the village. You see them in the fields, in the market, and even at weddings. Ten years ago, hardly anyone owned one.","word":"ubiquitous","pos":"adjective","syn":"found everywhere","options":["منتشر في كل مكان","نادر","ممنوع","باهظ الثمن"],"answer":0,"clues":[{"q":"in the fields, in the market, and even at weddings","why":"تُرى في كل الأماكن، فهي موجودة في كل مكان."},{"q":"Ten years ago, hardly anyone owned one","why":"المقارنة مع الماضي تبين أن الأمر تحول من النادر إلى المنتشر جدًا."}],"explain_ar":"كلمة ubiquitous تصف شيئًا موجودًا في كل مكان تقريبًا وفي الوقت نفسه.","translation_ar":"أصبحت الهواتف الذكية منتشرة في كل مكان في القرية. تراها في الحقول وفي السوق وحتى في حفلات الزفاف. قبل عشر سنوات، كان نادرًا أن يملك أحد هاتفًا منها.","examples":[{"en":"Coffee shops are ubiquitous in this city.","ar":"المقاهي منتشرة في كل مكان في هذه المدينة."},{"en":"Advertising is ubiquitous in modern life.","ar":"الإعلانات حاضرة في كل مكان في الحياة الحديثة."}]},{"lv":3,"title":"Less Money, New Plan","story":"When the project ran out of money, the director was pragmatic. Instead of arguing about the original dream, she cut the plan down to what could actually be finished with the budget. Her team admired how she focused on what worked rather than on ideals.","word":"pragmatic","pos":"adjective","syn":"practical; focused on what works","options":["مثالي يحلم بالكمال","عملي يركز على الحلول الواقعية","متشائم يستسلم","متردد"],"answer":1,"clues":[{"q":"cut the plan down to what could actually be finished","why":"قلصت الخطة إلى ما يمكن إنجازه فعلًا، وهذا تفكير واقعي."},{"q":"focused on what worked rather than on ideals","why":"ركزت على ما ينجح وليس على المثاليات، وهذا معنى العملية."}],"explain_ar":"كلمة pragmatic تصف شخصًا يتعامل مع المشكلات بواقعية وبحلول عملية بدل التمسك بالمثاليات.","translation_ar":"عندما نفدت أموال المشروع، كانت المديرة عملية. فبدل الجدال حول الحلم الأصلي، قلصت الخطة إلى ما يمكن إنجازه فعلًا بالميزانية. وأعجب فريقها بأنها ركزت على ما ينجح بدل التركيز على المثاليات.","examples":[{"en":"We need a pragmatic solution, not a perfect one.","ar":"نحتاج إلى حل عملي لا إلى حل مثالي."},{"en":"She takes a pragmatic approach to politics.","ar":"تتبنى نهجًا عمليًا في السياسة."}]},{"lv":3,"title":"Thesis Feedback","story":"The professor was candid about my thesis. He did not hide the problems or soften his words; he told me plainly that the second chapter was weak. It hurt, but I was glad he spoke so directly.","word":"candid","pos":"adjective","syn":"honest and direct, even when it is uncomfortable","options":["مجاملًا ويمدح كثيرًا","غامضًا","صريحًا وصادقًا","غاضبًا"],"answer":2,"clues":[{"q":"did not hide the problems or soften his words","why":"لم يخفِ المشكلات ولم يلطف كلامه، فهو يقول الحقيقة كما هي."},{"q":"told me plainly that the second chapter was weak","why":"أخبرني بوضوح أن الفصل ضعيف، أي أنه صريح."}],"explain_ar":"كلمة candid تصف شخصًا صريحًا وصادقًا في كلامه حتى لو كانت الحقيقة غير مريحة.","translation_ar":"كان الأستاذ صريحًا بشأن أطروحتي. لم يخفِ المشكلات ولم يلطف كلامه، بل أخبرني بوضوح أن الفصل الثاني ضعيف. كان ذلك مؤلمًا، لكنني سعدت لأنه تحدث بهذه المباشرة.","examples":[{"en":"Thank you for being so candid with me.","ar":"شكرًا لك على صراحتك الكبيرة معي."},{"en":"In a candid interview, the actor admitted his mistakes.","ar":"في مقابلة صريحة، اعترف الممثل بأخطائه."}]},{"lv":3,"title":"The Summit","story":"The tenacious climber refused to give up even after two failed attempts. Her hands were bleeding and the storm was getting worse, yet she kept going and finally reached the summit on the third day.","word":"tenacious","pos":"adjective","syn":"determined; not giving up","options":["يستسلم بسرعة","متردد","متهور","مثابر عنيد لا يستسلم"],"answer":3,"clues":[{"q":"refused to give up even after two failed attempts","why":"رفضت الاستسلام بعد محاولتين فاشلتين، فهي مثابرة."},{"q":"kept going and finally reached the summit","why":"واصلت السير رغم الألم والعاصفة حتى بلغت القمة."}],"explain_ar":"كلمة tenacious تصف شخصًا متمسكًا بهدفه بقوة ولا يستسلم بسهولة.","translation_ar":"رفضت المتسلقة المثابرة أن تستسلم حتى بعد محاولتين فاشلتين. كانت يداها تنزفان والعاصفة تزداد سوءًا، لكنها واصلت السير وبلغت القمة أخيرًا في اليوم الثالث.","examples":[{"en":"She is a tenacious lawyer who never drops a case.","ar":"هي محامية مثابرة لا تتخلى عن أي قضية."},{"en":"His tenacious spirit helped him recover.","ar":"ساعدته روحه المثابرة على التعافي."}]},{"lv":3,"title":"At the Border","story":"The customs officer began to scrutinize the passport. She held each page up to the light, compared the photo with the traveler's face, and checked the stamps one by one. The line behind the traveler grew longer and longer.","word":"scrutinize","pos":"verb","syn":"examine very carefully","options":["يفحص بدقة وتمعن","يمزق","يتجاهل","يخفي"],"answer":0,"clues":[{"q":"held each page up to the light","why":"تمسك كل صفحة أمام الضوء لتفحصها بدقة."},{"q":"checked the stamps one by one","why":"تتحقق من الأختام واحدًا واحدًا، وهذا فحص دقيق ومتأنٍّ."}],"explain_ar":"الفعل scrutinize يعني فحص شيء بعناية شديدة وبتفصيل لاكتشاف أي خطأ أو مشكلة.","translation_ar":"بدأت موظفة الجمارك تفحص جواز السفر بدقة. رفعت كل صفحة إلى الضوء، وقارنت الصورة بوجه المسافر، وتحققت من الأختام واحدًا واحدًا. وازداد الطابور خلف المسافر طولًا.","examples":[{"en":"Auditors scrutinize every company account.","ar":"يدقق المراجعون في كل حسابات الشركة."},{"en":"The critics scrutinize every word he says.","ar":"يدقق النقاد في كل كلمة يقولها."}]},{"lv":4,"title":"The New Assistant","story":"The new assistant was obsequious toward the boss. He laughed loudly at every joke, praised every idea, and ignored the cleaners completely. His colleagues found his behavior uncomfortable to watch.","word":"obsequious","pos":"adjective","syn":"overly eager to please powerful people","options":["متمرد ووقح مع رئيسه","متملق ومفرط في التذلل لإرضاء الأقوياء","خجول وهادئ","متساهل مع نفسه"],"answer":1,"clues":[{"q":"laughed loudly at every joke","why":"يضحك بصوت عالٍ على كل نكتة ليرضي المدير، وهذا تملق مبالغ فيه."},{"q":"ignored the cleaners completely","why":"يتجاهل من هم أقل مرتبة، فهو يتودد للأقوياء فقط."}],"explain_ar":"كلمة obsequious تصف شخصًا يتودد ويتملق بإفراط لمن هو أقوى منه ليكسب رضاه.","translation_ar":"كان المساعد الجديد متملقًا لرئيسه إلى حد التذلل. ضحك بصوت عالٍ على كل نكتة، ومدح كل فكرة، وتجاهل عمال النظافة تمامًا. وجد زملاؤه تصرفه مزعجًا للمشاهدة.","examples":[{"en":"The waiter was so obsequious that it felt awkward.","ar":"كان النادل متملقًا إلى درجة جعلت الموقف محرجًا."},{"en":"He gave the minister an obsequious bow.","ar":"انحنى للوزير انحناءة تملق."}]},{"lv":4,"title":"The Kitchen Inspection","story":"The inspector gave the kitchen only a perfunctory glance. He walked in, nodded at the stoves, and was out again within thirty seconds, without opening a single cupboard. Later, the owner admitted he had been lucky.","word":"perfunctory","pos":"adjective","syn":"done quickly without real care or interest","options":["دقيق ومتأنٍّ","غاضب وعدائي","سطحي وشكلي بلا اهتمام حقيقي","طويل ومتعمق"],"answer":2,"clues":[{"q":"out again within thirty seconds","why":"غادر بعد ثلاثين ثانية فقط، فالفحص كان سريعًا جدًا."},{"q":"without opening a single cupboard","why":"لم يفتح خزانة واحدة، أي أنه لم يهتم بالفحص الحقيقي."}],"explain_ar":"كلمة perfunctory تصف عملًا يُؤدّى بسرعة وبشكل شكلي فقط دون عناية أو اهتمام حقيقي.","translation_ar":"ألقى المفتش على المطبخ نظرة عابرة شكلية فقط. دخل، وأومأ نحو المواقد، وخرج في أقل من ثلاثين ثانية، دون أن يفتح خزانة واحدة. وبعد ذلك اعترف صاحب المطعم بأنه كان محظوظًا.","examples":[{"en":"She gave a perfunctory nod and walked away.","ar":"أومأت إيماءة شكلية وغادرت."},{"en":"The security check was perfunctory.","ar":"كان الفحص الأمني شكليًا وسطحيًا."}]},{"lv":4,"title":"The Cowboy's Answer","story":"The cowboy's laconic reply surprised the tourists. They asked him a long question about the ranch, the horses, and his life, and he answered with two words: 'Hard. Honest.' Then he went back to work.","word":"laconic","pos":"adjective","syn":"using very few words","options":["طويل ومفصل","مضحك","وقح","موجز بأقل عدد من الكلمات"],"answer":3,"clues":[{"q":"asked him a long question","why":"السؤال كان طويلًا، والمفاجأة أن الجواب جاء قصيرًا جدًا."},{"q":"answered with two words","why":"أجاب بكلمتين فقط، وهذا هو معنى الإيجاز الشديد."}],"explain_ar":"كلمة laconic تصف كلامًا أو شخصًا يستخدم عددًا قليلًا جدًا من الكلمات ويكتفي بالمختصر.","translation_ar":"فاجأ ردّ راعي البقر الموجز السياح. سألوه سؤالًا طويلًا عن المزرعة والخيول وحياته، فأجاب بكلمتين فقط: 'شاقة. شريفة.' ثم عاد إلى عمله.","examples":[{"en":"His laconic style made his emails very short.","ar":"جعل أسلوبه الموجز رسائله الإلكترونية قصيرة جدًا."},{"en":"She gave a laconic answer: 'No.'","ar":"أعطت جوابًا مقتضبًا: 'لا'."}]},{"lv":4,"title":"The Stubborn Mule","story":"The recalcitrant mule refused to move, no matter what the farmer tried. He pulled the rope, offered carrots, and even pushed from behind, but the animal stood still and flicked its tail.","word":"recalcitrant","pos":"adjective","syn":"stubbornly refusing to obey","options":["عنيد يرفض الانصياع للأوامر","مطيع وهادئ","مريض","خائف"],"answer":0,"clues":[{"q":"refused to move, no matter what the farmer tried","why":"يرفض التحرك مهما فعل المزارع، فهو لا يطيع."},{"q":"pulled the rope, offered carrots","why":"جرب المزارع الجذب والإغراء ولم ينفع شيء، وهذا يدل على عناد شديد."}],"explain_ar":"كلمة recalcitrant تصف شخصًا أو حيوانًا يقاوم السلطة أو التوجيه بعناد ويرفض الطاعة.","translation_ar":"رفض البغل العنيد أن يتحرك مهما حاول المزارع. شدّ الحبل، وقدّم الجزر، بل دفعه من الخلف، لكن الحيوان ظل واقفًا في مكانه وهزّ ذيله.","examples":[{"en":"The teacher struggled with a recalcitrant student.","ar":"واجه المعلم صعوبة مع طالب عنيد يرفض الانصياع."},{"en":"The recalcitrant council refused every compromise.","ar":"رفض المجلس العنيد كل تسوية."}]},{"lv":4,"title":"The Evasive Witness","story":"When the lawyer asked whether he had been at the warehouse that night, the witness began to equivocate. He spoke about the weather, about his job, and about his poor memory, but never once said yes or no. The judge finally told him to answer the question.","word":"equivocate","pos":"verb","syn":"avoid giving a clear answer","options":["يعترف بصراحة","يتهرب بكلام مراوغ دون إجابة واضحة","ينكر صراحة","يبكي بحرقة"],"answer":1,"clues":[{"q":"never once said yes or no","why":"لم يقل نعم ولا لا، فهو لا يعطي إجابة واضحة."},{"q":"told him to answer the question","why":"طلب القاضي منه أن يجيب عن السؤال لأنه كان يتهرب منه."}],"explain_ar":"الفعل equivocate يعني استخدام كلام غامض أو مراوغ عمدًا لتجنب إعطاء إجابة صريحة.","translation_ar":"عندما سأل المحامي الشاهد عما إذا كان في المستودع تلك الليلة، بدأ يراوغ في كلامه. تحدث عن الطقس وعن عمله وعن ضعف ذاكرته، لكنه لم يقل نعم أو لا ولو مرة. وأخيرًا أمره القاضي أن يجيب عن السؤال.","examples":[{"en":"Stop trying to equivocate and tell us the truth.","ar":"كفّ عن المراوغة وأخبرنا بالحقيقة."},{"en":"The politician began to equivocate when asked about taxes.","ar":"بدأ السياسي يراوغ عندما سُئل عن الضرائب."}]},{"lv":4,"title":"The Landlord","story":"The parsimonious landlord counted every coin twice. He refused to fix the leaking roof, turned off the heating in winter, and gave his tenants a single candle each at Christmas. Even his own children complained that he would not spend a penny.","word":"parsimonious","pos":"adjective","syn":"extremely unwilling to spend money","options":["كريم يهب بسخاء","غائب دائمًا","شحيح شديد البخل في الإنفاق","مهمل في عمله"],"answer":2,"clues":[{"q":"refused to fix the leaking roof","why":"رفض إصلاح السقف ليوفر المال."},{"q":"would not spend a penny","why":"لا ينفق ولو قرشًا، حتى أولاده اشتكوا من ذلك."}],"explain_ar":"كلمة parsimonious تصف شخصًا شديد البخل ويكره الإنفاق إلى حد مبالغ فيه.","translation_ar":"كان المالك الشحيح يعد كل عملة معدنية مرتين. رفض إصلاح السقف المتسرب، وأطفأ التدفئة في الشتاء، وأعطى كل مستأجر شمعة واحدة فقط في عيد الميلاد. حتى أولاده اشتكوا من أنه لا ينفق ولو قرشًا.","examples":[{"en":"The parsimonious owner paid his workers as little as possible.","ar":"كان المالك الشحيح يدفع لعماله أقل ما يمكن."},{"en":"She was parsimonious with praise.","ar":"كانت شحيحة في المديح."}]},{"lv":4,"title":"The Creeping Weed","story":"The pernicious weed spread quietly under the garden. At first the roses seemed healthy, but within a year its roots had choked the soil, and one by one the plants withered and died. By the time the gardener noticed, it was too late.","word":"pernicious","pos":"adjective","syn":"harmful in a gradual, hidden way","options":["مفيد ومغذٍّ","جميل المنظر","سريع الاشتعال","ضار ومدمر بشكل خفي وتدريجي"],"answer":3,"clues":[{"q":"its roots had choked the soil","why":"جذورها خنقت التربة، أي أنها سببت ضررًا كبيرًا."},{"q":"one by one the plants withered and died","why":"ماتت النباتات واحدًا تلو الآخر، فالضرر كان تدريجيًا وقاتلًا."}],"explain_ar":"كلمة pernicious تصف شيئًا ضارًا جدًا، وغالبًا يؤذي ببطء وبطريقة خفية لا تُلاحظ إلا متأخرًا.","translation_ar":"انتشر العشب الضار بهدوء تحت الحديقة. في البداية بدت الورود سليمة، لكن في غضون عام خنقت جذوره التربة، وذبلت النباتات وماتت واحدة تلو الأخرى. وعندما لاحظ البستاني الأمر كان قد فات الأوان.","examples":[{"en":"Rumors can have a pernicious effect on a team.","ar":"قد يكون للشائعات أثر مدمر خفي في الفريق."},{"en":"The pernicious habit slowly ruined his health.","ar":"أفسدت العادة الضارة صحته ببطء."}]}],"map":[{"id":"lit","ar":"الأدب","en":"Literature","c":"#a78bfa","topics":[{"id":"lit_poetry","en":"Poetry","ar":"الشعر","hint":"مفردات لوصف القصائد وأشكالها وصورها الفنية.","words":[{"en":"stanza","ar":"مقطع شعري","ex":"The poem is divided into four stanzas of six lines each.","exar":"تنقسم القصيدة إلى أربعة مقاطع شعرية، يتألف كل منها من ستة أسطر."},{"en":"meter","ar":"الوزن الشعري","ex":"Classical Arabic poetry follows a strict meter.","exar":"يلتزم الشعر العربي الكلاسيكي بوزن صارم."},{"en":"elegy","ar":"مرثية","ex":"He composed an elegy for his late friend.","exar":"ألّف مرثية لصديقه الراحل."},{"en":"sonnet","ar":"سونيتة (قصيدة من أربعة عشر سطراً)","ex":"A Shakespearean sonnet has fourteen lines.","exar":"تتألف السونيتة الشكسبيرية من أربعة عشر سطراً."},{"en":"couplet","ar":"بيتان متقفّيان","ex":"The poem ends with a rhyming couplet.","exar":"تنتهي القصيدة ببيتين متقفّيين."},{"en":"alliteration","ar":"الجناس الاستهلالي (تكرار الصوت الأول)","ex":"The phrase 'safe and sound' is a simple example of alliteration.","exar":"عبارة 'سالم ومعافى' بالإنجليزية مثال بسيط على الجناس الاستهلالي."},{"en":"imagery","ar":"الصور الشعرية","ex":"Her poetry is rich in vivid imagery of the sea.","exar":"يزخر شعرها بصور حيّة عن البحر."},{"en":"ode","ar":"قصيدة غنائية في التمجيد","ex":"Keats wrote an ode to a nightingale.","exar":"كتب كيتس قصيدة غنائية إلى العندليب."}],"exprs":[{"en":"poetic license","ar":"الحرية الفنية (خروج الأديب عن الحقيقة أو القواعد لغرض فني)","ex":"The author took some poetic license with historical facts.","exar":"أخذ المؤلف حرية فنية مع الحقائق التاريخية."},{"en":"read between the lines","ar":"القراءة بين السطور","ex":"You have to read between the lines to understand what the poet really feels.","exar":"عليك أن تقرأ بين السطور لتفهم ما يشعر به الشاعر حقاً."},{"en":"strike a chord","ar":"لامس وتراً حساساً (وجد صدى)","ex":"Her verses struck a chord with a whole generation.","exar":"وجدت أبياتها صدى لدى جيل كامل."}],"scenes":[{"en":"Could you read that last line aloud again?","ar":"هل يمكنك أن تقرأ السطر الأخير بصوت عالٍ مرة أخرى؟"},{"en":"I memorized this poem when I was a student.","ar":"حفظتُ هذه القصيدة حين كنت طالباً."}]},{"id":"lit_novel","en":"The Novel","ar":"الرواية","hint":"مفردات للحديث عن الشخصيات والحبكة وبناء الرواية.","words":[{"en":"protagonist","ar":"الشخصية الرئيسية (البطل)","ex":"The protagonist of the novel is a young teacher in Cairo.","exar":"بطل الرواية معلمة شابة في القاهرة."},{"en":"antagonist","ar":"الشخصية المناوئة (الخصم)","ex":"The antagonist is not a person but the harsh desert itself.","exar":"الخصم في الرواية ليس شخصاً بل الصحراء القاسية نفسها."},{"en":"subplot","ar":"حبكة فرعية","ex":"A romantic subplot runs through the second half of the book.","exar":"تمتد حبكة فرعية عاطفية عبر النصف الثاني من الكتاب."},{"en":"foreshadowing","ar":"التمهيد للأحداث (التلميح المسبق)","ex":"The storm in chapter one is foreshadowing of the tragedy to come.","exar":"العاصفة في الفصل الأول تمهيد للمأساة القادمة."},{"en":"epilogue","ar":"خاتمة (فصل ختامي بعد النهاية)","ex":"The epilogue shows the characters twenty years later.","exar":"تُظهر الخاتمة الشخصيات بعد عشرين عاماً."},{"en":"sequel","ar":"الجزء التالي (تتمة)","ex":"The sequel was even more successful than the first novel.","exar":"حقق الجزء التالي نجاحاً أكبر من الرواية الأولى."},{"en":"manuscript","ar":"مخطوطة","ex":"She sent her manuscript to several publishers.","exar":"أرسلت مخطوطتها إلى عدة ناشرين."},{"en":"prose","ar":"النثر","ex":"His prose is clear, elegant and full of humor.","exar":"نثره واضح وأنيق ومليء بالفكاهة."}],"exprs":[{"en":"page-turner","ar":"كتاب مشوّق يصعب تركه","ex":"This thriller is a real page-turner.","exar":"هذه الرواية المثيرة مشوّقة حقاً ويصعب تركها."},{"en":"judge a book by its cover","ar":"الحكم على الشيء من مظهره","ex":"Don't judge a book by its cover; the story is wonderful.","exar":"لا تحكم على الكتاب من غلافه؛ فالقصة رائعة."},{"en":"turn the page","ar":"طيّ الصفحة (بدء مرحلة جديدة)","ex":"After the divorce, she decided to turn the page and start over.","exar":"بعد الطلاق قررت أن تطوي الصفحة وتبدأ من جديد."}],"scenes":[{"en":"I couldn't put this novel down until I finished it.","ar":"لم أستطع ترك هذه الرواية حتى أنهيتها."},{"en":"Who is your favorite character in the book?","ar":"من شخصيتك المفضلة في الكتاب؟"}]},{"id":"lit_drama","en":"Drama and Theatre","ar":"الدراما والمسرح","hint":"مفردات عن النصوص المسرحية والتمثيل والعمل خلف الكواليس.","words":[{"en":"playwright","ar":"مؤلف مسرحي","ex":"The playwright attended every rehearsal of his new play.","exar":"حضر المؤلف المسرحي كل بروفات مسرحيته الجديدة."},{"en":"soliloquy","ar":"مناجاة النفس (حديث الممثل مع نفسه على الم nt wasn't necessary. We'll have to talk about this again.","sayAr":"شهر كامل أمر غير وارد، وذلك التعليق لم يكن لازمًا. سيتعين علينا أن نتحدث في هذا مرة أخرى."},{"t":"Three days would be perfect. I'll submit it by Monday morning. Thank you for understanding.","fit":"good","note":"مدة محددة وموعد التزام واضح مع شكر. هذا ما يطمئن الأستاذ، ويُنطق Monday بنبرة واثقة.","say":"That's fine. Monday morning it is. Take care of yourself.","sayAr":"لا بأس. إذن صباح الاثنين. اعتنِ بنفسك."},{"t":"Maybe a week? Or as long as possible, I don't know.","fit":"ok","note":"التردد وعدم تحديد موعد ثابت يجعلان الطلب ضعيفًا. الأفضل اقتراح رقم محدد.","say":"I can give you until Friday, no later. Please don't be late again.","sayAr":"يمكنني منحك حتى يوم الجمعة، لا أكثر. من فضلك لا تتأخر مرة أخرى."}]}]},{"cat":"university","label":"التعرّف على زميل جديد","intro":{"en":"Hi there! I don't think we've met. I'm Sam.","ar":"مرحبًا! أظن أننا لم نلتقِ من قبل. أنا سام."},"turns":[{"opts":[{"t":"I am Omar. Nice to meet you.","fit":"ok","note":"جملة صحيحة لكنها رسمية وجامدة بين زملاء. يفضّل I'm Omar بالاختصار وإضافة جملة عن نفسك.","say":"Nice to meet you too. So, what are you majoring in?","sayAr":"سررت بمعرفتك أيضًا. إذن، ما تخصصك؟"},{"t":"Okay. Why do you want to know my name?","fit":"off","note":"ردّ عدائي على تحية ودّية. التعارف بين الطلاب أمر عادي، والريبة هنا غير مناسبة.","say":"Oh, sorry, I was just being friendly. So, what are you majoring in?","sayAr":"آه، آسف، كنت أحاول أن أكون ودودًا فقط. إذن، ما تخصصك؟"},{"t":"Nice to meet you, Sam! I'm Omar. I just joined this course.","fit":"good","note":"تحية دافئة مع اسمك ومعلومة بسيطة، وهذا يفتح الحديث. ويُشدَّد على Nice وmeet.","say":"Welcome, Omar! Great to have you. So, what are you majoring in?","sayAr":"أهلًا بك يا عمر! يسعدنا وجودك. إذن، ما تخصصك؟"}]},{"opts":[{"t":"Computer science.","fit":"ok","note":"إجابة صحيحة لكنها قصيرة جدًا ولا تُكمل الحوار. أضف سؤالًا مثل How about you.","say":"Cool. Do you want to study together sometime?","sayAr":"رائع. هل تود أن ندرس معًا في وقت ما؟"},{"t":"Why do you ask? That's personal.","fit":"off","note":"سؤال التخصص عادي جدًا بين الطلاب، فاعتباره شخصيًا يبدو غريبًا ويقطع الحديث.","say":"Oh, okay, no problem. Do you want to study together sometime?","sayAr":"آه، حسنًا، لا مشكلة. هل تود أن ندرس معًا في وقت ما؟"},{"t":"I'm majoring in computer science. How about you?","fit":"good","note":"إجابة كاملة مع سؤال مقابل، وهذا أسلوب طبيعي يُبقي الحوار متبادلًا.","say":"Oh nice, I'm in engineering, so we're neighbours! Do you want to study together sometime?","sayAr":"رائع، أنا في الهندسة، فنحن جيران! هل تود أن ندرس معًا في وقت ما؟"}]},{"opts":[{"t":"No, I prefer studying alone. Please don't ask me again.","fit":"off","note":"الرفض ممكن، لكن الأسلوب فظّ وغير ضروري. يمكن الاعتذار بلطف إن لم ترغب.","say":"Oh. Alright, sorry I asked. See you around.","sayAr":"آه. حسنًا، آسف لأنني سألت. أراك لاحقًا."},{"t":"That sounds great! Let's swap numbers and set up a time.","fit":"good","note":"قبول حماسي واقتراح عملي. العبارة Let's swap numbers شائعة جدًا بين الأصدقاء.","say":"Perfect! I'll text you tonight. See you in class!","sayAr":"ممتاز! سأرسل لك رسالة الليلة. أراك في المحاضرة!"},{"t":"Yes, maybe. Give me your number.","fit":"ok","note":"القبول واضح لكن الصيغة آمرة. استعمل Could I get your number لتبدو ألطف.","say":"Sure, here you go. Talk soon.","sayAr":"بالطبع، تفضّل. نتحدث قريبًا."}]}]},{"cat":"university","label":"طلب مصادر بحثية من أمينة المكتبة","intro":{"en":"Good morning. Can I help you find anything?","ar":"صباح الخير. هل يمكنني مساعدتك في العثور على شيء؟"},"turns":[{"opts":[{"t":"I need books about energy for my paper.","fit":"ok","note":"مفهوم لكنه غامض وجاف. ذكر الموضوع الدقيق يساعد أمينة المكتبة على إرشادك بسرعة.","say":"Sure, I can help with that. Are you looking for books or articles?","sayAr":"بالطبع، يمكنني مساعدتك. هل تبحث عن كتب أم مقالات؟"},{"t":"Yes, please. I'm writing a paper on renewable energy, and I'm not sure where to start.","fit":"good","note":"تحدد موضوعك وتعترف بحاجتك إلى الإرشاد بلطف. العبارة I'm not sure where to start تستدعي المساعدة بشكل طبيعي.","say":"Happy to help, that's a great topic! Are you looking for books or articles?","sayAr":"يسعدني ذلك، إنه موضوع رائع! هل تبحث عن كتب أم مقالات؟"},{"t":"Yeah, I need the answers for my homework. Can you just print them?","fit":"off","note":"المكتبة تساعد في البحث ولا تعطي إجابات الواجبات، وطلب ذلك يجعلك تبدو غير مبالٍ بالتعلم.","say":"Ah, I can't do that, but I can show you where to research. Are you looking for books or articles?","sayAr":"آه، لا أستطيع فعل ذلك، لكن يمكنني أن أريك أين تبحث. هل تبحث عن كتب أم مقالات؟"}]},{"opts":[{"t":"Wikipedia is fine. I just need it fast.","fit":"off","note":"المصادر الأكاديمية لا تعتمد على ويكيبيديا، وذكر ذلك أمام أمينة المكتبة يضعف مصداقية بحثك.","say":"Hmm, for a university paper you'll need stronger sources. Do you know how to use our online database?","sayAr":"همم، في بحث جامعي ستحتاج إلى مصادر أقوى. هل تعرف كيف تستخدم قاعدة بياناتنا الإلكترونية؟"},{"t":"Mostly recent journal articles, but a couple of books would help too.","fit":"good","note":"طلب دقيق يوفّر الوقت على الطرفين. كلمة recent تحدد حداثة المصادر المطلوبة.","say":"Excellent, that's very clear. Do you know how to use our online database?","sayAr":"ممتاز، هذا واضح جدًا. هل تعرف كيف تستخدم قاعدة بياناتنا الإلكترونية؟"},{"t":"Whatever you have. Anything is fine.","fit":"ok","note":"الجواب مهذب لكنه لا يفيد في التحديد، وقد تضطر أمينة المكتبة إلى طرح أسئلة إضافية.","say":"Okay, we'll start broad then. Do you know how to use our online database?","sayAr":"حسنًا، سنبدأ ببحث واسع إذن. هل تعرف كيف تستخدم قاعدة بياناتنا الإلكترونية؟"}]},{"opts":[{"t":"A little. Can you help me?","fit":"ok","note":"الطلب مقبول لكنه مقتضب. ويكون ألطف إذا سبقه Not really أو أُضيف إليه please.","say":"Of course. Take a seat and I'll walk you through it.","sayAr":"بالطبع. اجلس وسأشرح لك الخطوات."},{"t":"I don't need to. Just search it and write down the results for me.","fit":"off","note":"أمينة المكتبة تدرّبك على البحث ولا تنوب عنك، والصيغة هنا آمرة وغير مهذبة.","say":"I'm afraid that's not how it works, but I'll gladly show you how to do it yourself.","sayAr":"أخشى أن الأمر لا يجري هكذا، لكن يسعدني أن أريك كيف تفعل ذلك بنفسك."},{"t":"Not really. Could you show me how to search it?","fit":"good","note":"اعتراف صريح وطلب مهذب بصيغة Could you. الأمينة تحب هذا النوع من الأسئلة.","say":"Absolutely. It's easy once you try it. Come over to this computer.","sayAr":"بكل تأكيد. الأمر سهل بعد التجربة. تعال إلى هذا الحاسوب."}]}]},{"cat":"social","label":"دعوة صديق إلى العشاء","intro":{"en":"Hey, good to see you! What's up?","ar":"مرحبًا، سعدت برؤيتك! ما الأخبار؟"},"turns":[{"opts":[{"t":"Nothing, why do you care? Anyway, you're coming to dinner on Friday.","fit":"off","note":"النبرة حادة، ثم تُفرض الدعوة فرضًا. الدعوة تحتاج إلى لطف وترك مجال للرد.","say":"Whoa, okay! That's quite an invitation. What did you have in mind?","sayAr":"يا للعجب! هذه دعوة غريبة. ماذا كنت تخطط؟"},{"t":"Not much! Actually, I was hoping we could catch up properly.","fit":"good","note":"عبارة catch up تعني تبادل الأخبار بعد غياب، وهي تمهّد للدعوة بلطف.","say":"Oh, I'd love that! What did you have in mind?","sayAr":"آه، أحب ذلك! ماذا كنت تخطط؟"},{"t":"Nothing. I want to invite you to dinner.","fit":"ok","note":"الدعوة صريحة ومفهومة لكنها مباشرة بلا تمهيد. بين الأصدقاء يفضّل تلطيفها.","say":"Oh, nice, thanks! What did you have in mind?","sayAr":"آه، رائع، شكرًا! ماذا كنت تخطط؟"}]},{"opts":[{"t":"Come to dinner Friday. My place.","fit":"ok","note":"المضمون سليم لكن الأسلوب مختصر كأنه أمر. استعمل How about لتبدو دعوة وليست تعليمات.","say":"Sounds good. What time should I come?","sayAr":"يبدو جيدًا. في أي ساعة آتي؟"},{"t":"How about dinner at my place on Friday? I'll cook.","fit":"good","note":"How about صيغة اقتراح ودّية، وعرض الطبخ يضيف دفئًا إلى الدعوة.","say":"That sounds wonderful, I'd love to! What time should I come?","sayAr":"يبدو رائعًا، يسعدني ذلك! في أي ساعة آتي؟"},{"t":"Let's go to a restaurant, and you pay, okay?","fit":"off","note":"من يدعو يتحمل التكلفة عادة. أن تطلب من المدعو الدفع يناقض معنى الدعوة.","say":"Ha, I thought you were inviting me! Well, let's see. What time should I come?","sayAr":"ها، ظننت أنك تدعوني! حسنًا، لنرَ. في أي ساعة آتي؟"}]},{"opts":[{"t":"Whenever. I'll text you at the last minute, maybe.","fit":"off","note":"عدم تحديد موعد والتلويح بالإبلاغ في آخر لحظة يُظهر قلة اهتمام بالضيف.","say":"Hmm, I'd rather know ahead of time. Let's talk later.","sayAr":"همم، أفضّل أن أعرف مسبقًا. لنتحدث لاحقًا."},{"t":"Seven.","fit":"ok","note":"الجواب مفهوم لكنه مقتضب جدًا. الأجمل أن تقول Around seven, does that work.","say":"Okay, seven it is. See you then.","sayAr":"حسنًا، السابعة إذن. أراك حينها."},{"t":"Around seven? Does that work for you?","fit":"good","note":"كلمة Around تجعل الموعد مرنًا، والسؤال الأخير يراعي ظروف صديقك.","say":"Seven is perfect! I'll bring dessert. Can't wait!","sayAr":"السابعة مناسبة تمامًا! سأحضر الحلوى. لا أطيق الانتظار!"}]}]},{"cat":"social","label":"الاعتذار لصديق عن موعد فائت","intro":{"en":"Oh, hi. I waited for you for an hour yesterday.","ar":"آه، مرحبًا. انتظرتك ساعة كاملة أمس."},"turns":[{"opts":[{"t":"It's not a big deal. You could have texted me.","fit":"off","note":"التقليل من الأمر وإلقاء اللوم على الصديق ردّ غير لائق، فالمخطئ هنا هو أنت.","say":"Not a big deal? I was standing there for an hour. So, what happened?","sayAr":"ليس أمرًا مهمًا؟ كنت واقفًا هناك ساعة كاملة. إذن، ماذا حدث؟"},{"t":"Sorry, I forgot.","fit":"ok","note":"اعتذار صحيح لكنه سريع ويبدو غير مبالٍ. زد عليه عبارة مثل I feel terrible.","say":"Hmm, okay. So, what happened?","sayAr":"همم، حسنًا. إذن، ماذا حدث؟"},{"t":"I'm so sorry about yesterday. I feel terrible for leaving you waiting.","fit":"good","note":"اعتذار صادق يُظهر الشعور بالذنب. وتُشدَّد كلمة so في I'm so sorry للتعبير عن الأسف.","say":"Thanks for saying that. So, what happened?","sayAr":"شكرًا على قولك ذلك. إذن، ماذا حدث؟"}]},{"opts":[{"t":"I was busy, that's all.","fit":"ok","note":"السبب غامض ولا يقنع. الصديق يريد تفسيرًا حقيقيًا مع تحمّل المسؤولية.","say":"Busy? You could have let me know. How are you going to make it up to me?","sayAr":"مشغول؟ كان بإمكانك أن تخبرني. كيف ستعوّضني؟"},{"t":"My phone died and I lost track of time. I should have let you know.","fit":"good","note":"سبب معقول مع اعتراف بالتقصير. وعبارة I should have تعبّر عن الندم بطريقة طبيعية.","say":"Okay, that makes sense. It happens. How are you going to make it up to me?","sayAr":"حسنًا، هذا مفهوم. هذه الأمور تحدث. كيف ستعوّضني؟"},{"t":"I was out with other friends and I didn't feel like coming.","fit":"off","note":"الصدق جيد لكن هذا الجواب يجرح الصديق، فلا ينسجم مع الاعتذار.","say":"Wow. That hurts, honestly. How are you going to make it up to me?","sayAr":"يا للأسف. هذا مؤلم، بصراحة. كيف ستعوّضني؟"}]},{"opts":[{"t":"I'll come next time, okay?","fit":"ok","note":"وعد عام بلا خطوة ملموسة. التعويض الحقيقي يتطلب اقتراحًا محددًا.","say":"Okay, let's see if you do. Don't forget again.","sayAr":"حسنًا، لنرَ إن كنت ستفعل. لا تنسَ مرة أخرى."},{"t":"Why would I need to? You can just wait again.","fit":"off","note":"جواب وقح يزيد الخلاف، ويدل على أنك لا تقدّر وقت صديقك.","say":"Unbelievable. I think I need some space. Goodbye.","sayAr":"لا يُصدَّق. أظنني أحتاج إلى بعض الوقت وحدي. إلى اللقاء."},{"t":"Let me buy you lunch tomorrow, and I promise I'll set a reminder.","fit":"good","note":"اقتراح تعويض عملي ووعد واضح. العبارة make it up to you مرتبطة بهذا النوع من المواقف.","say":"That's kind of you. Lunch sounds good. Apology accepted!","sayAr":"هذا لطف منك. الغداء فكرة جيدة. اعتذارك مقبول!"}]}]},{"cat":"social","label":"حديث عابر مع غريب في حفلة","intro":{"en":"Great party, isn't it? I don't think we've met.","ar":"حفلة رائعة، أليس كذلك؟ أظن أننا لم نلتقِ من قبل."},"turns":[{"opts":[{"t":"Honestly, it's boring. I'm only here for the food.","fit":"off","note":"انتقاد الحفلة أمام غريب قد يكون صاحبها صديقه، وهذا يقطع الحديث في بدايته.","say":"Oh, really? Well, to each their own. So, how do you know the host?","sayAr":"حقًا؟ حسنًا، لكل ذوقه. إذن، كيف تعرفين صاحب الحفلة؟"},{"t":"It really is! I'm Lina, by the way. Nice to meet you.","fit":"good","note":"موافقة ودّية مع تعريف بالنفس. عبارة by the way تجعل التعريف طبيعيًا.","say":"Nice to meet you, Lina! I'm Dan. So, how do you know the host?","sayAr":"سررت بمعرفتك يا لينا! أنا دان. إذن، كيف تعرفين صاحب الحفلة؟"},{"t":"Yes. The music is good.","fit":"ok","note":"ردّ مهذب لكنه لا يفتح باب الحديث. أضف اسمك أو سؤالًا ليستمر الحوار.","say":"Yeah, it is! I'm Dan, by the way. So, how do you know the host?","sayAr":"نعم، إنها جيدة! أنا دان، بالمناسبة. إذن، كيف تعرفين صاحب الحفلة؟"}]},{"opts":[{"t":"He is my friend.","fit":"ok","note":"جملة صحيحة لكنها بسيطة وجامدة. إضافة تفصيل صغير تجعل الحديث أحلى.","say":"Oh nice. Well, it's been nice talking to you. Have you tried the food yet?","sayAr":"آه، جميل. حسنًا، سعدت بالحديث معك. هل جرّبتِ الطعام بعد؟"},{"t":"I don't, I just came for the free food and drinks.","fit":"off","note":"الصراحة المبالغة مع غريب تبدو وقاحة، خاصة إذا كان من أصدقاء صاحب الحفلة.","say":"Ha, well, honest at least. Have you tried the food yet?","sayAr":"ها، حسنًا، صريحة على الأقل. هل جرّبتِ الطعام بعد؟"},{"t":"We used to be neighbours. We've known each other for years.","fit":"good","note":"معلومة شخصية بسيطة تمنح الطرف الآخر ما يعلّق عليه. ويُنطق neighbours بنبرة ودّية.","say":"That's lovely, long friendships are the best. Have you tried the food yet?","sayAr":"هذا جميل، الصداقات الطويلة هي الأفضل. هل جرّبتِ الطعام بعد؟"}]},{"opts":[{"t":"Yes, and it was awful. I can't believe they served it.","fit":"off","note":"إهانة الطعام في حفلة يضيّفها شخص قد يكون قريبًا منك أمر غير لائق.","say":"Oh. Well, I'd better go find my friends. Enjoy your evening.","sayAr":"آه. حسنًا، من الأفضل أن أذهب لأبحث عن أصدقائي. أتمنى لك أمسية طيبة."},{"t":"Not yet, but it smells amazing. Shall we go and see?","fit":"good","note":"ردّ لطيف يتضمن اقتراحًا ودّيًا. وSmells amazing تعبير شائع عن الإعجاب بالطعام.","say":"Sure, let's go! Lead the way. Nice chatting with you!","sayAr":"بالتأكيد، هيا بنا! تقدّمي. سعدت بالدردشة معك!"},{"t":"No. I will go eat now.","fit":"ok","note":"الجواب صحيح لكنه يُنهي الحديث بشكل مفاجئ. الأفضل أن تلطّفه بابتسامة أو دعوة.","say":"Okay, enjoy! It was nice meeting you.","sayAr":"حسنًا، بالهناء! سعدت بلقائك."}]}]},{"cat":"work","label":"مقابلة عمل","intro":{"en":"Thanks for coming in. Please have a seat. Tell me a little about yourself.","ar":"شكرًا لحضورك. تفضّل بالجلوس. حدّثني قليلًا عن نفسك."},"turns":[{"opts":[{"t":"I am Ali. I graduated and I worked two years.","fit":"ok","note":"المعنى مفهوم لكن في الصياغة أخطاء ولا تبرز إنجازاتك. استعمل I have two years of experience.","say":"Thank you. Why do you want to work for us?","sayAr":"شكرًا لك. لماذا ترغب في العمل لدينا؟"},{"t":"Well, my life is long. I like gaming and sleeping.","fit":"off","note":"المقابلة تتطلب معلومات مهنية، والهوايات غير المرتبطة بالعمل لا تخدمك هنا.","say":"I see. Let's move on. Why do you want to work for us?","sayAr":"أفهم. لننتقل إلى غيره. لماذا ترغب في العمل لدينا؟"},{"t":"Thank you for having me. I'm a marketing graduate with two years of experience in social media.","fit":"good","note":"شكر ثم تلخيص مهني مركّز. هذا ما يتوقعه المحاور في سؤال Tell me about yourself.","say":"That's a strong background, thank you. Why do you want to work for us?","sayAr":"هذه خلفية قوية، شكرًا لك. لماذا ترغب في العمل لدينا؟"}]},{"opts":[{"t":"Honestly, the salary. I'd leave if I found a better offer.","fit":"off","note":"التصريح بأنك قد تغادر عند أول عرض أفضل ينفّر أصحاب العمل، حتى لو كان صادقًا.","say":"Hmm, I see. What would you say is your greatest strength?","sayAr":"همم، أفهم. ما أكبر نقاط قوتك برأيك؟"},{"t":"I need a job, and your company is good.","fit":"ok","note":"الجواب بسيط وغير مقنع، ولا يُظهر أنك بحثت عن الشركة أو ما تقدّمه لها.","say":"Okay, thank you. What would you say is your greatest strength?","sayAr":"حسنًا، شكرًا لك. ما أكبر نقاط قوتك برأيك؟"},{"t":"I admire your brand, and I'd like to grow with a team that values creativity.","fit":"good","note":"إظهار الإعجاب بالشركة والرغبة في التطور جواب ناضج. استعمل admire وgrow with.","say":"That's great to hear, we do value that. What would you say is your greatest strength?","sayAr":"يسعدني سماع ذلك، فنحن نقدّر هذا فعلًا. ما أكبر نقاط قوتك برأيك؟"}]},{"opts":[{"t":"I'm organised and I learn quickly. I always meet my deadlines.","fit":"good","note":"صفات محددة وقابلة للإثبات. كلمة deadlines مهمة في بيئة العمل.","say":"That's exactly what we're looking for. Thank you, we'll be in touch soon.","sayAr":"هذا بالضبط ما نبحث عنه. شكرًا لك، سنتواصل معك قريبًا."},{"t":"Strengths? I'm not sure. Do you have an easier question?","fit":"off","note":"التهرب من السؤال وطلب سؤال أسهل يدل على ضعف الاستعداد.","say":"Well, it's a standard question. Anyway, thanks for your time. We'll be in touch.","sayAr":"حسنًا، إنه سؤال معتاد. على كل حال، شكرًا لوقتك. سنتواصل معك."},{"t":"I am good at everything.","fit":"ok","note":"الادعاء العام بلا مثال يبدو مبالغة ولا يقنع المحاور. اذكر صفة واحدة ودعّمها بمثال.","say":"Hmm, all right. Thank you for your time. We'll be in touch.","sayAr":"همم، حسنًا. شكرًا لوقتك. سنتواصل معك."}]}]},{"cat":"work","label":"طلب إجازة من المدير","intro":{"en":"Hi, you wanted to see me?","ar":"مرحبًا، هل أردت رؤيتي؟"},"turns":[{"opts":[{"t":"I want some days off.","fit":"ok","note":"الطلب واضح لكنه فجّ، فلا استئذان فيه ولا تمهيد. الأفضل البدء بـ I was wondering.","say":"Okay, let's talk about it. When were you thinking of going?","sayAr":"حسنًا، لنتحدث في ذلك. متى كنت تفكر في الذهاب؟"},{"t":"Yes, if you have a minute. I'd like to ask about taking some time off.","fit":"good","note":"استئذان مهذب وعبارة take some time off هي الأشيع في بيئة العمل.","say":"Of course, come in. Let's talk. When were you thinking of going?","sayAr":"بالطبع، تفضّل. لنتحدث. متى كنت تفكر في الذهاب؟"},{"t":"Yes, I'm taking next week off. Just letting you know.","fit":"off","note":"إبلاغ المدير بقرار نهائي بدل طلب الموافقة يُعدّ تجاوزًا وقلة احترام.","say":"Oh, is that so? We should discuss that first. When were you thinking of going?","sayAr":"آه، هل الأمر كذلك؟ ينبغي أن نناقش هذا أولًا. متى كنت تفكر في الذهاب؟"}]},{"opts":[{"t":"I haven't decided. I'll just skip the days I don't feel like coming.","fit":"off","note":"هذا ليس طلب إجازة بل تصريح بالتغيّب، وهو غير مقبول مهنيًا.","say":"That's not how it works, I'm afraid. Will your work be covered while you're away?","sayAr":"هذا ليس كيف تجري الأمور، للأسف. هل سيتم تغطية عملك أثناء غيابك؟"},{"t":"Next week, five days.","fit":"ok","note":"معلومة كافية لكنها مقتضبة، ولا تذكر السبب. التفصيل يسهّل الموافقة.","say":"Alright. Will your work be covered while you're away?","sayAr":"حسنًا. هل سيتم تغطية عملك أثناء غيابك؟"},{"t":"From the 12th to the 16th. My sister is getting married.","fit":"good","note":"تاريخان واضحان وسبب مفهوم. وتُقرأ the 12th بنطق twelfth.","say":"Congratulations to your sister! Will your work be covered while you're away?","sayAr":"مبروك لشقيقتك! هل سيتم تغطية عملك أثناء غيابك؟"}]},{"opts":[{"t":"I think so. Someone can do it.","fit":"ok","note":"الجواب غير مقنع وغير محدد، فلا يطمئن المدير إلى سير العمل.","say":"I'd like a clearer plan first, but I'll consider it. Let me know.","sayAr":"أريد خطة أوضح أولًا، لكنني سأفكر في الأمر. أخبرني."},{"t":"That's not my problem. They can wait until I'm back.","fit":"off","note":"عدم الاكتراث بمسؤولية العمل يضرّ بفرصتك في الحصول على الإجازة.","say":"I'm sorry, but I can't approve leave with that attitude. Please think again.","sayAr":"أنا آسف، لكن لا يمكنني الموافقة على إجازة بهذا الموقف. أرجو أن تعيد التفكير."},{"t":"Yes, I'll finish my reports beforehand and brief Sara on the rest.","fit":"good","note":"خطة محددة تُظهر مسؤوليتك. الفعل brief يعني إطلاع زميل على التفاصيل.","say":"Perfect, that's very responsible. Your leave is approved. Enjoy the wedding!","sayAr":"ممتاز، هذا تصرف مسؤول جدًا. تمت الموافقة على إجازتك. استمتع بالزفاف!"}]}]},{"cat":"work","label":"إخبار زميل بتأخر إنجاز مهمة","intro":{"en":"Hey, do you have the report ready for the meeting?","ar":"مرحبًا، هل التقرير جاهز للاجتماع؟"},"turns":[{"opts":[{"t":"Oh, that? I haven't even started. Whatever.","fit":"off","note":"التهاون في الجواب يزعج الزميل، خاصة والاجتماع قريب. المسؤولية تتطلب أسفًا وتوضيحًا.","say":"Seriously? That's not good. How late are we talking?","sayAr":"هل تمزح؟ هذا ليس جيدًا. كم سيتأخر؟"},{"t":"Actually, I need to let you know it's going to be a bit late. I'm sorry.","fit":"good","note":"إبلاغ مبكر مع اعتذار، وعبارة a bit late تخفف وقع الخبر.","say":"Thanks for telling me early. How late are we talking?","sayAr":"شكرًا لأنك أخبرتني مبكرًا. كم سيتأخر؟"},{"t":"No, it's not ready. It will be late.","fit":"ok","note":"المعلومة صحيحة لكن الصياغة مباشرة بلا اعتذار، وقد تبدو باردة.","say":"Oh, okay. How late are we talking?","sayAr":"آه، حسنًا. كم سيتأخر؟"}]},{"opts":[{"t":"Tomorrow, maybe. There's a data problem.","fit":"ok","note":"أعطيت سببًا وموعدًا لكن التردد في maybe يضعف الثقة. حدّد ساعة واضحة.","say":"Alright. Is there anything I can do to help?","sayAr":"حسنًا. هل هناك ما يمكنني فعله للمساعدة؟"},{"t":"No idea. It'll be done when it's done.","fit":"off","note":"عدم تحديد أي موعد وبهذه النبرة يُفقد زملاءك القدرة على التخطيط.","say":"That's not very helpful. Is there anything I can do to help?","sayAr":"هذا ليس مفيدًا كثيرًا. هل هناك ما يمكنني فعله للمساعدة؟"},{"t":"I should have it done by tomorrow noon. I ran into a problem with the data.","fit":"good","note":"موعد محدد وسبب موجز. العبارة ran into a problem تعني واجهت مشكلة بشكل غير متوقع.","say":"Okay, thanks for being clear about it. Is there anything I can do to help?","sayAr":"حسنًا، شكرًا لوضوحك. هل هناك ما يمكنني فعله للمساعدة؟"}]},{"opts":[{"t":"Yes, you could do the whole thing for me.","fit":"off","note":"تحميل الزميل المهمة كلها طلب غير معقول، ويتجاهل أنك صاحب المسؤولية.","say":"Ha, I don't think so. Just get it done as soon as you can.","sayAr":"ها، لا أظن ذلك. أنجزه فقط في أسرع وقت ممكن."},{"t":"No, it's fine. I will do it alone.","fit":"ok","note":"رفض المساعدة ممكن، لكن قبولها عند الحاجة أنفع. الأسلوب هنا جاف قليلًا.","say":"Okay. Let me know if you change your mind. Good luck.","sayAr":"حسنًا. أخبرني إن غيّرت رأيك. بالتوفيق."},{"t":"Thanks, that's kind. Could you send me last month's figures? That would speed things up.","fit":"good","note":"شكر وطلب محدد يوضح كيف يمكن للزميل أن يساعد فعلًا.","say":"Sure, I'll send them right now. Hope it goes smoothly!","sayAr":"بالتأكيد، سأرسلها الآن. آمل أن يسير الأمر بسلاسة!"}]}]},{"cat":"travel","label":"إنهاء إجراءات السفر في المطار","intro":{"en":"Good morning. May I see your passport and booking, please?","ar":"صباح الخير. هل لي برؤية جواز سفرك وحجزك من فضلك؟"},"turns":[{"opts":[{"t":"Why do you need it? I already showed it online.","fit":"off","note":"التحقق من الجواز إجراء إلزامي، والاعتراض عليه يؤخر الدور ويبدو غير متعاون.","say":"I'm sorry, it's required here. Thank you. Would you like a window or an aisle seat?","sayAr":"أعتذر، هذا مطلوب هنا. شكرًا لك. هل تفضّل مقعدًا بجانب النافذة أم بجانب الممر؟"},{"t":"Of course, here you are.","fit":"good","note":"عبارة here you are هي الأشيع عند تسليم شيء لشخص، والابتسامة تكمّلها.","say":"Thank you very much. Would you like a window or an aisle seat?","sayAr":"شكرًا جزيلًا. هل تفضّل مقعدًا بجانب النافذة أم بجانب الممر؟"},{"t":"Here. Take it.","fit":"ok","note":"المضمون صحيح لكن الأسلوب آمر ومتعجرف قليلًا. أضف Here you are أو please.","say":"Thanks. Would you like a window or an aisle seat?","sayAr":"شكرًا. هل تفضّل مقعدًا بجانب النافذة أم بجانب الممر؟"}]},{"opts":[{"t":"Window.","fit":"ok","note":"كلمة واحدة تفي بالغرض لكنها مختصرة. أضف please لتصير مهذبة.","say":"Window, no problem. Are you checking in any bags today?","sayAr":"نافذة، لا مشكلة. هل ستسلّم أي حقائب اليوم؟"},{"t":"The best seat you have, or I'll complain to your manager.","fit":"off","note":"التهديد غير مبرر ولا يُحدث فرقًا، وقد يُسيء إلى الموظف.","say":"I'll see what I can do, sir. Are you checking in any bags ستعملة هنا.","say":"Great, that makes things easier. Would you prefer a refund or an exchange?","sayAr":"رائع، هذا يسهّل الأمور. هل تفضل استرداد المبلغ أم الاستبدال؟"},{"t":"No, and I don't need one. Everybody knows you sold it to me.","fit":"off","note":"رفض الإيصال بهذا الأسلوب غير منطقي ولا يقنع الموظف؛ إن لم يكن معك إيصال فاعتذر واعرض بدائل كالبطاقة المصرفية.","say":"Well, I'm afraid we do need some proof of purchase. Would you prefer a refund or an exchange?","sayAr":"في الحقيقة نحتاج إلى إثبات للشراء. هل تفضل استرداد المبلغ أم الاستبدال؟"},{"t":"Yes, I possess the receipt. Please examine it.","fit":"ok","note":"كلمتا possess وexamine رسميتان جدًا؛ الأطبع Yes, here it is.","say":"Thanks, let me have a look. Would you prefer a refund or an exchange?","sayAr":"شكرًا، دعني ألقِ نظرة. هل تفضل استرداد المبلغ أم الاستبدال؟"}]},{"opts":[{"t":"Neither. I'll just leave it here and write a bad review.","fit":"off","note":"التهديد بتقييم سيئ أسلوب غير لائق ولا يحل المشكلة؛ اختر أحد الخيارين بأدب.","say":"Oh, I see. Well, please let us know if you change your mind. Goodbye.","sayAr":"فهمت. أخبرنا إن غيرت رأيك. إلى اللقاء."},{"t":"A refund. I want my money back.","fit":"ok","note":"الطلب واضح لكن عبارة I want my money back حادة؛ الأفضل I'd prefer a refund, please.","say":"All right, I'll process it now. It will take a few days to show up.","sayAr":"حسنًا، سأنجز الطلب الآن. سيظهر المبلغ خلال أيام."},{"t":"I'd prefer a refund, if that's possible. Otherwise, an exchange is fine.","fit":"good","note":"صيغة مرنة ومهذبة: عبّرت عن تفضيلك وتركت بديلًا، وif that's possible تلطّف الطلب.","say":"Of course. I'll process the refund now. Thanks for coming in, and have a nice day!","sayAr":"بالطبع. سأنجز الاسترداد الآن. شكرًا لمجيئك، ويومًا سعيدًا!"}]}]},{"cat":"food","label":"طلب خصم في متجر إلكترونيات","intro":{"en":"Welcome! That laptop is one of our best sellers. Are you interested in it?","ar":"أهلًا بك! هذا الحاسوب من أكثر منتجاتنا مبيعًا. هل يهمّك؟"},"turns":[{"opts":[{"t":"It's way too expensive. You're trying to rip people off.","fit":"off","note":"اتهام البائع بالنصب يُفسد المساومة فورًا؛ المساومة الناجحة تكون بلطف وبحجج.","say":"Oh, that's not our intention at all. It's 650, and it comes with a two-year warranty. What do you think?","sayAr":"أوه، هذه ليست نيتنا إطلاقًا. سعره 650، ويأتي مع ضمان لمدة سنتين. ما رأيك؟"},{"t":"Yes, it looks great. Is the price on the tag final?","fit":"good","note":"سؤال Is the price final؟ طريقة طبيعية لفتح باب المساومة دون إحراج.","say":"Good question. It's 650, and it comes with a two-year warranty. What do you think?","sayAr":"سؤال وجيه. سعره 650، ويأتي مع ضمان لمدة سنتين. ما رأيك؟"},{"t":"Yes, I like it. What is your lowest price?","fit":"ok","note":"السؤال مفهوم لكنه مباشر؛ يقول الناطقون عادةً Is there any room on the price؟","say":"Well, let me explain. It's 650, and it comes with a two-year warranty. What do you think?","sayAr":"حسنًا، دعني أوضح. سعره 650، ويأتي مع ضمان لمدة سنتين. ما رأيك؟"}]},{"opts":[{"t":"It's a bit above my budget. Is there any chance of a discount if I pay in cash?","fit":"good","note":"عبّرت عن حدود ميزانيتك بلطف وقدمت حافزًا، وهذا أسلوب المساومة المعتاد.","say":"Paying in cash does help. Let me see what I can do. Would 600 work for you?","sayAr":"الدفع نقدًا يساعد فعلًا. دعني أرى ما يمكنني فعله. هل يناسبك 600؟"},{"t":"Reduce the price and I'll buy it today.","fit":"ok","note":"الفكرة جيدة لكن الصيغة أمر مباشر؛ الأفضل Could you do a better price? If so, I'll buy today.","say":"I'll see what I can do. Let me see what I can do. Would 600 work for you?","sayAr":"سأرى ما أستطيع فعله. دعني أرى ما يمكنني فعله. هل يناسبك 600؟"},{"t":"I saw it online for 400. Give it to me for 300 or I'm leaving.","fit":"off","note":"السعر المبالغ فيه والإنذار يدفعان البائع إلى الرفض؛ اطلب خصمًا معقولًا قرب السعر المعروض.","say":"That's a long way from our price. Let me see what I can do. Would 600 work for you?","sayAr":"هذا بعيد جدًا عن سعرنا. دعني أرى ما يمكنني فعله. هل يناسبك 600؟"}]},{"opts":[{"t":
