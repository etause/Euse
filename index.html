ى مسكّن دون أسئلة غير مناسب؛ الصيدلي يسأل للحفاظ على سلامتك.","say":"I can't just do that. Do you have any other symptoms?","sayAr":"لا أستطيع فعل ذلك هكذا. هل لديك أعراض أخرى؟"},{"t":"Hi, I've had a bad headache all day. What would you recommend?","fit":"good","note":"وصف المشكلة مع مدتها وسؤال عن التوصية، وهذا طبيعي وودّي في الصيدلية.","say":"I'm sorry to hear that. Do you have any other symptoms?","sayAr":"آسف لسماع ذلك. هل لديك أعراض أخرى؟"}]},{"opts":[{"t":"Why do you need to know? Just sell me the pills.","fit":"off","note":"الاعتراض على سؤال طبي مهم غير لائق؛ المعلومات تحميك من التداخلات الدوائية.","say":"It's for your safety, I promise. Are you taking any other medication at the moment?","sayAr":"هذا من أجل سلامتك، أؤكد لك. هل تتناول أي أدوية أخرى حاليًا؟"},{"t":"No, just the headache, and I feel a bit tired.","fit":"good","note":"جواب طبيعي ومفيد، وصيغة feel a bit tired تدل على تعب خفيف.","say":"Okay, thank you. Are you taking any other medication at the moment?","sayAr":"حسنًا، شكرًا لك. هل تتناول أي أدوية أخرى حاليًا؟"},{"t":"I do not have additional symptoms apart from the headache.","fit":"ok","note":"صحيحة نحويًا لكنها رسمية؛ يقول الناطقون عادةً No, just the headache.","say":"I see. Are you taking any other medication at the moment?","sayAr":"فهمت. هل تتناول أي أدوية أخرى حاليًا؟"}]},{"opts":[{"t":"No. I take no other medicine.","fit":"ok","note":"الجملة صحيحة لكنها مقتضبة؛ الأفضل No, nothing regular.","say":"Then ibuprofen should be fine. Take one with a meal, and see a doctor if it lasts more than a few days.","sayAr":"إذن لا بأس بالإيبوبروفين. تناول حبة مع وجبة، وراجع الطبيب إن استمر الصداع أكثر من أيام."},{"t":"No, nothing regular. Is it safe to take on an empty stomach?","fit":"good","note":"جواب طبيعي مع سؤال يدل على وعيك؛ ويُنطق regular بنبر على المقطع الأول.","say":"Better with food. Take one with a meal, and see a doctor if it lasts more than a few days.","sayAr":"الأفضل مع الطعام. تناول حبة مع وجبة، وراجع الطبيب إن استمر الصداع أكثر من أيام."},{"t":"Mind your own business, I know what I'm doing.","fit":"off","note":"عبارة وقحة مع الصيدلي، ولا تتناسب مع سؤال يخص سلامتك.","say":"Okay, then. Please read the label carefully. Goodbye.","sayAr":"حسنًا إذن. من فضلك اقرأ النشرة بعناية. مع السلامة."}]}]},{"cat":"health","label":"حجز موعد طبيب الأسنان بالهاتف","intro":{"en":"Good morning, Bright Smile Dental Clinic. How can I help you?","ar":"صباح الخير، عيادة الابتسامة المشرقة للأسنان. كيف يمكنني مساعدتك؟"},"turns":[{"opts":[{"t":"My tooth is killing me! Get me in right now or I'll go somewhere else.","fit":"off","note":"التهديد والأسلوب الحاد لا يساعدان في الحصول على موعد؛ اشرح الألم بهدوء واسأل عن أقرب موعد.","say":"I'm sorry you're in pain. Is this your first visit with us?","sayAr":"آسف لأنك تتألم. هل هذه زيارتك الأولى لدينا؟"},{"t":"Hey, I need the dentist. When are you free?","fit":"ok","note":"جملة عامية أكثر من اللازم لمكالمة مع عيادة؛ الأفضل Hello, I'd like to make an appointment.","say":"Okay. Is this your first visit with us?","sayAr":"حسنًا. هل هذه زيارتك الأولى لدينا؟"},{"t":"Hello, I'd like to make an appointment, please. I have a toothache.","fit":"good","note":"طلب مهذب ومباشر مع ذكر السبب، وصيغة I'd like to make an appointment قياسية.","say":"Of course. Is this your first visit with us?","sayAr":"بالتأكيد. هل هذه زيارتك الأولى لدينا؟"}]},{"opts":[{"t":"Yes, it's my first time. I'm a new patient.","fit":"good","note":"جواب واضح وطبيعي، وعبارة new patient هي المستخدمة في العيادات.","say":"Welcome, then. We'll need to take a few details. We have openings on Thursday at 10 or Friday at 3. Which would suit you?","sayAr":"أهلًا بك إذن. سنحتاج إلى بعض البيانات. لدينا موعدان متاحان: الخميس في العاشرة أو الجمعة في الثالثة. أيهما يناسبك؟"},{"t":"Does it matter? Just give me a time.","fit":"off","note":"هذا الجواب فظ؛ العيادة تسأل لتجهيز ملفك، فأجب بوضوح.","say":"It does help us, actually. We have openings on Thursday at 10 or Friday at 3. Which would suit you?","sayAr":"هذا يساعدنا فعلًا. لدينا موعدان متاحان: الخميس في العاشرة أو الجمعة في الثالثة. أيهما يناسبك؟"},{"t":"Yes. I never came before.","fit":"ok","note":"مفهوم لكن الفعل خاطئ؛ الصحيح I haven't been here before.","say":"Okay, thanks. We have openings on Thursday at 10 or Friday at 3. Which would suit you?","sayAr":"حسنًا، شكرًا. لدينا موعدان متاحان: الخميس في العاشرة أو الجمعة في الثالثة. أيهما يناسبك؟"}]},{"opts":[{"t":"Neither. I want to come today, I don't care about your schedule.","fit":"off","note":"رفض المواعيد دون بديل يغلق الباب؛ كان الأفضل أن تسأل إن كان هناك موعد أقرب.","say":"I'm sorry, we're fully booked today. Call us again if you'd like another day. Goodbye.","sayAr":"نأسف، جدولنا ممتلئ اليوم. اتصل بنا إن رغبت في يوم آخر. مع السلامة."},{"t":"Thursday at 10 would be perfect, thank you.","fit":"good","note":"اختيار واضح مع شكر، وwould be perfect تعبّر عن القبول بلطف.","say":"Great, you're booked for Thursday at 10. See you then!","sayAr":"رائع، تم حجز موعدك الخميس في العاشرة. إلى اللقاء!"},{"t":"Thursday. 10.","fit":"ok","note":"واضح لكنه مقتضب؛ يضيف الناطقون عادةً Thursday at 10, please.","say":"Okay, Thursday at 10 it is. See you then.","sayAr":"حسنًا، الخميس في العاشرة. إلى اللقاء."}]}]},{"cat":"tech","label":"الاتصال بدعم الإنترنت لبطء الاتصال","intro":{"en":"Thank you for calling Netlink support. How can I help you today?","ar":"شكرًا لاتصالك بدعم نت لينك. كيف يمكنني مساعدتك اليوم؟"},"turns":[{"opts":[{"t":"Your service is useless! I'm paying for nothing every month.","fit":"off","note":"الغضب لا يفيد مع موظف الدعم؛ شرح المشكلة بهدوء يسرّع الحل.","say":"I'm sorry you're frustrated. Have you tried restarting your router?","sayAr":"آسف لأنك منزعج. هل جرّبت إعادة تشغيل الراوتر؟"},{"t":"My internet is bad. Fix it please.","fit":"ok","note":"مفهومة لكنها قصيرة وآمرة؛ الأفضل My internet has been very slow lately.","say":"I'm sorry about that. Have you tried restarting your router?","sayAr":"آسف لذلك. هل جرّبت إعادة تشغيل الراوتر؟"},{"t":"Hi, my internet has been really slow for the past two days.","fit":"good","note":"جملة طبيعية تذكر المشكلة والمدة، وhas been slow تناسب الأمر المستمر.","say":"I'm sorry to hear that. Have you tried restarting your router?","sayAr":"آسف لسماع ذلك. هل جرّبت إعادة تشغيل الراوتر؟"}]},{"opts":[{"t":"Of course I did, do you think I'm stupid?","fit":"off","note":"الرد دفاعي ومسيء لموظف يتبع إجراءً معتادًا؛ أجب بهدوء.","say":"I didn't mean it that way. Let me run a quick check on my side. Can you hold for a moment?","sayAr":"لم أقصد ذلك. سأجري فحصًا سريعًا من جهتي. هل يمكنك الانتظار قليلًا؟"},{"t":"Yes, I restarted it twice, but the speed is still very low.","fit":"good","note":"جواب واضح يوفر على الموظف وقتًا: ما فعلته والنتيجة.","say":"Thanks, that's helpful. Let me run a quick check on my side. Can you hold for a moment?","sayAr":"شكرًا، هذا مفيد. سأجري فحصًا سريعًا من جهتي. هل يمكنك الانتظار قليلًا؟"},{"t":"Yes, I did. No change.","fit":"ok","note":"مناسبة لكنها جافة جدًا؛ الأفضل إضافة تفصيل كـ Still very slow.","say":"Okay. Let me run a quick check on my side. Can you hold for a moment?","sayAr":"حسنًا. سأجري فحصًا سريعًا من جهتي. هل يمكنك الانتظار قليلًا؟"}]},{"opts":[{"t":"OK. Be quick.","fit":"ok","note":"الطلب مفهوم لكنه فظ قليلًا؛ يقول الناطقون Sure, thanks.","say":"Thanks for waiting. There's a fault in your area, so I'll book a technician for tomorrow. Goodbye.","sayAr":"شكرًا لانتظارك. هناك عطل في منطقتك، وسأحجز فنيًا لغد. مع السلامة."},{"t":"No, I've no time to hold. Just send a technician today.","fit":"off","note":"رفض الانتظار والمطالبة بزيارة اليوم غير واقعي؛ الموظف يحتاج دقيقة للفحص.","say":"I'm afraid I need a minute to check. I'll book a technician for tomorrow. Goodbye.","sayAr":"للأسف أحتاج إلى دقيقة للفحص. سأحجز فنيًا لغد. مع السلامة."},{"t":"Sure, take your time. Thank you for your help.","fit":"good","note":"استجابة لبقة، وtake your time عبارة شائعة ومريحة للطرف الآخر.","say":"Thank you. I found a fault in your area, so a technician will visit tomorrow. Have a good day!","sayAr":"شكرًا لك. وجدت عطلًا في منطقتك، وسيزورك فني غدًا. يومًا سعيدًا!"}]}]},{"cat":"tech","label":"الانضمام إلى اجتماع عبر الإنترنت بمشكلة تقنية","intro":{"en":"Hi, glad you could join! We can see you, but we can't hear you.","ar":"أهلًا، سعدنا بانضمامك! نراك لكن لا نسمعك."},"turns":[{"opts":[{"t":"That's your problem, not mine. Your software is bad.","fit":"off","note":"إلقاء اللوم على الآخرين غير لائق في اجتماع عمل؛ اعتذر وابدأ بالحل.","say":"Oh... okay, let's try to sort it out. Could you check that your mic isn't muted in the settings?","sayAr":"أوه... حسنًا، لنحاول حل ذلك. هل يمكنك التأكد من أن الميكروفون غير مكتوم في الإعدادات؟"},{"t":"Sorry about that, let me check my microphone.","fit":"good","note":"اعتذار قصير وإعلان عن خطوتك التالية، وهو ما يتوقعه الزملاء.","say":"No worries at all. Could you check that your mic isn't muted in the settings?","sayAr":"لا بأس إطلاقًا. هل يمكنك التأكد من أن الميكروفون غير مكتوم في الإعدادات؟"},{"t":"Apologies for the inconvenience. I will attempt to resolve the audio problem.","fit":"ok","note":"صحيحة لكنها رسمية جدًا لاجتماع عادي؛ الأقرب Sorry, let me fix that.","say":"Thanks. Could you check that your mic isn't muted in the settings?","sayAr":"شكرًا. هل يمكنك التأكد من أن الميكروفون غير مكتوم في الإعدادات؟"}]},{"opts":[{"t":"I'm not going to waste time on this. Just start without me.","fit":"off","note":"الانسحاب بهذه الطريقة يظهر قلة اهتمام؛ الأفضل أن تطلب دقيقة لإصلاح المشكلة.","say":"Oh, we'd really like you to stay. Try saying something and let us know if we can hear you.","sayAr":"أوه، نود حقًا أن تبقى. جرّب أن تتكلم، وأخبرنا إن كنا نسمعك."},{"t":"It looks like the wrong microphone was selected. I'll switch it now.","fit":"good","note":"شرح مختصر للمشكلة وما ستفعله، والصيغة looks like مناسبة للتخمين.","say":"Ah, that happens a lot. Try saying something and let us know if we can hear you.","sayAr":"آه، هذا يحدث كثيرًا. جرّب أن تتكلم، وأخبرنا إن كنا نسمعك."},{"t":"I looked. It's not muted, so I don't understand the problem.","fit":"ok","note":"جواب صادق لكنه لا يقدم حلًا؛ الأفضل أن تقترح خطوة أخرى مثل تغيير الميكروفون.","say":"Hmm, okay. Try saying something and let us know if we can hear you.","sayAr":"همم، حسنًا. جرّب أن تتكلم، وأخبرنا إن كنا نسمعك."}]},{"opts":[{"t":"Yes. Hear me now?","fit":"ok","note":"مفهومة لكنها مقتضبة وناقصة؛ الأصح Can you hear me now؟","say":"Yes, we can hear you now. Let's get started.","sayAr":"نعم، نسمعك الآن. لنبدأ."},{"t":"Finally. That took forever, honestly.","fit":"off","note":"التذمر بعد حل المشكلة يظهر عدم لباقة؛ الأفضل شكر الجميع على صبرهم.","say":"Right... let's get started, then.","sayAr":"حسنًا... لنبدأ إذن."},{"t":"Hello, can you hear me now? Great, thanks for your patience, everyone.","fit":"good","note":"تأكيد ثم شكر للجميع على صبرهم، وهذا يترك انطباعًا مهنيًا.","say":"Yes, loud and clear! Let's get started.","sayAr":"نعم، بصوت واضح! لنبدأ."}]}]},{"cat":"tech","label":"طلب مساعدة صديق في مشكلة بالهاتف","intro":{"en":"Hey! You look stressed. What's going on?","ar":"مرحبًا! تبدو متوترًا. ما الذي يحدث؟"},"turns":[{"opts":[{"t":"Hey, can you help me? My phone keeps saying the storage is full.","fit":"good","note":"طلب مساعدة ودّي ومباشر يناسب الصديق، مع وصف واضح للمشكلة.","say":"Sure, I can help. Let me see. Have you deleted any old photos or apps recently?","sayAr":"بالتأكيد، يمكنني المساعدة. دعني أرى. هل حذفت صورًا أو تطبيقات قديمة مؤخرًا؟"},{"t":"Don't ask. Your phone recommendation was terrible, this is your fault.","fit":"off","note":"لوم الصديق بشكل فظ غير مناسب وغير صحيح؛ اطلب مساعدته بدلًا من اتهامه.","say":"Whoa, that's a bit harsh. Let me see. Have you deleted any old photos or apps recently?","sayAr":"يا إلهي، هذا قاسٍ قليلًا. دعني أرى. هل حذفت صورًا أو تطبيقات قديمة مؤخرًا؟"},{"t":"Excuse me, I would like to ask for your assistance with a technical matter concerning my mobile phone.","fit":"ok","note":"اللغة رسمية جدًا لصديق؛ يقول الناطقون Hey, can you help me with my phone؟","say":"Haha, so formal. Let me see. Have you deleted any old photos or apps recently?","sayAr":"هاها، ما هذه الرسمية. دعني أرى. هل حذفت صورًا أو تطبيقات قديمة مؤخرًا؟"}]},{"opts":[{"t":"I'm not deleting anything! Just make it work without touching my stuff.","fit":"off","note":"المطالبة بحل بلا أي تغيير تبدو متطلبة مع صديق يساعدك.","say":"Okay, okay, calm down. I'd start by backing up your photos to the cloud. Want me to show you how?","sayAr":"حسنًا، حسنًا، اهدأ. أنصحك أن تبدأ بنسخ صورك احتياطيًا إلى السحابة. هل تريد أن أريك الطريقة؟"},{"t":"No, I do not know what to delete.","fit":"ok","note":"مفهوم لكن الأفضل شرح السبب: I wasn't sure what's safe to delete.","say":"I see. I'd start by backing up your photos to the cloud. Want me to show you how?","sayAr":"فهمت. أنصحك أن تبدأ بنسخ صورك احتياطيًا إلى السحابة. هل تريد أن أريك الطريقة؟"},{"t":"Not yet. I wasn't sure what's safe to delete.","fit":"good","note":"جواب صريح يشرح سبب التردد ويفتح الباب للنصيحة.","say":"That makes sense. I'd start by backing up your photos to the cloud. Want me to show you how?","sayAr":"هذا منطقي. أنصحك أن تبدأ بنسخ صورك احتياطيًا إلى السحابة. هل تريد أن أريك الطريقة؟"}]},{"opts":[{"t":"No, I'll figure it out myself. You're not helping.","fit":"off","note":"رفض المساعدة ونعت الصديق بأنه غير مفيد أسلوب جارح.","say":"Alright, no problem. Let me know if you change your mind.","sayAr":"حسنًا، لا مشكلة. أخبرني إن غيرت رأيك."},{"t":"Okay. Do it.","fit":"ok","note":"واضحة لكنها أمر مباشر؛ يقول الناطقون Sure, thanks.","say":"Alright, give me your phone. It'll take two minutes.","sayAr":"حسنًا، أعطني هاتفك. سيستغرق الأمر دقيقتين."},{"t":"Yes, please, that would be a huge help. Thanks a lot!","fit":"good","note":"قبول ودود مع شكر، وعبارة a huge help تعبّر عن الامتنان.","say":"Of course! Give me your phone, it'll take two minutes.","sayAr":"بالطبع! أعطني هاتفك، سيستغرق الأمر دقيقتين."}]}]},{"cat":"home","label":"معاينة شقة للإيجار","intro":{"en":"Welcome! This is the living room. As you can see, it gets lots of natural light.","ar":"أهلًا بك! هذه غرفة المعيشة. كما ترى، تدخلها إضاءة طبيعية كثيرة."},"turns":[{"opts":[{"t":"The light is okay. It is not big, though.","fit":"ok","note":"الملاحظة صريحة لكنها جافة؛ يخففها الناطقون بجملة إيجابية أولًا.","say":"Well, it's a cosy space. Do you have any questions so far?","sayAr":"إنها مساحة دافئة على كل حال. هل لديك أي أسئلة حتى الآن؟"},{"t":"It's smaller than in the photos. Honestly, it looks like a shoebox.","fit":"off","note":"التعليق السلبي على الشقة يضرّ بموقفك التفاوضي؛ اسأل عن المساحة بلطف.","say":"Oh, I'm sorry you feel that way. Do you have any questions so far?","sayAr":"أوه، آسف لأنك ترى ذلك. هل لديك أي أسئلة حتى الآن؟"},{"t":"It's lovely and bright. I like it so far.","fit":"good","note":"تعليق إيجابي طبيعي يشجع الطرف الآخر، وso far تشير إلى أن الجولة لم تنتهِ.","say":"Glad to hear it! Do you have any questions so far?","sayAr":"يسعدني سماع ذلك! هل لديك أي أسئلة حتى الآن؟"}]},{"opts":[{"t":"Yes, are the utilities included in the rent?","fit":"good","note":"سؤال مباشر ومهذب، وكلمة utilities هي المستعملة للفواتير الخدمية.","say":"Good question. Water is included, but electricity and internet are separate. When would you be looking to move in?","sayAr":"سؤال وجيه. الماء مشمول، أما الكهرباء والإنترنت فمنفصلان. متى تود الانتقال؟"},{"t":"Yes. What about the bills? Included?","fit":"ok","note":"مفهوم لكنه مقتضب وغير مهذب؛ الأفضل Are the bills included in the rent؟","say":"Let me explain. Water is included, but electricity and internet are separate. When would you be looking to move in?","sayAr":"دعني أوضح. الماء مشمول، أما الكهرباء والإنترنت فمنفصلان. متى تود الانتقال؟"},{"t":"Yes. Why is nobody living here? Is something wrong with it?","fit":"off","note":"السؤال بصيغة اتهام يسيء إلى المالك؛ اسأل بلطف عن مدة سكن آخر مستأجر.","say":"Oh, no, nothing's wrong. Water is included, but electricity and internet are separate. When would you be looking to move in?","sayAr":"أوه، لا، لا شيء خاطئ. الماء مشمول، أما الكهرباء والإنترنت فمنفصلان. متى تود الانتقال؟"}]},{"opts":[{"t":"Tomorrow. And I won't pay a deposit or sign any contract.","fit":"off","note":"رفض الإيداع والعقد غير واقعي ويفقدك الثقة؛ هي شروط معتادة.","say":"I'm afraid that's not how it works. Please call me if you change your mind.","sayAr":"للأسف هذا ليس ما يحدث. اتصل بي إن غيرت رأيك."},{"t":"Next month. I decide later.","fit":"ok","note":"مفهومة لكنها مقتضبة وغير صحيحة نحويًا؛ الأصح Next month. I'll let you know soon.","say":"Fine. Here's my card. Call me when you decide.","sayAr":"حسنًا. هذه بطاقتي. اتصل بي حين تقرر."},{"t":"Hopefully at the start of next month. I'll think it over, but I'm very interested.","fit":"good","note":"جواب مهذب يظهر الاهتمام دون التزام فوري، وthink it over تعني التفكير بتأنٍ.","say":"Great! Here's my card. Call me when you decide and we'll sort out the paperwork.","sayAr":"رائع! هذه بطاقتي. اتصل بي حين تقرر وسنرتب الأوراق."}]}]},{"cat":"home","label":"شكوى مهذبة لجار مزعج","intro":{"en":"Oh, hello. Can I help you?","ar":"أوه، مرحبًا. هل يمكنني مساعدتك؟"},"turns":[{"opts":[{"t":"Finally! You and your noise are driving me crazy!","fit":"off","note":"الهجوم المباشر يجعل الجار دفاعيًا؛ ابدأ بلطف وعرّف بنفسك.","say":"Sorry, what? Is everything all right?","sayAr":"عذرًا، ماذا؟ هل كل شيء على ما يرام؟"},{"t":"Hi, sorry to bother you. I live downstairs, in number 4.","fit":"good","note":"بداية لطيفة تعتذر عن الإزعاج وتعرّف بك، وهذا يمهّد للشكوى.","say":"Oh, hi, nice to meet you. Is everything all right?","sayAr":"أوه، أهلًا، تشرفت بمعرفتك. هل كل شيء على ما يرام؟"},{"t":"Hello. I am your neighbour. I have a complaint about you.","fit":"ok","note":"الجملة صحيحة لكن I have a complaint about you تبدو رسمية ومواجهة.","say":"Oh, a complaint? Is everything all right?","sayAr":"أوه، شكوى؟ هل كل شيء على ما يرام؟"}]},{"opts":[{"t":"Your music is awful and I'll call the police if it continues.","fit":"off","note":"التهديد بالشرطة مباشرة مبالغ فيه، وقد يُشعل الخلاف.","say":"That's a bit much. I didn't realise it carried that far. Does it bother you every night?","sayAr":"هذا مبالغ فيه قليلًا. لم أدرك أنه يُسمع إلى هذا الحد. هل يزعجك كل ليلة؟"},{"t":"The music is too loud at night. Stop it, please.","fit":"ok","note":"الطلب واضح لكن الأمر المباشر Stop it جاف؛ الأفضل Would you mind turning it down؟","say":"Oh, I'm sorry. I didn't realise it carried that far. Does it bother you every night?","sayAr":"أوه، أعتذر. لم أدرك أنه يُسمع إلى هذا الحد. هل يزعجك كل ليلة؟"},{"t":"Everything's fine, but the music has been quite loud late at night. Would you mind turning it down?","fit":"good","note":"بدأت بطمأنته ثم شرحت المشكلة وطلبت بلطف بصيغة Would you mind، وهي من أرقى الصيغ.","say":"Oh, I'm so sorry about that. I didn't realise it carried that far. Does it bother you every night?","sayAr":"أوه، أنا آسف جدًا لذلك. لم أدرك أنه يُسمع إلى هذا الحد. هل يزعجك كل ليلة؟"}]},{"opts":[{"t":"Every single night, and honestly you're the most inconsiderate neighbour ever.","fit":"off","note":"الإهانة تفسد الحوار الودي وتقلل فرص التعاون.","say":"Well... I'll try to keep it down. Have a good night.","sayAr":"حسنًا... سأحاول خفض الصوت. ليلة سعيدة."},{"t":"Mostly on weekends, but it's been hard to sleep. Thanks for understanding.","fit":"good","note":"جواب صادق ومهذب مع شكر، وhard to sleep تعبّر عن أثر المشكلة دون هجوم.","say":"I understand. I'll keep it down from now on. Thanks for telling me so nicely.","sayAr":"أتفهم ذلك. سأخفض الصوت من الآن فصاعدًا. شكرًا لأنك أخبرتني بلطف."},{"t":"Yes, every night. It is a big problem.","fit":"ok","note":"الجواب مفهوم لكنه حاد قليلًا؛ يليّنه الناطقون بـ I'd really appreciate it if...","say":"Okay, I'll keep it down. Sorry again.","sayAr":"حسنًا، سأخفض الصوت. آسف مرة أخرى."}]}]},{"cat":"home","label":"إبلاغ المالك بعطل جهاز","intro":{"en":"Hello, this is the landlord speaking. What can I do for you?","ar":"مرحبًا، المالك يتحدث. ماذا يمكنني أن أفعل لك؟"},"turns":[{"opts":[{"t":"Hi, I'm sorry to call, but the washing machine has stopped working.","fit":"good","note":"اعتذار لطيف عن الاتصال ثم الإبلاغ، وهذا مناسب مع المالك.","say":"Oh, thanks for letting me know. Oh no. What exactly is it doing?","sayAr":"أوه، شكرًا لإبلاغي. يا للأسف. ماذا يحدث بالضبط؟"},{"t":"The washing machine is broken again! You never maintain this flat!","fit":"off","note":"الاتهام بالإهمال يجعل المالك دفاعيًا؛ اعرض المشكلة بهدوء.","say":"Hmm, that's not fair. Oh no. What exactly is it doing?","sayAr":"همم، هذا ليس عادلًا. يا للأسف. ماذا يحدث بالضبط؟"},{"t":"Hello. Washing machine is broken. You must fix.","fit":"ok","note":"مفهومة لكن بلا أدوات ربط، وYou must fix أمر؛ الأفضل Could you arrange a repair؟","say":"I see. Oh no. What exactly is it doing?","sayAr":"فهمت. يا للأسف. ماذا يحدث بالضبط؟"}]},{"opts":[{"t":"Why do I have to explain? Just send somebody to repair it.","fit":"off","note":"رفض الشرح أسلوب فظ؛ تفاصيل العطل تساعد على الإصلاح.","say":"Well, I need to know what's wrong. I see. Is it okay if a repairman comes by tomorrow afternoon?","sayAr":"حسنًا، أحتاج إلى معرفة العطل. فهمت. هل يناسبك أن يأتي فني غدًا بعد الظهر؟"},{"t":"It has water inside and does not go out.","fit":"ok","note":"المعنى مفهوم لكن الصياغة غير دقيقة؛ الأصح It won't drain.","say":"Okay. I see. Is it okay if a repairman comes by tomorrow afternoon?","sayAr":"حسنًا. فهمت. هل يناسبك أن يأتي فني غدًا بعد الظهر؟"},{"t":"It fills with water, but it won't drain, so the clothes stay soaked.","fit":"good","note":"وصف دقيق وبسيط يساعد الفني، وwon't drain هي العبارة المناسبة.","say":"Ah, that sounds like the pump. I see. Is it okay if a repairman comes by tomorrow afternoon?","sayAr":"آه، يبدو أنها المضخة. فهمت. هل يناسبك أن يأتي فني غدًا بعد الظهر؟"}]},{"opts":[{"t":"No, I need it today. I won't wait one more day.","fit":"off","note":"الإصرار وإنذار المالك غير عمليين؛ الأفضل أن تسأل عن أقرب وقت ممكن.","say":"I'm afraid today isn't possible. I'll arrange it for tomorrow. Goodbye.","sayAr":"للأسف اليوم غير ممكن. سأرتبه لغد. مع السلامة."},{"t":"Tomorrow afternoon works well. I'll be home after two.","fit":"good","note":"قبول واضح مع توضيح الوقت، وworks well عبارة مناسبة للمواعيد.","say":"Perfect. I'll let him know. Thanks for your patience!","sayAr":"ممتاز. سأخبره. شكرًا لصبرك!"},{"t":"Okay. Come tomorrow.","fit":"ok","note":"القبول مفهوم لكن Come tomorrow أمر جاف؛ الأفضل Tomorrow works, thanks.","say":"Alright, he'll come in the afternoon. Goodbye.","sayAr":"حسنًا، سيأتي بعد الظهر. مع السلامة."}]}]}],"phr":[{"src":"ar","in":"إن شاء الله","versions":[{"t":"God willing.","reg":"neutral","why":"تُقال عند الحديث عن المستقبل بمعنى الأمل بتحقق الأمر، وهي مفهومة لدى من يعرف السياق الثقافي، لكنها تبدو دينية في بيئات العمل الدولية."},{"t":"Hopefully.","reg":"casual","why":"أقرب مكافئ شائع في الحياة اليومية، فهي تعبّر عن الأمل دون بُعد ديني."},{"t":"I expect to, circumstances permitting.","reg":"formal","why":"تناسب الرسائل والاجتماعات الرسمية حين تريد وعدًا مشروطًا بالظروف."},{"t":"We'll see.","reg":"casual","why":"تُستعمل أحيانًا لتأجيل الإجابة بلطف أو التهرب من الالتزام، وتُفهم هكذا من النبرة والسياق."}],"literal":{"t":"If God wills","ok":false,"why":"الترجمة الحرفية مفهومة لكنها تبدو دينية جدًا في الإنجليزية العامة، كما أن العبارة العربية قد تكون وعدًا صادقًا أو تأجيلًا مهذبًا بحسب النبرة."},"tip":"في الإنجليزية استعمل Hopefully أو I'll try مع غير المسلمين، وإن شاء الله مع الأصدقاء المطلعين فقط.","ex":[{"en":"See you tomorrow, God willing.","ar":"أراك غدًا إن شاء الله."},{"en":"Will you finish it by Friday? Hopefully.","ar":"هل ستنهيه بحلول الجمعة؟ إن شاء الله."}]},{"src":"ar","in":"ما شاء الله","versions":[{"t":"That's wonderful!","reg":"neutral","why":"تُقال عند الإعجاب بإنجاز أو جمال أو نعمة، وتحمل معنى الدعاء بالبركة."},{"t":"Wow, well done!","reg":"casual","why":"مناسبة بين الأصدقاء والأقارب عند مدح إنجاز ما."},{"t":"Masha'Allah.","reg":"neutral","why":"تُنقل بلفظها أحيانًا في البيئات المتعددة الثقافات أو بين المسلمين الناطقين بالإنجليزية."},{"t":"That is truly impressive.","reg":"formal","why":"تناسب المقامات الرسمية حين تريد المديح دون عبارة دينية."}],"literal":{"t":"What God has willed","ok":false,"why":"الترجمة الحرفية لا تؤدي وظي function labCall(body,sig){
  var to=setTimeout(function(){try{LB.ac&&LB.ac.abort()}catch(e){}},75000);
  return fetch(CL_API+'/lab',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:sig}).then(function(r){
    clearTimeout(to);
    return r.json().catch(function(){return {}}).then(function(j){
      if(j&&typeof j.left==='number'){LB.left=j.left;LB.leftAt=dk(Date.now())}
      if(!r.ok||!j||!j.ok)throw (j&&j.error)||('http'+r.status);
      return j.data;
    });
  }).catch(function(e){clearTimeout(to);throw (typeof e==='string'?e:(e&&e.name==='AbortError'?'abort':'net'))});
}
function labErr(c){return c==='limit'?'استهلكت محاولاتك الأربع اليوم. تتجدد غدًا.':c==='no_ai'?'الخدمة غير مفعّلة بعد في الخادم.':c==='net'?'تعذّر الاتصال. تحقق من الإنترنت.':c==='abort'?'تأخر الرد. حاول مرة أخرى.':'تعذّر إنشاء المحتوى. حاول مرة أخرى.'}
function lbRender(){if(current==='lab')renderSheet()}
function labRun(body,ok){
  if(LB.busy)return;
  if(LB.left===0){LB.err=labErr('limit');lbRender();return}
  var id=++LB.req;LB.busy=true;LB.err='';LB.ac=new AbortController();var ac=LB.ac;lbRender();
  labCall(body,ac.signal).then(function(d){
    if(id!==LB.req)return;
    LB.busy=false;LB.ac=null;if(ok(d)===false)LB.err=labErr('parse');lbRender();
  }).catch(function(c){
    if(id!==LB.req)return;
    LB.busy=false;LB.ac=null;if(!ac.signal.aborted||c==='abort')LB.err=labErr(c);lbRender();
  });
}

var AC=null;
function soundOn(){return pref.sound!==false}
function tone(f,t0,d,g,type,f2){
  var o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+t0;
  o.type=type||'triangle';o.frequency.setValueAtTime(f,n);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  a.gain.setValueAtTime(0.0001,n);a.gain.exponentialRampToValueAtTime(g,n+.015);a.gain.exponentialRampToValueAtTime(0.0001,n+d);
  o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.05);
}
function chime(k){
  if(!soundOn())return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    if(k==='good'){tone(659.25,0,.13,.12);tone(987.77,.09,.22,.12)}
    else if(k==='bad'){tone(349.23,0,.15,.26,'triangle');tone(261.63,.14,.15,.26,'triangle');tone(196,.28,.34,.26,'triangle')}
    else if(k==='end'){
      [392,523.25,659.25,783.99].forEach(function(f,i){tone(f,i*.12,.26,.11)});
      [523.25,659.25,783.99,1046.5].forEach(function(f){tone(f,.52,.9,.06,'sine')});
    }
  }catch(e){}
}

  var pool=items.filter(function(i){return !i.ex});
  if(!pool.length)pool=items.slice();
  if(!pool.length){wod=null;return}
  pool=pool.slice().sort(function(a,b){return (a.sn||a.ts)-(b.sn||b.ts)}).slice(0,5);
  var it=pool[Math.floor(Math.random()*pool.length)];
  wod={day:today,at:Date.now(),id:it.id,was:Math.floor((Date.now()-(it.sn||it.ts))/DAY)};
  store.set('wb.wod',wod);
  review(it);
}

function xpInfo(){
  var xp=0,nr=items.filter(function(i){return !i.ex}).length;
  xp+=Math.floor(nr/8);
  xp+=EXAMS;
  xp+=Object.keys(activeSet()).length*2;
  xp+=(bridges||[]).length*2;
  xp+=Object.keys(reads||{}).length*2;
  var L=1;while(50*(L+1)*L<=xp)L++;

var EN_RULES=[
  [/قبل (يوم|يومان|\d+ أيام|\d+ يومًا)/g,function(m,a){return a+' ago'}],
  [/لديك (\d+) (?:كلمة|كلمات) مرّ عليها (\d+) أيام أو أكثر دون مراجعة أو اختبار\. هل تود مراجعتها الآن؟/g,function(m,n,d){return 'You have '+n+' '+(n==1?'word':'words')+' that haven’t been reviewed or quizzed for '+d+' days or more. Review them now?'}]
];
var EN_KEYS=Object.keys(EN_DICT).sort(function(a,b){return b.length-a.length});
var EN_RE=new RegExp(EN_KEYS.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|'),'g');
var AR_ANY=/[؀-ۿ]/;
function trStr(str){
  EN_RULES.forEach(function(r){str=str.replace(r[0],r[1])});
  return str.replace(EN_RE,function(m,off,all){
    var b=all.charAt(off-1),a=all.charAt(off+m.length);
    if(AR_ANY.test(b)||AR_ANY.test(a))return m;
    return EN_DICT[m];
  });
}
var NO_TR='.en,.ar,.d-word,.val:not(.none),.trw,.q-word,.opt,.fc-word,.fnode,.g-en,.note,.sw,[data-nt],textarea,script,style';
var orig=new WeakMap(),TR_ATTR=['placeholder','aria-label','title'];
function trText(n){
  var p=n.parentNode;if(!p||p.nodeType!==1)return;
  var v=n.nodeValue;if(!AR_ANY.test(v))return;
  if(p.closest&&p.closest(NO_TR))return;
  var t=trStr(v);if(t!==v){orig.set(n,v);n.nodeValue=t}
}
function trAttr(el,a){
  var v=el.getAttribute(a);if(!v||!AR_ANY.test(v))return;
  if(el.closest&&el.closest('[data-nt]'))return;
  var t=trStr(v);if(t!==v){el.__ao=el.__ao||{};el.__ao[a]=v;el.setAttribute(a,t)}
}
function trTree(root){
  if(root.nodeType===3){trText(root);return}
  if(root.nodeType!==1)return;
  TR_ATTR.forEach(function(a){if(root.hasAttribute(a))trAttr(root,a)});
  $$('[placeholder],[aria-label],[title]',root).forEach(function(el){TR_ATTR.forEach(function(a){if(el.hasAttribute(a))trAttr(el,a)})});
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(trText);
}
function restoreTree(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n;
  while((n=w.nextNode())){var o=orig.get(n);if(o!==undefined){n.nodeValue=o;orig.delete(n)}}
  $$('*',root).forEach(function(el){if(el.__ao){Object.keys(el.__ao).forEach(function(a){el.setAttribute(a,el.__ao[a])});el.__ao=null}});
}
var trObs=null,appEl=$('#app');
function obsStart(){
  if(trObs)return;
  trObs=new MutationObserver(function(ms){
    ms.forEach(function(m){
      if(m.type==='childList')m.addedNodes.forEach(trTree);
      else if(m.type==='characterData')trText(m.target);
      else if(m.type==='attributes')trAttr(m.target,m.attributeName);
    });
    trObs.takeRecords();
  });
  trObs.observe(appEl,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}
function obsStop(){if(trObs){trObs.disconnect();trObs=null}}
function applyDir(){appEl.setAttribute('dir',LANG==='en'?'ltr':'rtl');root.lang=LANG}
function setLang(v){
  v=v==='en'?'en':'ar';if(v===LANG)return;
  LANG=v;pref.lang=v;savePref();applyDir();
  if(v==='en'){obsStart();trTree(appEl)}
  else{obsStop();restoreTree(appEl)}
  render();renderFormCats();
  if(page==='profile')renderProfile();
  if(current)renderSheet();
}

var IVD=[1,2,4,8,16,30],SR_N=12,sr=null;
function dueAt(i){return i.sn?i.sn+IVD[Math.max(0,Math.min(5,i.lv||0))]*DAY:0}
function dueList(){
  var n=Date.now();
  return items.filter(function(i){return dueAt(i)<=n}).map(function(i){return {i:i,k:dueAt(i)+Math.random()}}).sort(function(a,b){return a.k-b.k}).map(function(x){return x.i});
}
function nextDueText(){
  var n=Date.now(),m=Infinity;
  items.forEach(function(i){var d=dueAt(i);if(d>n&&d<m)m=d});
  if(m===Infinity)return '';
  var ms=m-n;
  if(ms<3600000)return 'خلال أقل من ساعة';
  if(ms<DAY)return 'بعد '+Math.ceil(ms/3600000)+' ساعات';
  return 'بعد '+dWord(Math.ceil(ms/DAY));
}
function kw(n){return n===1?'كلمة واحدة':(n>=2&&n<=10?n+' كلمات':n+' كلمة')}
function smartBadge(){var b=$('#smBadge');if(!b)return;var n=dueList().length;b.textContent=n;b.hidden=!n}
function srItem(){return items.filter(function(x){return x.id===sr.ids[sr.i]})[0]}
function smartView(){
  if(!items.length)return '<div class="empty">أضف كلمات لتبدأ المراجعة الذكية.</div>';
  if(sr&&!sr.done)return smartCard();
  var nd=nextDueText(),note='<div class="exnote">تتباعد مواعيد الكلمة كلما حفظتها أكثر: بعد 1 ثم 2 ثم 4 ثم 8 ثم 16 ثم 30 يومًا. والكلمة التي تنساها تعود أقرب.</div>';
  if(sr&&sr.done){
    var left=dueList().length;
    return '<div class="result"><b>'+sr.ok+' / '+sr.ids.length+'</b><div>انتهت مراجعة اليوم</div><div class="exnote" style="margin-top:6px">عرفت '+sr.ok+' من '+sr.ids.length+'</div></div>'+
      (left?'<div class="exnote">ما زال لديك '+kw(left)+' مستحقة'+'.</div><button class="btn-main" data-act="sstart">ابدأ جلسة جديدة</button>':'<div class="empty">أنجزت كل الكلمات المستحقة 🎉</div>'+(nd?'<div class="exnote">أقرب موعد: '+nd+'</div>':''))+note;
  }
  var dl=dueList(),n=dl.length;
  if(!n)return '<div class="empty">لا توجد كلمات مستحقة الآن 🎉</div>'+(nd?'<div class="exnote">أقرب موعد: '+nd+'</div>':'')+note;
  return '<div class="group"><div class="srt">'+kw(n)+' مستحقة للمراجعة'+'</div></div>'+
    '<button class="btn-main" data-act="sstart">ابدأ المراجعة</button><div class="exnote">جلسة من '+SR_N+' كلمة كحد أقصى</div>'+note;
}
function smartCard(){
  var it=srItem(),n=sr.ids.length;
  if(!it)return '';
  return '<div class="q-meta"><span>بطاقة '+(sr.i+1)+' من '+n+'</span><span>'+sr.ok+' ✓</span></div>'+
    '<div class="q-prog"><i style="width:'+Math.round(sr.i/n*100)+'%"></i></div>'+
    '<div class="group srcard"><div class="srw" dir="ltr" data-nt>'+esc(it.en)+'</div><button class="ibtn" data-act="ssay" aria-label="نطق">'+SPK+'</button>'+
    (it.ph?'<div class="srp" dir="ltr" data-nt>'+esc(it.ph)+'</div>':'')+
    (sr.shown?'<hr><div class="sra" dir="auto" data-nt>'+(it.ar?esc(it.ar):'—')+'</div>'+(it.notes?'<div class="val note">'+noteHTML(it.notes,false)+'</div>':''):'')+'</div>'+
    (sr.shown?'<div class="srbtns"><button class="sbtn" data-act="sbad">لا أتذكرها</button><button class="sbtn good" data-act="sgood">عرفتها</button></div>':'<button class="btn-main" data-act="sshow">إظهار المعنى</button>');
}
function srNext(){
  sr.i++;sr.shown=false;
  if(sr.i>=sr.ids.length){sr.done=true;chime('end')}
  render();renderSheet();sbody.scrollTop=0;smartBadge();
}

var CR=null,CRS=300;
function crBase(){return Math.max(CRS/CR.img.naturalWidth,CRS/CR.img.naturalHeight)}
function crClamp(){
  var sc=crBase()*CR.z,dw=CR.img.naturalWidth*sc,dh=CR.img.naturalHeight*sc;
  var mx=Math.max(0,(dw-CRS)/2),my=Math.max(0,(dh-CRS)/2);
  CR.x=Math.max(-mx,Math.min(mx,CR.x));CR.y=Math.max(-my,Math.min(my,CR.y));
}
function crDraw(cv,size){

  var k=(size||CRS)/CRS,x=cv.getContext('2d'),sc=crBase()*CR.z*k,dw=CR.img.naturalWidth*sc,dh=CR.img.naturalHeight*sc,S=size||CRS;
  x.fillStyle='#000';x.fillRect(0,0,S,S);

}

function crAfter(){
  var cv=$('#crC');if(!cv||!CR)return;
  crClamp();crDraw();
  var ptr={},last=null;
  function dist(){var k=Object.keys(ptr);if(k.length<2)return 0;var a=ptr[k[0]],b=ptr[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)}
  cv.addEventListener('pointerdown',function(e){try{cv.setPointerCapture(e.pointerId)}catch(x){}ptr[e.pointerId]={x:e.clientX,y:e.clientY};last=Object.keys(ptr).length>1?{d:dist()}:null});
  cv.addEventListener('pointermove',function(e){
    if(!ptr[e.pointerId])return;
    var rect=cv.getBoundingClientRect(),f=CRS/rect.width,n=Object.keys(ptr).length;
    if(n===1){CR.x+=(e.clientX-ptr[e.pointerId].x)*f;CR.y+=(e.clientY-ptr[e.pointerId].y)*f;ptr[e.pointerId]={x:e.clientX,y:e.clientY}}
    else{
      ptr[e.pointerId]={x:e.clientX,y:e.clientY};var d=dist();
      if(last&&last.d>0&&d>0){CR.z=Math.max(1,Math.min(4,CR.z*d/last.d));var z=$('#crZ');if(z)z.value=CR.z}
      last={d:d};
    }
    crClamp();crDraw();e.preventDefault();
  });
  function up(e){delete ptr[e.pointerId];last=null}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){e.preventDefault();CR.z=Math.max(1,Math.min(4,CR.z*(e.deltaY<0?1.08:.92)));var z=$('#crZ');if(z)z.value=CR.z;crClamp();crDraw()},{passive:false});
}

      if(done)return;done=true;clearTimeout(tm);

function relAll(){if(!relCache)relCache=store.get('wb.rel',{})||{};return relCache}
function relGet(w){var c=relAll()[String(w).toLowerCase()];return (c&&Date.now()-c.t<60*DAY)?c.l:null}
function mlFetch(w){
  return new Promise(function(res){
    var done=false,ac=('AbortController' in window)?new AbortController():null;
    var tm=setTimeout(function(){if(!done){done=true;try{ac&&ac.abort()}catch(e){}res(null)}},7000);
    fetch('https://api.datamuse.com/words?ml='+encodeURIComponent(w)+'&max=40',ac?{signal:ac.signal}:undefined).then(function(r){return r.ok?r.json():null}).then(function(j){
      if(done)return;done=true;clearTimeout(tm);
      res(Array.isArray(j)?j.map(function(x){return String(x.word).toLowerCase()}):null);
    }).catch(function(){if(done)return;done=true;clearTimeout(tm);res(null)});
  });
}

function goTo(id){
  var it=items.filter(function(x){return x.id===id})[0];if(!it)return;
  closeSheet();showPage('notes');
  if(bar.classList.contains('searching'))closeSearch();
  setTab(it.type==='word'?'words':'idioms');ensureShown(id);
  var li=$('.item[data-id="'+id+'"]');
  if(li){toggleItem(li,true);setTimeout(function(){li.scrollIntoView({block:'center',behavior:'smooth'})},120)}
}

function qItems(){return items.filter(function(i){return i.ar})}
function startQuiz(pool){
  quiz={pool:pool||shuffle(qItems()).slice(0,12),i:0,score:0,opts:[],picked:null};
  if(quiz.pool.length)prepQ();
}
function prepQ(){qAct();
  var q=quiz.pool[quiz.i];
  var others=shuffle(qItems().filter(function(x){return x.id!==q.id&&x.ar!==q.ar}).map(function(x){return x.ar}));
  var uniq=others.filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,3);
  quiz.opts=shuffle([q.ar].concat(uniq));quiz.picked=null;
}
function backupView(){

    '<div class="group"><div class="exnote">كلماتك تُحفظ على هذا الجهاز وفي هذا المتصفح أو التطبيق فقط، وتحديث الموقع لا يمسحها. الذي يمسحها هو حذف بيانات الموقع من إعدادات المتصفح أو حذف التطبيق، أو الانتقال إلى جهاز آخر. احتفظ بنسخة احتياطية.</div><div class="exnote" id="persistState" style="margin-top:8px"></div></div>'+
    '<div class="seg"><button class="sbtn" data-act="export">تنزيل نسخة احتياطية</button><button class="sbtn" data-act="copyjson">نسخ البيانات</button></div>'+
    '<div><div class="sec-t">استرجاع من نسخة (يُدمج مع كلماتك ولا يحذف شيئًا)</div>'+
    '<div class="seg" style="margin-bottom:10px"><label class="sbtn" for="impFile">اختيار ملف النسخة</label><input id="impFile" type="file" accept=".json,application/json" hidden></div>'+

function backupJSON(){
  return JSON.stringify({app:'daily-words',version:1,exportedAt:new Date().toISOString(),items:items.filter(function(i){return !i.ex}),expl:EXL,explf:EXF},null,1);
}
function importData(text){
  var d;try{d=JSON.parse(text)}catch(e){toast('الملف غير صالح');return}
  var list=Array.isArray(d)?d:(d&&Array.isArray(d.items)?d.items:null);
  if(!list){toast('لم أجد كلمات في هذا الملف');return}
  if(d&&!Array.isArray(d)){var xc=0;(Array.isArray(d.explf)?d.explf:[]).forEach(function(f){if(f&&f.id&&f.n&&!exFold(f.id))EXF.push(f)});(Array.isArray(d.expl)?d.expl:[]).forEach(function(e){if(e&&e.id&&!EXL.some(function(x){return x.id===e.id})){EXL.push(e);xc++}});if(xc||d.explf)exSave()}
  var seen={};items.forEach(function(i){seen[i.type+'|'+i.en.toLowerCase()]=1});
  var used={};items.forEach(function(i){used[i.id]=1});
  var added=0;
  list.forEach(function(o,k){
    if(!o||typeof o.en!=='string'||!o.en.trim())return;
    var type=o.type==='idiom'?'idiom':'word',dk=type+'|'+o.en.trim().toLowerCase();
    if(seen[dk])return;
    seen[dk]=1;
    var id=(typeof o.id==='string'&&/^[\w-]{1,40}$/.test(o.id)&&!used[o.id])?o.id:'i'+Date.now().toString(36)+k;
    used[id]=1;
    items.push({id:id,en:o.en.trim(),ar:typeof o.ar==='string'?o.ar:'',cat:typeof o.cat==='string'&&o.cat?o.cat:'عام',notes:typeof o.notes==='string'?o.notes:'',ph:typeof o.ph==='string'?o.ph:'',type:type,ts:typeof o.ts==='number'?o.ts:Date.now(),upd:Date.now(),ex:false});
    dirty[id]=1;added++;
  });
  if(added){persist();render();syncSoon()}
  toast(added?'تم استرجاع '+added+' من الكلمات':'جميع كلمات النسخة موجودة لديك مسبقًا');
  if(current==='backup')renderSheet();
}
function persistInfo(){

    if(navigator.storage&&navigator.storage.persisted){
      navigator.storage.persisted().then(function(p){
        var e2=$('#persistState');if(e2)e2.textContent=p?'حماية التخزين: مفعّلة، فلن يحذف المتصفح بياناتك تلقائيًا.':'حماية التخزين: غير مفعّلة، وقد يحذف المتصفح البيانات إذا امتلأت المساحة. تثبيت التطبيق يرفع الحماية غالبًا.';
      });
    }
  }catch(e){}

function fcJump(ni,dx){
  var card=$('#fcCard'),scene=$('#fcScene');

function dictCheck(giveUp){qAct();
  var it=fcItem();if(!it||fc.flipped)return;
  var val=($('#dictIn').value||'').trim();
  if(!giveUp&&!val){toast('اكتب الكلمة أولًا');$('#dictIn').focus();return}
  var ok=!giveUp&&dnorm(val)===dnorm(it.en),near=-1,kind='';
  if(!ok&&!giveUp){
    var a1=dnorm(val),b1=dnorm(it.en);
    if(a1.length===b1.length-1){for(var k=0;k<b1.length;k++){if(b1.slice(0,k)+b1.slice(k+1)===a1){near=k;kind='miss';break}}}
    else if(a1.length===b1.length){var df=-1,dc=0;for(var q=0;q<b1.length;q++){if(a1.charAt(q)!==b1.charAt(q)){dc++;df=q}}if(dc===1){near=df;kind='sub'}}
  }
  fc.res={ok:ok,val:val,give:!!giveUp,near:near,kind:kind};fc.flipped=true;fc.tried++;if(ok)fc.okc++;
  if(near>-1){review(it);chime('good')}else{review(it,ok);chime(ok?'good':'bad')}
  fcUpdate();
  if(fc.i===fc.order.length-1&&!fc.done){fc.done=true;examDone();setTimeout(function(){chime('end');toast('انتهيت: '+fc.okc+' صحيح من '+fc.tried)},700)}
}
function fcGo(d){
  var n=fc.order.length,ni=Math.max(0,Math.min(n-1,fc.i+d));
  if(ni!==fc.i)fcJump(ni,d>0?-20:20);
}
