<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الكلمات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="app-build" content="c2b7fd6b8e62">
<title>دفتر الكلمات اليومي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: fixed top bar (search / theme on the left, menu on the right), one 640px column: tabs, new-sheet card, saved list. Tools open as bottom sheets. */
@property --bg{syntax:'<color>';inherits:true;initial-value:#0b1020}
@property --bar{syntax:'<color>';inherits:true;initial-value:rgba(11,16,32,.84)}
@property --surface{syntax:'<color>';inherits:true;initial-value:#121a2e}
@property --surface-2{syntax:'<color>';inherits:true;initial-value:#18223a}
@property --line{syntax:'<color>';inherits:true;initial-value:#243050}
@property --fg{syntax:'<color>';inherits:true;initial-value:#e8eefc}
@property --muted{syntax:'<color>';inherits:true;initial-value:#8e9bba}
@property --accent{syntax:'<color>';inherits:true;initial-value:#5ea6ff}
@property --accent-ink{syntax:'<color>';inherits:true;initial-value:#06142b}
@property --accent-soft{syntax:'<color>';inherits:true;initial-value:rgba(94,166,255,.14)}
@property --good{syntax:'<color>';inherits:true;initial-value:#3ecf8e}
@property --good-bg{syntax:'<color>';inherits:true;initial-value:rgba(62,207,142,.14)}
@property --bad{syntax:'<color>';inherits:true;initial-value:#ff6b7a}
@property --bad-bg{syntax:'<color>';inherits:true;initial-value:rgba(255,107,122,.14)}
@property --overlay{syntax:'<color>';inherits:true;initial-value:rgba(4,8,18,.62)}
@property --mark-bg{syntax:'<color>';inherits:true;initial-value:#ffd93d}
@property --mark-fg{syntax:'<color>';inherits:true;initial-value:#1b1500}
:root{
  transition:--bg .6s cubic-bezier(.4,0,.2,1),
  --bar .6s cubic-bezier(.4,0,.2,1),
  --surface .6s cubic-bezier(.4,0,.2,1),
  --surface-2 .6s cubic-bezier(.4,0,.2,1),
  --line .6s cubic-bezier(.4,0,.2,1),
  --fg .6s cubic-bezier(.4,0,.2,1),
  --muted .6s cubic-bezier(.4,0,.2,1),
  --accent .6s cubic-bezier(.4,0,.2,1),
  --accent-ink .6s cubic-bezier(.4,0,.2,1),
  --accent-soft .6s cubic-bezier(.4,0,.2,1),
  --good .6s cubic-bezier(.4,0,.2,1),
  --good-bg .6s cubic-bezier(.4,0,.2,1),
  --bad .6s cubic-bezier(.4,0,.2,1),
  --bad-bg .6s cubic-bezier(.4,0,.2,1),
  --overlay .6s cubic-bezier(.4,0,.2,1),
  --mark-bg .6s cubic-bezier(.4,0,.2,1),
  --mark-fg .6s cubic-bezier(.4,0,.2,1);
  --bg:#0b1020;
  --bar:rgba(11,16,32,.84);
  --surface:#121a2e;
  --surface-2:#18223a;
  --line:#243050;
  --fg:#e8eefc;
  --muted:#8e9bba;
  --accent:#5ea6ff;
  --accent-ink:#06142b;
  --accent-soft:rgba(94,166,255,.14);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --overlay:rgba(4,8,18,.62);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --font-ui:'Tajawal','Bricolage Grotesque',system-ui,sans-serif;
  --font-en:'Bricolage Grotesque','Tajawal',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eff3fb;
  --bar:rgba(239,243,251,.88);
  --surface:#ffffff;
  --surface-2:#f2f5fc;
  --line:#d8e0f1;
  --fg:#0e1a33;
  --muted:#5b6988;
  --accent:#1c6ee0;
  --accent-ink:#ffffff;
  --accent-soft:rgba(28,110,224,.1);
  --good:#12805a;
  --good-bg:rgba(18,128,90,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(14,26,51,.38);
  --shadow:0 14px 32px rgba(20,40,90,.16);
  color-scheme:light;
}
html.thm *,html.thm *::before,html.thm *::after{transition:none!important}
:root[data-theme="purple"]{
  --bg:#120b22;
  --bar:rgba(18,11,34,.84);
  --surface:#1b1233;
  --surface-2:#241a42;
  --line:#382a63;
  --fg:#f0eaff;
  --muted:#a898cf;
  --accent:#a78bfa;
  --accent-ink:#1a0b3a;
  --accent-soft:rgba(167,139,250,.16);
  --overlay:rgba(8,4,18,.64);
  --shadow:0 14px 34px rgba(5,0,20,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="forest"]{
  --bg:#08140f;
  --bar:rgba(8,20,15,.84);
  --surface:#0f2119;
  --surface-2:#152b21;
  --line:#1f3d2f;
  --fg:#e6f5ec;
  --muted:#8fb3a0;
  --accent:#34d399;
  --accent-ink:#04210f;
  --accent-soft:rgba(52,211,153,.15);
  --overlay:rgba(2,10,6,.64);
  --shadow:0 14px 34px rgba(0,10,5,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="ocean"]{
  --bg:#07161c;
  --bar:rgba(7,22,28,.84);
  --surface:#0d2630;
  --surface-2:#12303c;
  --line:#1c4655;
  --fg:#e4f6fb;
  --muted:#8bb4c2;
  --accent:#22d3ee;
  --accent-ink:#032630;
  --accent-soft:rgba(34,211,238,.15);
  --overlay:rgba(2,12,16,.64);
  --shadow:0 14px 34px rgba(0,12,18,.55);
  --good:#3ecf8e;
  --good-bg:rgba(62,207,142,.14);
  --bad:#ff6b7a;
  --bad-bg:rgba(255,107,122,.14);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  color-scheme:dark;
}
:root[data-theme="sand"]{
  --bg:#faf3e8;
  --bar:rgba(250,243,232,.9);
  --surface:#fffaf2;
  --surface-2:#f5ebdc;
  --line:#e6d6bc;
  --fg:#2b2116;
  --muted:#7d6b53;
  --accent:#c2410c;
  --accent-ink:#ffffff;
  --accent-soft:rgba(194,65,12,.1);
  --good:#15803d;
  --good-bg:rgba(21,128,61,.12);
  --bad:#c9304a;
  --bad-bg:rgba(201,48,74,.1);
  --overlay:rgba(43,33,22,.38);
  --mark-bg:#ffd93d;
  --mark-fg:#1b1500;
  --shadow:0 14px 32px rgba(90,60,20,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-ui);-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.row:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0}

/* press animation */
@keyframes press{0%{transform:scale(1)}40%{transform:scale(.9)}100%{transform:scale(1)}}
.tap{animation:press .2s ease-out}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{position:relative;height:56px;max-width:640px;margin:0 auto;padding-inline:16px;display:flex;align-items:center}
.left{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center}
.ibtn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;line-height:1;overflow:hidden;transition:background .2s,border-color .2s,width .3s cubic-bezier(.2,.8,.2,1),opacity .2s,margin .3s}
.ibtn:hover{border-color:var(--accent)}
.ibtn svg,.snd svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd{color:var(--accent)}
.snd svg{width:18px;height:18px}
#btnSearch{margin-right:8px}
.bar.searching #btnSearch{background:var(--accent-soft);border-color:var(--accent)}
.bar.searching #btnTheme{width:0;opacity:0;border-width:0;pointer-events:none}
.sfield{flex:0 0 0;min-width:0;opacity:0;overflow:hidden;display:flex;align-items:center;gap:8px;pointer-events:none;transition:flex-grow .32s cubic-bezier(.2,.8,.2,1),opacity .22s}
.bar.searching .sfield{flex:1 1 0;opacity:1;pointer-events:auto}
.pill{flex:1;min-width:0;height:40px;padding-inline:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;transition:border-color .2s}
.pill:focus-within{border-color:var(--accent)}
.pill input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:500 16px var(--font-ui)}
.pill input::placeholder{color:var(--muted)}
.title{position:absolute;left:0;right:0;text-align:center;pointer-events:none;font-weight:800;font-size:17px;letter-spacing:.2px;transition:opacity .2s}
.title b{color:var(--accent);font-family:var(--font-en);font-size:19px}
.bar.searching .title{opacity:0}
.menu-anchor{position:relative;z-index:2;flex:none;margin-left:8px}
#btnMenu{font-size:20px}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:min(268px,calc(100vw - 32px));direction:rtl;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);transform-origin:calc(100% - 20px) 0;opacity:0;visibility:hidden;transform:translateY(-12px) scale(.94);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.25,1.08),visibility 0s .28s}
.menu.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.menu::before{content:'';position:absolute;top:-6px;right:14px;width:11px;height:11px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
@keyframes rise{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.menu.open .mitem{animation:rise .3s both}
.menu.open .mitem:nth-child(1){animation-delay:.04s}
.menu.open .mitem:nth-child(2){animation-delay:.08s}
.menu.open .mitem:nth-child(3){animation-delay:.12s}
.menu.open .mitem:nth-child(4){animation-delay:.16s}
.mitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:11px;text-align:start;font-weight:500;font-size:15px;transition:background .15s}
.mitem:hover,.mitem:focus-visible{background:var(--surface-2)}
.mitem .e{width:26px;display:grid;place-items:center;color:var(--accent)}
.mitem .e svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* page */
.wrap{max-width:640px;margin:0 auto;padding:72px 16px 48px;display:flex;flex-direction:column;gap:16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.tab{height:42px;border-radius:10px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .lat{font-family:var(--font-en)}
.tab .n{font:700 12px var(--font-en);padding:1px 8px;border-radius:99px;background:rgba(127,127,127,.22);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:16px;font-weight:800}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mini{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.mini button{height:30px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;line-height:1;border-radius:99px;font-size:13.5px;font-weight:800;color:var(--accent);opacity:.6;transition:background .2s,opacity .2s,transform .12s}
.mini button>span{display:block;transform:translateY(1px)}
.mini button:active{transform:scale(.94)}
.mini button[aria-selected="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
textarea{display:block;width:100%;min-height:104px;resize:vertical;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:500 16px/1.6 var(--font-en)}
textarea{unicode-bidi:plaintext}
textarea::placeholder{color:var(--muted)}
.ff{display:flex;flex-direction:column;gap:12px}
.ff label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ff input{display:block;width:100%;height:46px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--fg);font:500 16px/1.4 var(--font-ui)}
.ff input::placeholder{color:var(--muted)}
.ff input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ff textarea{min-height:76px}
.pfb{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);cursor:pointer;margin:8px 0 4px}
.pfb .pi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pfb .pi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pfb .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pfb .pb b{font-size:15px}.pfb .pb small{font-size:12.5px;line-height:1.6;color:var(--muted)}
.propl{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);opacity:.75;cursor:not-allowed;margin-top:4px}
.propl .pi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.propl .pi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.propl .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.propl .pb b{font-size:15px;color:var(--fg)}.propl .pb small{font-size:12.5px;line-height:1.6}
.propl .pc{flex:none;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.ver{text-align:center;font:600 12px var(--font-en);color:var(--muted);direction:ltr;padding:4px 0 0;opacity:.8}
.foot{display:flex;align-items:center;gap:12px;margin-top:10px}
.hint{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--muted)}
.hint.err{color:var(--bad)}
.hint code{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate;color:var(--fg)}
.save{flex:none;height:42px;padding-inline:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}

/* list */
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.item.open{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:56px}
.en{flex:0 1 auto;min-width:0;max-width:46%;direction:ltr;unicode-bidi:isolate;font:700 17px var(--font-en);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snd{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}
.cat{flex:none;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .detail{grid-template-rows:1fr}
.detail-in{overflow:hidden;min-height:0}
.detail-pad{display:flex;flex-direction:column;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-word{direction:ltr;unicode-bidi:isolate;font:800 24px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere;min-width:0}
.d-play{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{height:36px;padding-inline:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700}
.lbl{font-size:12px;color:var(--muted);margin-bottom:2px}
.val{overflow-wrap:anywhere}
.val.note{padding:9px 12px;background:var(--surface-2);border-radius:10px;font-family:var(--font-en);display:flex;flex-direction:column;gap:1px}
.nl{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.7}.nl[dir=ltr]{text-align:left;font-family:var(--font-en)}.nl[dir=rtl]{text-align:right}
.nl.nsp{height:1.1em;background:none;border:0;padding:0;margin:0;border-radius:0}
.val.ph{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-en)}
.val.none{color:var(--muted)}
.nedit{display:flex;flex-direction:column;gap:8px}
.ne-ph,.ne-in{width:100%;height:42px;padding-inline:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);font:500 16px var(--font-en)}
.ne-ph::placeholder,.ne-in::placeholder{color:var(--muted)}
.ne-ph:focus-visible,.ne-in:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save.sm{height:38px;padding-inline:16px}
.menu.open .mitem:nth-child(5){animation-delay:.2s}
.menu.open .mitem:nth-child(6){animation-delay:.24s}
.menu.open .mitem:nth-child(7){animation-delay:.28s}
.menu.open .mitem:nth-child(8){animation-delay:.32s}
.menu.open .mitem:nth-child(9){animation-delay:.36s}
.menu.open .mitem:nth-child(10){animation-delay:.4s}
.menu.open .mitem:nth-child(11){animation-delay:.44s}
.menu.open .mitem:nth-child(12){animation-delay:.48s}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#ffffff;color:#1f1f1f;border:1px solid #dadce0}
.gbtn svg{width:20px;height:20px;flex:none}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html{overscroll-behavior:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.exnote{font-size:12px;color:var(--muted)}
.mbadge{margin-inline-start:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:800 12px/22px var(--font-en);text-align:center}
.mbadge[hidden]{display:none}
.srt{font-weight:800;font-size:18px;text-align:center}
.srcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 14px}
.srw{font:800 34px/1.2 var(--font-en);color:var(--accent);overflow-wrap:anywhere}
.srp{font:500 15px var(--font-en);color:var(--muted)}
.sra{font:800 24px/1.5 var(--font-ui)}
.srcard hr{align-self:stretch;border:0;border-top:1px solid var(--line);margin:4px 0}
.srbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srbtns .sbtn{height:50px;justify-content:center;font-size:15px}

.lbnode.m{border-color:#facc15;background:rgba(250,204,21,.1)}
.lbnode .lbn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;text-decoration:none;background:color-mix(in srgb,var(--dc) 28%,#0b1028);color:var(--dc);border:2px solid var(--dc)}
.lbnode.m .lbn{background:#facc15;color:#1b1500;border-color:#facc15}
.lbnc{display:flex;flex-direction:column;gap:2px;min-width:0}.lbnc span{font-size:12px;opacity:.75}.lbnc small{font-size:11px;opacity:.6}
.lbword.known{border-inline-start:3px solid var(--dc,#34d399)}
.lbkn.on{background:#34d399;color:#04210f}
.lbleft{display:block;font-size:12px;opacity:.7;margin:2px 0 8px}
.lbcl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.lbclm{flex:1;background:none;border:0;color:inherit;text-align:start;display:flex;flex-direction:column;gap:3px;cursor:pointer;padding:0}
.lbclm span{font-size:12px;opacity:.7}.lbc.on{border-color:#5ea6ff}
.lbai{border-style:dashed}.lbai[disabled]{opacity:.4}
.lbbusy button{margin-inline-start:auto}
</style>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};

var root=document.documentElement;
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:d},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var VAULT=store.get('wb.vault',{})||{};if(typeof VAULT!=='object'||Array.isArray(VAULT))VAULT={};

var PRO=false;try{localStorage.removeItem('wb.pro')}catch(e){}
function clRelock(){PRO=false;if(CL.model==='small')CL.model='base'}
var DAY=86400000;
var MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
var SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var SPK='<svg viewBox="-0.75 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
var CATS=['اسم','فعل','صفة','ضمير','حرف جر','ظرف/حال','روابط'];
var ICATS=['رسمية','غير رسمية'];
function catsFor(t){return t==='idiom'?ICATS:CATS}
var LANGS={'en-US':'أمريكية','en-GB':'بريطانية','en-AU':'أسترالية'};

/* ---------- data ---------- */
var seed=[
  ['serendipity','صدفة سعيدة','اسم','Finding that old letter was pure serendipity.','word','/ˌserənˈdɪpəti/'],
  ['resilient','مرن وقادر على التعافي','صفة','Children are often more resilient than we expect.','word','/rɪˈzɪliənt/'],
  ['procrastinate','يماطل ويؤجّل','فعل','Stop procrastinating and start the report.','word','/prəˈkræstɪneɪt/'],
  ['meticulous','دقيق جدًا في التفاصيل','صفة','She is meticulous about her notes.','word','/məˈtɪkjələs/'],
  ['ubiquitous','منتشر في كل مكان','صفة','Smartphones are ubiquitous now.','word','/juːˈbɪkwɪtəs/'],
  ['nevertheless','مع ذلك','ظرف/حال','It was raining. Nevertheless, we went out.','word','/ˌnevəðəˈles/'],
  ['reconcile','يوفّق بين طرفين متعارضين ويُصلح بينهما حتى يعود الوئام كما كان','فعل','They finally reconciled after years apart.','word','/ˈrekənsaɪl/'],
  ['break the ice','كسر الجمود في بداية اللقاء','غير رسمية','A joke is a good way to break the ice.','idiom'],
  ['piece of cake','شيء سهل جدًا','غير رسمية','The exam was a piece of cake.','idiom'],
  ['under the weather','متوعك قليلًا','غير رسمية','I am feeling a bit under the weather.','idiom'],
  ['once in a blue moon','نادرًا جدًا','غير رسمية','We meet once in a blue moon.','idiom'],
  ['hit the nail on the head','أصاب كبد الحقيقة','غير رسمية','You hit the nail on the head with that answer.','idiom']
];
var t0=Date.now();
/* استيراد تلقائي لكلمات النسخة السابقة من نفس المتصفح. للقراءة فقط، ولا يُعدَّل أو يُحذف أي مفتاح قديم. */
function legacyImport(){
  var LAT=/[A-Za-z]/,ARB=/[؀-ۿ]/,seq=0,found=[];
  function mapList(arr,keyName){
    var out=[],idiomKey=/idiom/i.test(keyName),base=Date.now();
    arr.forEach(function(o,idx){
      if(!o||typeof o!=='object'||Array.isArray(o))return;
      var strs=[];
      Object.keys(o).forEach(function(f){if(typeof o[f]==='string'&&o[f].trim())strs.push([f.toLowerCase(),o[f].trim()])});
      function pick(names,test,fallback){
        for(var n=0;n<names.length;n++)for(var j=0;j<strs.length;j++)if(strs[j][0]===names[n]&&(!test||test(strs[j][1])))return strs[j][1];
        if(fallback)for(var q=0;q<strs.length;q++)if(test(strs[q][1]))return strs[q][1];
        return '';
      }
      var en=pick(['en','english','word','term','eng','front','text','name'],function(x){return LAT.test(x)&&!ARB.test(x)},true);
      var ar=pick(['ar','arabic','meaning','mean','translation','def','definition','back'],function(x){return ARB.test(x)},true);
      if(!en||!ar)return;
      var kind=String(o.type||o.kind||o.tab||o.section||'');
      var cat=o.cat!==undefined?o.cat:(o.category!==undefined?o.category:(o.pos!==undefined?o.pos:o['تصنيف']));
      if(Array.isArray(cat))cat=cat[0];
      if(typeof cat!=='string'||!cat.trim()||/^(word|words|idiom|idioms)$/i.test(cat.trim()))cat='عام';
      var notes=pick(['notes','note','example','examples','ex','sentence','desc','description','details'],null,false);
      var ph=pick(['ph','phonetic','phonetics','ipa','pron','pronunciation'],null,false);
      var ts=NaN;
      ['ts','time','created','createdat','added','addedat','date','timestamp'].some(function(f){
        var key=Object.keys(o).filter(function(k){return k.toLowerCase()===f})[0];
        if(key===undefined)return false;
        var v=o[key];
        if(typeof v==='number'&&v>1e11){ts=v;return true}
        if(typeof v==='string'&&!isNaN(Date.parse(v))){ts=Date.parse(v);return true}
        return false;
      });
      if(isNaN(ts))ts=base-idx*1000;
      out.push({id:'m'+(seq++).toString(36)+base.toString(36),en:en,ar:ar,cat:cat.trim(),notes:notes,ph:ph,type:(idiomKey||/idiom/i.test(kind))?'idiom':'word',ts:ts,ex:false});
    });
    return out;
  }
  try{
    for(var k=0;k<localStorage.length;k++){
      var key=localStorage.key(k);
      if(!key||key.indexOf('wb.')===0)continue;
      var v;
      try{v=JSON.parse(localStorage.getItem(key))}catch(e){continue}
      if(Array.isArray(v))found=found.concat(mapList(v,key));
      else if(v&&typeof v==='object')Object.keys(v).forEach(function(kk){if(Array.isArray(v[kk]))found=found.concat(mapList(v[kk],key+'.'+kk))});
    }
  }catch(e){}
  var seen={};
  return found.filter(function(i){var d=i.type+'|'+i.en.toLowerCase();if(seen[d])return false;seen[d]=1;return true});
}
function seedItems(){return seed.map(function(s,i){return {id:'s'+i,en:s[0],ar:s[1],cat:s[2],notes:s[3],type:s[4],ph:s[5]||'',ts:t0-i*3600000,ex:true}})}
var items=store.get('wb.items',null),imported=0;
/* حماية: إذا وُجدت بيانات محفوظة لكن تعذّرت قراءتها، تُحفظ نسخة منها قبل أي كتابة جديدة. */
if(!Array.isArray(items)){
  try{var rawOld=localStorage.getItem('wb.items');if(rawOld)localStorage.setItem('wb.items.unreadable.'+Date.now(),rawOld)}catch(e){}
}
if(!Array.isArray(items)){
  var legacy=legacyImport();
  if(legacy.length){items=legacy;imported=legacy.length}
  else items=seedItems();
  store.set('wb.items',items);
}
items.forEach(function(i){if(i.ex&&i.type==='idiom'&&i.cat==='تعبير')i.cat='غير رسمية'});
var pref=store.get('wb.pref',{accent:'en-US',rate:1});
items.forEach(function(i){if(i.cat==='ظرف')i.cat='ظرف/حال'});
var tombs=store.get('wb.tombs',{}),dirty=store.get('wb.dirty',{});
var THEMES=['dark','light','purple','forest','ocean','sand'],LIGHTS=['light','sand'],THBG={dark:'#0b1020',light:'#eff3fb',purple:'#120b22',forest:'#08140f',ocean:'#07161c',sand:'#faf3e8'};
var FONTS=['tajawal','cairo','amiri'];
var fontSel=store.get('wb.font','tajawal');if(FONTS.indexOf(fontSel)<0)fontSel='tajawal';
function applyFont(){if(fontSel==='tajawal')root.removeAttribute('data-font');else root.setAttribute('data-font',fontSel)}
applyFont();
var theme=store.get('wb.theme','dark');if(THEMES.indexOf(theme)<0)theme='dark';
var tab='words', query='', current=null, quiz=null, acSel='tomato', fc=null, revMode='cards';
function persist(){store.set('wb.items',items);store.set('wb.tombs',tombs);store.set('wb.dirty',dirty)}
var trash=store.get('wb.trash',[])||[];
var TRASH_MS=15*DAY;
function saveTrash(){store.set('wb.trash',trash)}
function purgeTrash(){var n=Date.now(),l=trash.length;trash=trash.filter(function(t){return t&&t.it&&n-t.at<TRASH_MS});if(trash.length!==l)saveTrash()}
purgeTrash();
function touch(it){it.upd=Date.now();if(!it.ex)dirty[it.id]=1;persist();syncSoon()}
function savePref(){store.set('wb.pref',pref)}

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString(LANG==='en'?'en-GB':'ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){return new Date(ts).toISOString().slice(0,10)}}
function fmtTime(ts){try{return new Date(ts).toLocaleTimeString(LANG==='en'?'en-GB':'ar-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function fmtDay(d){try{return d.toLocaleDateString(LANG==='en'?'en':'ar',{weekday:'short'})}catch(e){return String(d.getDate())}}
var toastT;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1900)}
function setInert(el,on){if(on)el.setAttribute('inert','');else el.removeAttribute('inert')}

function copyText(t){
  var done=function(){toast('تم النسخ')};
  var fb=function(){
    try{
      var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0;left:-9999px';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      ok?done():toast('تعذّر النسخ');
    }catch(e){toast('تعذّر النسخ')}
  };
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}catch(e){fb()}
}

function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)){toast('هذا الجهاز لا يدعم النطق');return}
    var ss=window.speechSynthesis;ss.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang||pref.accent;
    var vs=ss.getVoices()||[];
    var norm=function(v){return v.lang.replace('_','-').toLowerCase()};
    var v=vs.filter(function(x){return norm(x)===u.lang.toLowerCase()})[0]||vs.filter(function(x){return norm(x).indexOf('en')===0})[0];
    if(v)u.voice=v;
    u.rate=pref.rate||1;
    ss.speak(u);
  }catch(e){toast('تعذّر تشغيل الصوت')}
}

/* ---------- theme ---------- */
var thmT=0;
function noSpell(el){
  if(!el||el.nodeType!==1)return;
  var list=el.matches&&el.matches('input,textarea')?[el]:[];
  if(el.querySelectorAll)list=list.concat([].slice.call(el.querySelectorAll('input:not([type=file]):not([type=checkbox]):not([type=radio]),textarea')));
  list.forEach(function(f){
    f.setAttribute('spellcheck','false');f.spellcheck=false;
    f.setAttribute('autocorrect','off');f.setAttribute('autocomplete','off');f.setAttribute('data-gramm','false');f.setAttribute('data-gramm_editor','false');f.setAttribute('data-enable-grammarly','false');
  });
}
noSpell(document.body);
new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(noSpell)})}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('focusin',function(e){noSpell(e.target)});
function paintTheme(){
  root.setAttribute('data-theme',theme);
  var mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.setAttribute('content',THBG[theme]||'#0b1020');
}

}

var DIA=/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/;
function normMap(str){
  var out='',map=[];
  for(var i=0;i<str.length;i++){
    var c=str.charAt(i);
    if(DIA.test(c))continue;
    c=c.toLowerCase();
    if('\u0623\u0625\u0622\u0671'.indexOf(c)>-1)c='\u0627';
    else if(c==='\u0649')c='\u064A';
    for(var k=0;k<c.length;k++){out+=c.charAt(k);map.push(i)}
  }
  return {s:out,map:map};
}
function norm(str){return normMap(String(str)).s}
function hl(text){
  text=String(text);
  if(!query)return esc(text);
  var nm=normMap(text),ranges=[],from=0,idx;
  while((idx=nm.s.indexOf(query,from))>-1){
    var st=nm.map[idx],en=nm.map[idx+query.length-1]+1;
    while(en<text.length&&DIA.test(text.charAt(en)))en++;
    ranges.push([st,en]);from=idx+query.length;
  }
  if(!ranges.length)return esc(text);
  var out='',p=0;
  ranges.forEach(function(r){
    if(r[0]<p)r[0]=p;
    if(r[1]<=r[0])return;
    out+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1];
  });
  return out+esc(text.slice(p));
}
function noteSegs(l){
  var toks=l.split(/(\s+)/),segs=[],cur=null;
  toks.forEach(function(t){
    if(!t)return;
    var ar=/[\u0600-\u06FF]/.test(t),la=/[A-Za-z]/.test(t),k=ar?'r':(la?'l':null);
    if(!cur){cur={k:k,t:t};segs.push(cur);return}
    if(k&&cur.k&&k!==cur.k){cur={k:k,t:t};segs.push(cur)}
    else{if(k&&!cur.k)cur.k=k;cur.t+=t}
  });
  function wc(g){return g.t.split(/\s+/).filter(function(x){return /[A-Za-z\u0600-\u06FF]/.test(x)}).length}
  var again=true;
  while(again){again=false;
    for(var i=1;i<segs.length-1;i++){
      if(segs[i].k&&segs[i-1].k&&segs[i-1].k===segs[i+1].k&&segs[i].k!==segs[i-1].k&&wc(segs[i])<=3){
        segs.splice(i-1,3,{k:segs[i-1].k,t:segs[i-1].t+segs[i].t+segs[i+1].t});again=true;break}
    }
  }
  return segs;
}

}

var AR=/[؀-ۿ]/,LAT=/[A-Za-z]/;
function trimSep(x){return x.replace(/^[\s\-–—=:|،,]+|[\s\-–—=:|،,]+$/g,'')}
/* كتابة حرة: أي نص يُقبل. السطر الأول هو الكلمة، والمعنى يؤخذ من نفس السطر أو من السطر التالي، والباقي ملاحظة. */
var FLAG=/\uD83C[\uDDE6-\uDDFF]\uD83C[\uDDE6-\uDDFF]/g;
var IPA=/[æðŋœɐ-˿θᴀ-ᶿ]/;
var PH_SRC='(\\/[^\\/\\n\\u0600-\\u06FF]{2,40}\\/|\\[[^\\]\\n\\u0600-\\u06FF]{2,40}\\])';
function findPh(str){
  var re=new RegExp(PH_SRC,'g'),m;
  while((m=re.exec(str))){if(IPA.test(m[1]))return m[1]}
  return '';
}
function cleanMeaning(x){return x.replace(/^(تعني|معناها|معنى|المعنى|يعني)\s*[:：\-–]\s*/,'').replace(/[.。]+$/,'').trim()}
function parseFree(text){
  var lines=text.replace(/\r/g,'').split('\n').map(function(x){return x.replace(/\s+$/,'')});
  var first=(lines.shift()||'').trim();
  var ph=findPh(first);
  if(ph)first=first.replace(ph,' ');
  first=first.replace(FLAG,' ').replace(/\s+/g,' ').trim();
  var en=first,ar='',raw='',ia=first.search(AR),il=first.search(LAT);
  if(ia>-1&&il>-1){
    if(il<ia){en=first.slice(0,ia);ar=first.slice(ia)}else{ar=first.slice(0,il);en=first.slice(il)}
    en=trimSep(en);ar=trimSep(ar);
  }else{
    for(var k=0;k<lines.length;k++)if(lines[k].trim()){raw=lines[k].trim();break}
    if(raw)ar=cleanMeaning(raw);
  }
  var notes=lines.join('\n').replace(/^\s*\n/,'').replace(/\s+$/,'');
  if(raw&&notes.trim()===raw)notes='';
  if(!ph&&en){
    var m2=new RegExp(en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*'+PH_SRC).exec(text);
    if(m2&&IPA.test(m2[1]))ph=m2[1];
  }
  return {en:en,ar:ar,ph:ph,notes:notes};
}

var audHas={},audMem={},audDB=null,auId=null;

function audOpen(){
  return new Promise(function(res){
    if(audDB)return res(audDB);
    try{
      var rq=indexedDB.open('wb-audio',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('a')};
      rq.onsuccess=function(){audDB=rq.result;res(audDB)};

      try{var tx=db.transaction('a',mode),st=tx.objectStore('a'),r=fn(st);tx.oncomplete=function(){res(r&&r.result!==undefined?r.result:true)};tx.onerror=tx.onabort=function(){res(null)}}catch(e){res(null)}
    });
  });

var STORIES=[{"id":"s1","lv":0,"t":"The Lost Cat","ta":"القطة الضائعة","ps":[["Sara has a small white cat. The cat's name is Milo. Every morning, Milo sits by the window and looks at the birds.","لدى سارة قطة بيضاء صغيرة. اسم القطة ميلو. كل صباح يجلس ميلو بجانب النافذة وينظر إلى الطيور."],["One day, the window is open. Milo jumps out and runs away. Sara cannot find him. She is very sad.","في أحد الأيام تكون النافذة مفتوحة. يقفز ميلو إلى الخارج ويهرب. لا تستطيع سارة العثور عليه. هي حزينة جدًا."],["Sara walks in the street and asks her neighbors. \"Did you see my cat?\" she says. An old man says, \"Yes! I saw a white cat near the park.\"","تمشي سارة في الشارع وتسأل جيرانها. تقول: «هل رأيتم قطتي؟» يقول رجل عجوز: «نعم! رأيت قطة بيضاء قرب الحديقة.»"],["Sara runs to the park. Milo is under a big tree. He is hungry and tired. Sara takes him home and gives him some milk. Now the window is always closed.","تركض سارة إلى الحديقة. ميلو تحت شجرة كبيرة. هو جائع ومتعب. تأخذه سارة إلى البيت وتعطيه بعض الحليب. الآن النافذة مغلقة دائمًا."]],"gl":{"window":"نافذة","bird":"طائر","jump":"يقفز","sad":"حزين","neighbor":"جار","street":"شارع","park":"حديقة","tree":"شجرة","hungry":"جائع","tired":"متعب","closed":"مغلق","open":"مفتوح","sit":"يجلس","milk":"حليب","cat":"قطة"},"q":[["What is the cat's name?",["Milo","Sara","Tom"],0],["Where does Sara find Milo?",["In the house","Under a tree in the park","In the street"],1],["Why is the window always closed now?",["Because it is cold","So Milo cannot run away","Because Sara is sad"],1]]},{"id":"s2","lv":0,"t":"A Day at the Market","ta":"يوم في السوق","ps":[["Ali goes to the market with his mother. The market is big and busy. There are many people and many shops.","يذهب علي إلى السوق مع أمه. السوق كبير ومزدحم. فيه ناس كثيرون ومحلات كثيرة."],["His mother buys apples, bread, and rice. Ali carries the bag. \"It is heavy,\" he says. His mother laughs.","تشتري أمه تفاحًا وخبزًا ورزًا. يحمل علي الكيس. يقول: «إنه ثقيل». تضحك أمه."],["Then Ali sees a toy car. It is red and fast. It costs five dollars. He has only three dollars.","ثم يرى علي سيارة لعبة. إنها حمراء وسريعة. سعرها خمسة دولارات. معه ثلاثة دولارات فقط."],["His mother gives him two dollars. Ali buys the car and says, \"Thank you, Mom!\" He is very happy all the way home.","تعطيه أمه دولارين. يشتري علي السيارة ويقول: «شكرًا يا أمي!» هو سعيد جدًا طوال الطريق إلى البيت."]],"gl":{"market":"سوق","busy":"مزدحم","shop":"محل","buy":"يشتري","apple":"تفاحة","bread":"خبز","rice":"رز","carry":"يحمل","heavy":"ثقيل","laugh":"يضحك","toy":"لعبة","cost":"يكلّف","dollar":"دولار","happy":"سعيد"},"q":[["What does Ali carry?",["The bag","The toy car","His mother"],0],["How much is the toy car?",["Two dollars","Three dollars","Five dollars"],2],["How does Ali get enough money?",["He finds it","His mother gives him two dollars","He sells apples"],1]]},{"id":"s3","lv":0,"t":"The New Neighbor","ta":"الجار الجديد","ps":[["A new family lives next door. They have a boy named Adam. Adam is eight years old, like me.","تسكن عائلة جديدة في البيت المجاور. لديهم ولد اسمه آدم. عمر آدم ثماني سنوات، مثلي."],["At first, he is shy. He does not talk much. I say, \"Hello! Do you want to play football?\" He smiles and says, \"Yes, please.\"","في البداية هو خجول. لا يتكلم كثيرًا. أقول: «مرحبًا! هل تريد أن تلعب كرة القدم؟» يبتسم ويقول: «نعم، من فضلك.»"],["We play in the garden until the sun goes down. His mother brings us juice and cake. It is a great afternoon.","نلعب في الحديقة حتى تغرب الشمس. تحضر أمه لنا عصيرًا وكعكة. كان وقتًا رائعًا بعد الظهر."],["Now Adam is my best friend. We walk to school together every day.","الآن آدم هو أفضل صديق لي. نمشي إلى المدرسة معًا كل يوم."]],"gl":{"neighbor":"جار","shy":"خجول","smile":"يبتسم","garden":"حديقة","juice":"عصير","cake":"كعكة","great":"رائع","afternoon":"بعد الظهر","friend":"صديق","together":"معًا","school":"مدرسة","football":"كرة القدم"},"q":[["How old is Adam?",["Six","Eight","Ten"],1],["Why does Adam not talk much at first?",["He is shy","He is sick","He is angry"],0],["What do the boys do together every day?",["Play video games","Walk to school","Cook dinner"],1]]},{"id":"s4","lv":0,"t":"The Rainy Day","ta":"يوم ممطر","ps":[["It is raining today. Lina cannot go to the park. She looks out of the window and feels bored.","السماء تمطر اليوم. لا تستطيع لينا الذهاب إلى الحديقة. تنظر من النافذة وتشعر بالملل."],["Her father says, \"Let us make a pizza!\" Lina smiles. She washes her hands and helps him with the dough.","يقول أبوها: «لنصنع بيتزا!» تبتسم لينا. تغسل يديها وتساعده في العجين."],["They add cheese, tomatoes, and olives. Then they put the pizza in the oven. The kitchen smells wonderful.","يضيفان الجبن والطماطم والزيتون. ثم يضعان البيتزا في الفرن. تفوح من المطبخ رائحة رائعة."],["After twenty minutes, the pizza is ready. They eat it together and listen to the rain. Lina says, \"This is the best rainy day ever!\"","بعد عشرين دقيقة تصبح البيتزا جاهزة. يأكلانها معًا ويستمعان إلى المطر. تقول لينا: «هذا أفضل يوم ممطر على الإطلاق!»"]],"gl":{"rain":"مطر / تمطر","bored":"ملول","dough":"عجين","cheese":"جبن","tomato":"طماطم","olive":"زيتون","oven":"فرن","kitchen":"مطبخ","smell":"رائحة / يشم","ready":"جاهز","wonderful":"رائع","help":"يساعد","wash":"يغسل"},"q":[["Why can't Lina go to the park?",["It is raining","She is sick","The park is closed"],0],["What do Lina and her father make?",["A cake","A pizza","A salad"],1],["How long does the pizza take?",["Ten minutes","Twenty minutes","One hour"],1]]},{"id":"s5","lv":1,"t":"The Job Interview","ta":"مقابلة العمل","ps":[["Omar had been looking for a job for three months. When he finally received an invitation for an interview at a big engineering company, he could hardly sleep the night before.","كان عمر يبحث عن عمل منذ ثلاثة أشهر. وعندما تلقّى أخيرًا دعوة لمقابلة في شركة هندسة كبيرة، بالكاد استطاع النوم في الليلة السابقة."],["He arrived early and waited nervously in the lobby. A tall woman called his name and led him into a quiet office. \"Tell me about yourself,\" she said, and Omar felt his heart beating faster.","وصل مبكرًا وانتظر بتوتر في الردهة. نادت امرأة طويلة اسمه وقادته إلى مكتب هادئ. قالت: «حدّثني عن نفسك»، وشعر عمر بقلبه يخفق أسرع."],["He took a deep breath and explained his experience, his skills, and why he wanted to work there. To his surprise, the questions that followed were not as difficult as he had expected.","أخذ نفسًا عميقًا وشرح خبرته ومهاراته ولماذا يريد العمل هناك. ولمفاجأته، لم تكن الأسئلة التي تلت ذلك صعبة كما توقّع."],["A week later, the company called him. \"We would like to offer you the position,\" the manager said. Omar thanked her several times and hung up with a huge smile. All his patience had been worth it.","بعد أسبوع اتصلت به الشركة. قالت المديرة: «نود أن نعرض عليك الوظيفة». شكرها عمر عدة مرات وأنهى المكالمة بابتسامة كبيرة. لقد كان كل صبره يستحق العناء."]],"gl":{"interview":"مقابلة","engineering":"هندسة","invitation":"دعوة","nervously":"بتوتر","lobby":"ردهة","experience":"خبرة","skill":"مهارة","surprise":"مفاجأة","expect":"يتوقع","offer":"يعرض","position":"وظيفة / منصب","patience":"صبر","manager":"مدير","difficult":"صعب"},"q":[["How long had Omar been looking for a job?",["Three weeks","Three months","A year"],1],["How did Omar feel when he arrived?",["Nervous","Bored","Angry"],0],["What happened a week later?",["He lost his job","The company offered him the position","He cancelled the interview"],1]]},{"id":"s6","lv":1,"t":"The Lighthouse Keeper","ta":"حارس المنارة","ps":[["Far from the coast, on a small rocky island, a lighthouse stood against the wind and waves. Its keeper, an old man named Karim, had lived there for thirty years.","بعيدًا عن الساحل، على جزيرة صخرية صغيرة، كانت منارة تقف في وجه الرياح والأمواج. وكان حارسها، رجل عجوز اسمه كريم، يعيش هناك منذ ثلاثين عامًا."],["Every evening he climbed the narrow stairs to light the great lamp. Ships passing in the dark depended on that light to avoid the dangerous rocks, and Karim never forgot it.","كل مساء كان يصعد الدرج الضيق ليشعل المصباح الكبير. وكانت السفن العابرة في الظلام تعتمد على ذلك الضوء لتتجنب الصخور الخطيرة، ولم ينسَ كريم ذلك أبدًا."],["One stormy night, the electricity failed. Karim did not panic. He remembered the old oil lamp stored in the cupboard, lit it carefully, and placed it behind the glass.","في ليلة عاصفة انقطعت الكهرباء. لم يذعر كريم. تذكّر مصباح الزيت القديم المخزّن في الخزانة، فأشعله بحذر ووضعه خلف الزجاج."],["At dawn, a captain sailed to the island to thank him. \"Without your light, we would have crashed,\" he said. Karim only smiled and replied, \"That is simply my job.\"","عند الفجر أبحر قبطان إلى الجزيرة ليشكره. قال: «لولا ضوؤك لتحطمنا». ابتسم كريم فقط وأجاب: «هذه ببساطة وظيفتي.»"]],"gl":{"coast":"ساحل","rocky":"صخري","lighthouse":"منارة","keeper":"حارس","wave":"موجة","narrow":"ضيق","depend":"يعتمد","avoid":"يتجنب","dangerous":"خطير","stormy":"عاصف","electricity":"الكهرباء","fail":"يفشل / ينقطع","panic":"يذعر","cupboard":"خزانة","dawn":"فجر","captain":"قبطان","crash":"يتحطم"},"q":[["How long had Karim lived on the island?",["Ten years","Thirty years","Fifty years"],1],["What did Karim use when the electricity failed?",["A candle","A flashlight","An old oil lamp"],2],["What did the captain do at dawn?",["He thanked Karim","He asked for money","He took the lamp"],0]]},{"id":"s7","lv":1,"t":"A Gift for Grandma","ta":"هدية لجدتي","ps":[["Grandma's birthday was coming, and Noor wanted to give her something special. She had saved a little money, but nothing in the shops seemed right.","كان عيد ميلاد الجدة يقترب، وأرادت نور أن تعطيها شيئًا مميزًا. كانت قد وفّرت قليلًا من المال، لكن لا شيء في المحلات بدا مناسبًا."],["Then she remembered the old photographs in the family album. She spent the weekend choosing her favorite ones and carefully writing a short memory under each picture.","ثم تذكّرت الصور القديمة في ألبوم العائلة. قضت عطلة نهاية الأسبوع في اختيار صورها المفضلة وكتابة ذكرى قصيرة بعناية تحت كل صورة."],["On the day of the party, Noor handed the album to her grandmother. Grandma opened it slowly, and her eyes filled with tears. \"I have never received a more precious gift,\" she whispered.","في يوم الحفلة سلّمت نور الألبوم لجدتها. فتحته الجدة ببطء وامتلأت عيناها بالدموع. همست: «لم أتلقَّ هدية أثمن من هذه قط.»"],["From that day on, Noor understood that the best presents are not always the most expensive ones. They are the ones made with love and time.","منذ ذلك اليوم فهمت نور أن أفضل الهدايا ليست دائمًا الأغلى ثمنًا، بل تلك المصنوعة بالحب والوقت."]],"gl":{"special":"مميز","save":"يوفّر / يدّخر","remember":"يتذكر","photograph":"صورة فوتوغرافية","album":"ألبوم","favorite":"مفضل","memory":"ذكرى","hand":"يسلّم","tear":"دمعة","precious":"ثمين","whisper":"يهمس","expensive":"غالي","present":"هدية","weekend":"عطلة نهاية الأسبوع"},"q":[["What did Noor give her grandmother?",["A necklace","A photo album with memories","A book"],1],["How did Grandma feel?",["Disappointed","Deeply touched","Angry"],1],["What did Noor learn?",["Expensive gifts are always best","Gifts made with love and time are best","Shopping is hard"],1]]},{"id":"s8","lv":1,"t":"The Missed Train","ta":"القطار الذي فاتني","ps":[["Hassan woke up late on the morning of his exam. He dressed quickly, grabbed his bag, and ran toward the station without eating breakfast.","استيقظ حسان متأخرًا في صباح يوم امتحانه. ارتدى ملابسه بسرعة وأمسك حقيبته وركض نحو المحطة دون أن يتناول الفطور."],["When he arrived, the train was already leaving. He watched it disappear down the track and felt his stomach drop. The next train would not come for an hour, and the exam started in forty minutes.","عندما وصل كان القطار قد غادر بالفعل. شاهده يختفي على السكة وشعر بقلبه يهبط. القطار التالي لن يأتي قبل ساعة، والامتحان يبدأ بعد أربعين دقيقة."],["He looked around desperately and noticed a man loading boxes into a van. Hassan explained his problem, and the kind driver agreed to give him a lift.","نظر حوله بيأس ولاحظ رجلًا يحمّل صناديق في شاحنة صغيرة. شرح حسان مشكلته، ووافق السائق الطيب على إيصاله."],["Hassan reached the university with five minutes to spare. He sat down, caught his breath, and smiled. \"Next time,\" he promised himself, \"I will set two alarms.\"","وصل حسان إلى الجامعة قبل الامتحان بخمس دقائق. جلس والتقط أنفاسه وابتسم. وعد نفسه: «في المرة القادمة سأضبط منبّهين.»"]],"gl":{"exam":"امتحان","dress":"يرتدي","grab":"يمسك","station":"محطة","disappear":"يختفي","track":"سكة / مسار","stomach":"معدة","desperately":"بيأس","load":"يحمّل","van":"شاحنة صغيرة","lift":"توصيلة","alarm":"منبّه","breath":"نفس","promise":"يعد"},"q":[["Why was Hassan in a hurry?",["He had an exam","He was going shopping","He was late for dinner"],0],["How did he get to the university?",["By taxi","A driver gave him a lift","He walked"],1],["What does Hassan promise himself?",["To set two alarms next time","To skip exams","To buy a car"],0]]},{"id":"s9","lv":2,"t":"The Silent Village","ta":"القرية الصامتة","ps":[["High in the mountains, there was a village where nobody raised their voice. Visitors often wondered why the streets were so calm, and the villagers would only smile mysteriously.","في أعالي الجبال كانت هناك قرية لا يرفع فيها أحد صوته. كان الزوار يتساءلون كثيرًا لماذا الشوارع هادئة إلى هذا الحد، ولم يكن الأهالي يردّون إلا بابتسامة غامضة."],["The secret, it turned out, was an old tradition. Whenever two people argued, they were required to sit together under the large oak tree in the square and remain silent for an hour before saying another word.","تبيّن أن السر هو تقليد قديم. كلما تجادل شخصان كان عليهما أن يجلسا معًا تحت شجرة البلوط الكبيرة في الساحة ويبقيا صامتين ساعة كاملة قبل أن ينطقا بكلمة أخرى."],["Most disputes dissolved long before the hour ended. Resentment, the elders explained, cannot survive in silence; it needs an audience of angry words to keep it alive.","كانت معظم الخلافات تذوب قبل انتهاء الساعة بوقت طويل. وشرح كبار السن أن الضغينة لا تعيش في الصمت، فهي تحتاج إلى جمهور من الكلمات الغاضبة لتبقى حيّة."],["A young journalist who came to write about the village admitted that she had been skeptical. After a heated disagreement with her editor over the phone, however, she found herself sitting beneath the oak tree. By the time she stood up, she had already forgotten what the argument was about.","اعترفت صحفية شابة جاءت لتكتب عن القرية بأنها كانت متشككة. لكن بعد خلاف محتدم مع محررها عبر الهاتف وجدت نفسها جالسة تحت شجرة البلوط. وحين وقفت كانت قد نسيت موضوع الجدال أصلًا."]],"gl":{"raise":"يرفع","mysteriously":"بغموض","tradition":"تقليد","argue":"يتجادل","require":"يُلزم","oak":"بلوط","square":"ساحة","dispute":"نزاع","dissolve":"يذوب","resentment":"ضغينة","elder":"كبير السن","audience":"جمهور","journalist":"صحفي","skeptical":"متشكك","heated":"محتدم","editor":"محرر","silent":"صامت","village":"قرية"},"q":[["What was the villagers' tradition?",["Singing at night","Sitting silently after an argument","Avoiding visitors"],1],["According to the elders, what cannot survive in silence?",["Friendship","Resentment","Tradition"],1],["How did the journalist change her mind?",["She tried it herself after an argument","She interviewed the elders","She left the village"],0]]},{"id":"s10","lv":2,"t":"The Last Letter","ta":"الرسالة الأخيرة","ps":[["While cleaning the attic, Layla found a dusty wooden box she had never seen before. Inside lay a bundle of letters tied with a faded blue ribbon, all addressed to her grandfather.","أثناء تنظيف العلّية وجدت ليلى صندوقًا خشبيًا مغبرًّا لم تره من قبل. بداخله رزمة رسائل مربوطة بشريط أزرق باهت، وكلها موجّهة إلى جدها."],["She hesitated. Reading someone else's private correspondence felt intrusive, yet curiosity eventually won. The first letter, written in elegant handwriting, described a young woman's longing for a soldier who had gone abroad.","ترددت. بدت قراءة مراسلات شخص آخر الخاصة تطفلًا، لكن الفضول انتصر في النهاية. وصفت الرسالة الأولى، المكتوبة بخط أنيق، شوق شابة إلى جندي سافر إلى الخارج."],["As she read on, Layla realized that the soldier was her grandfather, and the writer was the grandmother she had never met. Their love story unfolded across decades, through war, separation, and unexpected reunion.","وبينما تواصل القراءة أدركت ليلى أن الجندي هو جدها، وأن الكاتبة هي الجدة التي لم تقابلها قط. تكشّفت قصة حبهما عبر عقود، مرورًا بالحرب والفراق ولمّ شمل غير متوقع."],["The final letter was dated the day before her grandmother passed away. \"Do not mourn me for long,\" it said. \"Keep the box, and remember that we were happy.\" Layla pressed it to her chest and cried — not from sadness alone, but from gratitude.","كانت الرسالة الأخيرة مؤرخة في اليوم السابق لوفاة جدتها. جاء فيها: «لا تحزنوا عليّ طويلًا. احتفظوا بالصندوق وتذكّروا أننا كنا سعداء.» ضمّتها ليلى إلى صدرها وبكت، لا من الحزن وحده بل من الامتنان أيضًا."]],"gl":{"attic":"علّية","dusty":"مغبرّ","bundle":"رزمة","faded":"باهت","ribbon":"شريط","address":"يوجّه إلى","hesitate":"يتردد","correspondence":"مراسلات","intrusive":"تطفّلي","curiosity":"فضول","longing":"شوق","abroad":"في الخارج","unfold":"يتكشّف","decade":"عقد","separation":"فراق","reunion":"لمّ الشمل","mourn":"يحزن على / يرثي","gratitude":"امتنان","soldier":"جندي"},"q":[["Where did Layla find the box?",["In the attic","In a shop","In the garden"],0],["Who wrote the letters?",["Her mother","Her grandmother","A friend"],1],["How did Layla feel at the end?",["Only angry","Sad but also grateful","Bored"],1]]},{"id":"s11","lv":2,"t":"The Inventor's Dilemma","ta":"معضلة المخترع","ps":[["After ten years of research, Daniel finally built a machine that could purify seawater using almost no energy. Scientists praised the design, and several corporations immediately offered him large sums of money for the patent.","بعد عشر سنوات من البحث، بنى دانيال أخيرًا آلة تستطيع تنقية مياه البحر باستخدام طاقة تكاد لا تُذكر. أشاد العلماء بالتصميم، وعرضت عليه عدة شركات كبرى فورًا مبالغ ضخمة مقابل براءة الاختراع."],["Yet the more he considered the offers, the more uneasy he became. A company would almost certainly sell the technology at a high price, which meant the villages that needed it most قل رامي إلى الخارج للعمل كان واثقًا بأن إنجليزيته جيدة بما يكفي. فهو في النهاية اجتاز كل الامتحانات بدرجات ممتازة."],["On his first day, however, his colleagues spoke so quickly and used so many idioms that he barely understood half of what they said. When someone told him to \"break a leg\" before a presentation, he nearly panicked.","لكن في يومه الأول كان زملاؤه يتكلمون بسرعة كبيرة ويستخدمون تعابير اصطلاحية كثيرة حتى إنه بالكاد فهم نصف ما قالوه. وعندما قال له أحدهم «break a leg» قبل عرض تقديمي كاد يذعر."],["Instead of hiding his confusion, Rami began writing down every expression he did not know. In the evenings, he looked them up, practiced them aloud, and tried to use at least two new ones each day.","بدلًا من إخفاء ارتباكه بدأ رامي يدوّن كل تعبير لا يعرفه. وفي المساء كان يبحث عنها ويتمرن عليها بصوت عالٍ ويحاول استخدام تعبيرين جديدين على الأقل كل يوم."],["Months later, he was joking with his team over lunch, and no one noticed that English was his second language. Rami realized that fluency is not a gift. It is the result of staying curious, making mistakes, and refusing to give up.","بعد أشهر كان يمزح مع فريقه على الغداء ولم يلاحظ أحد أن الإنجليزية لغته الثانية. أدرك رامي أن الطلاقة ليست موهبة، بل هي ثمرة البقاء فضوليًا وارتكاب الأخطاء ورفض الاستسلام."]],"gl":{"abroad":"في الخارج","confident":"واثق","grade":"درجة","colleague":"زميل","idiom":"تعبير اصطلاحي","barely":"بالكاد","presentation":"عرض تقديمي","panic":"يذعر","confusion":"ارتباك","expression":"تعبير","aloud":"بصوت عالٍ","fluency":"الطلاقة","curious":"فضولي","mistake":"خطأ","practice":"يتمرن","language":"لغة"},"q":[["Why did Rami struggle at first?",["His grades were low","Colleagues spoke fast and used idioms","He did not speak English"],1],["What did Rami start doing?",["Writing down expressions he did not know","Avoiding meetings","Speaking only Arabic"],0],["What does Rami learn about fluency?",["It is a gift","It comes from curiosity, mistakes and not giving up","It needs expensive courses"],1]]}];

function nz(w){
  w=String(w||'').toLowerCase().replace(/[^a-z]/g,'');
  if(w.length>4&&/ing$/.test(w))w=w.slice(0,-3);
  else if(w.length>4&&/ied$/.test(w))w=w.slice(0,-3)+'y';
  else if(w.length>3&&/ed$/.test(w))w=w.slice(0,-2);
  else if(w.length>3&&/es$/.test(w))w=w.slice(0,-2);
  else if(w.length>3&&/s$/.test(w)&&!/ss$/.test(w))w=w.slice(0,-1);
  if(w.length>3&&/e$/.test(w))w=w.slice(0,-1);
  if(w.length>3&&/(.)\1$/.test(w))w=w.slice(0,-1);
  return w;
}
function stById(id){return allStories().filter(function(x){return x.id===id})[0]}

  return a<1.5?0:(a<3?1:2);
}
function stTokens(S){

(function(){
  var list=$('#list'),sx=0,sy=0,li=null,mode=0,dx=0,hint=null,swAt=0,THR=100;
  function mk(){
    hint=document.createElement('div');hint.className='vhint';hint.style.top=li.offsetTop+'px';hint.style.height=li.offsetHeight+'px';
    hint.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v4H3z"/><path d="M5 10v9h14v-9M10 14h4"/></svg><span>إلى المستودع</span>';
    list.appendChild(hint);THR=Math.min(120,li.offsetWidth*.32);
  }
  function clean(){if(hint&&hint.parentNode)hint.parentNode.removeChild(hint);hint=null}
  list.addEventListener('touchstart',function(e){
    if(e.touches.length!==1){li=null;return}
    var t=e.touches[0];li=e.target.closest('.item');
    if(!li||li.classList.contains('open')){li=null;return}
    sx=t.clientX;sy=t.clientY;mode=0;dx=0;
  },{passive:true});
  list.addEventListener('touchmove',function(e){
    if(!li)return;
    var t=e.touches[0],ddx=t.clientX-sx,ddy=t.clientY-sy;
    if(!mode){
      if(Math.abs(ddy)>10&&Math.abs(ddy)>Math.abs(ddx)){li=null;return}
      if(ddx>14&&ddx>Math.abs(ddy)*1.3){mode=1;li.style.transition='none';mk()}else return;
    }
    dx=Math.max(0,ddx);li.style.transform='translateX('+dx+'px)';
    if(hint)hint.classList.toggle('go',dx>=THR);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  function end(){
    if(!li||mode!==1){li=null;return}
    var el=li,id=el.dataset.id;li=null;swAt=Date.now();
    if(dx>=THR){
      el.style.transition='transform .22s ease,opacity .22s ease';el.style.transform='translateX(110%)';el.style.opacity='0';
      setTimeout(function(){clean();vaultAdd(id);render();toast('انتقلت الكلمة إلى مستودع الكلمات');chime('good')},210);
    }else{
      el.style.transition='transform .25s cubic-bezier(.2,.9,.3,1)';el.style.transform='';
      setTimeout(function(){el.style.transition='';clean()},260);
    }
  }
  list.addEventListener('touchend',end);list.addEventListener('touchcancel',end);
  list.addEventListener('click',function(e){if(Date.now()-swAt<450){e.stopPropagation();e.preventDefault()}},true);
})();

var QTAG={mc:'اختيار من متعدد',tf:'صح أم خطأ',type:'اكتب الإجابة',order:'رتّب الجملة'};
function qn2(x){return String(x).trim().toLowerCase().replace(/[^a-z0-9']/g,'')}
function stOk(q,a){
  if(a===undefined||a===null)return false;
  var k=q[3]||'mc';
  if(k==='type')return qn2(a)===qn2(q[2]);
  if(k==='order')return String(a).trim()===String(q[2]).trim();
  return a===q[2];
}
function stQHTML(S,q,qi,A){
  var pk=A[qi],k=q[3]||'mc',done=pk!==undefined,body='';
  var head='<div class="stqt" dir="ltr" data-nt>'+(qi+1)+'. '+esc(q[0])+'</div><div><span class="qk">'+QTAG[k]+'</span></div>';
  if(k==='type'){
    if(done){var ok=stOk(q,pk);body='<div class="stans '+(ok?'ok':'bad')+'">'+esc(pk)+(ok?'':'<small>الإجابة الصحيحة: '+esc(q[2])+'</small>')+'</div>'}
    else body='<div class="styp"><input id="stI'+qi+'" class="ne-in" type="text" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="..."><button type="button" class="sbtn" data-act="stty" data-q="'+qi+'">تحقق</button></div>';
  }else if(k==='order'){
    if(done){var ok2=stOk(q,pk);body='<div class="stans '+(ok2?'ok':'bad')+'">'+esc(pk)+(ok2?'':'<small>الترتيب الصحيح: '+esc(q[2])+'</small>')+'</div>'}
    else{
      var pd=ST.ord[S.id+':'+qi]||[];
      var chosen=pd.map(function(ti,pi){return '<button type="button" class="tk" data-act="stou" data-q="'+qi+'" data-p="'+pi+'">'+esc(q[1][ti])+'</button>'}).join('');
      var rest=q[1].map(function(w,ti){return pd.indexOf(ti)>-1?'':'<button type="button" class="tk" data-act="stor" data-q="'+qi+'" data-t="'+ti+'">'+esc(w)+'</button>'}).join('');
      body='<div class="ordp pk">'+(chosen||'<span class="ph">اضغط الكلمات بالترتيب الصحيح</span>')+'</div><div class="ordp">'+rest+'</div>';
    }
  }else{
    body='<div class="opts"'+(k==='tf'?' style="grid-template-columns:1fr 1fr"':'')+'>'+q[1].map(function(o,oi){
      if(k==='tf'&&LANG==='en')o=oi===0?'True':'False';
      var c='opt';if(done){if(oi===q[2])c+=' right';else if(oi===pk)c+=' wrong'}
      return '<button type="button" class="'+c+'" dir="auto" data-act="stq" data-q="'+qi+'" data-o="'+oi+'"'+(done?' disabled':'')+'>'+esc(o)+'</button>';
    }).join('')+'</div>';
  }
  return '<div class="stq">'+head+body+'</div>';
}
function stRng(seed){
  var h=1779033703^seed.length;
  for(var i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  var a=h>>>0;
  return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}
function stShuf(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function stEnsureQ(S){
  if(!S||!S.q)return false;
  if(S.q0===undefined)S.q0=S.q.length;
  if(S.q.length>=10||S.qx)return false;
  var r=stRng(String(S.id)),paras=S.ps.map(function(p){return p[0]}),gl=S.gl||{},keys=Object.keys(gl),words=stPickWords(paras);
  var sents=[];paras.forEach(function(p){(p.match(/[^.!?]+[.!?]+/g)||[]).forEach(function(x){x=x.trim();if(x.split(/\s+/).length>=5&&x.split(/\s+/).length<=28)sents.push(x)})});
  var seenQ={},usedS={},usedK={};S.q.forEach(function(q){seenQ[q[0]]=1});
  function bestWord(sn){var tw=null;(sn.match(/[A-Za-z]+/g)||[]).forEach(function(w){var lw=w.toLowerCase();if(lw.length>=5&&!STOP[lw]&&words.indexOf(lw)>-1&&(!tw||lw.length>tw.length))tw=lw});return tw}
  function blankOf(sn,tw){var b=sn.replace(new RegExp('\\b'+tw+'\\b','i'),'_____');return b===sn?null:b}
  function extraAr(){var o=[];Object.keys(stdict||{}).forEach(function(k){if(stdict[k])o.push(stdict[k])});items.forEach(function(i){if(i.ar&&i.ar.length<24)o.push(i.ar)});return o}
  var gens={
    type:function(){
      var c=stShuf(sents,r);
      for(var i=0;i<c.length;i++){var sn=c[i];if(usedS[sn])continue;var tw=bestWord(sn);if(!tw)continue;var b=blankOf(sn,tw);if(!b)continue;usedS[sn]=1;return ['Type the missing word: '+b,[],tw,'type']}
      return null;
    },
    fill:function(){
      var c=stShuf(sents,r);
      for(var i=0;i<c.length;i++){
        var sn=c[i];if(usedS[sn])continue;var tw=bestWord(sn);if(!tw)continue;var b=blankOf(sn,tw);if(!b)continue;
        var oth=stShuf(words.filter(function(w){return w!==tw&&nz(w)!==nz(tw)}),r).slice(0,3);if(oth.length<3)continue;
        usedS[sn]=1;var opts=stShuf([tw].concat(oth),r);return ['Fill in the blank: '+b,opts,opts.indexOf(tw)];
      }
      return null;
    },
    order:function(){
      var c=stShuf(sents,r);
      for(var i=0;i<c.length;i++){
        var sn=c[i].replace(/\s+/g,' ');if(usedS[sn])continue;var tk=sn.split(' ');if(tk.length<5||tk.length>10)continue;
        var sc=tk.slice(),n=0;while(n<8){sc=stShuf(tk,r);if(sc.join(' ')!==tk.join(' '))break;n++}
        if(sc.join(' ')===tk.join(' '))continue;
        usedS[sn]=1;return ['Put the words in the correct order:',sc,tk.join(' '),'order'];
      }
      return null;
    },
    meaning:function(){
      var c=stShuf(keys,r);
      for(var i=0;i<c.length;i++){
        var k=c[i];if(usedK['m'+k])continue;
        var oth=stShuf(keys.filter(function(x){return x!==k&&gl[x]!==gl[k]}).map(function(x){return gl[x]}),r);
        if(oth.length<3)oth=oth.concat(stShuf(extraAr().filter(function(a){return a!==gl[k]&&oth.indexOf(a)<0}),r));
        oth=oth.filter(function(a,j,arr){return arr.indexOf(a)===j}).slice(0,3);if(oth.length<3)continue;
        usedK['m'+k]=1;var opts=stShuf([gl[k]].concat(oth),r);return ['What does “'+k+'” mean?',opts,opts.indexOf(gl[k])];
      }
      return null;
    },
    reverse:function(){
      var c=stShuf(keys,r);
      for(var i=0;i<c.length;i++){
        var k=c[i];if(usedK['m'+k]||usedK['r'+k])continue;
        var oth=stShuf(keys.filter(function(x){return x!==k&&gl[x]!==gl[k]}),r).slice(0,3);if(oth.length<3)continue;
        usedK['r'+k]=1;var opts=stShuf([k].concat(oth),r);return ['Which word means “'+gl[k]+'”?',opts,opts.indexOf(k)];
      }
      return null;
    },
    tf:function(){
      var c=stShuf(keys,r);
      for(var i=0;i<c.length;i++){
        var k=c[i];if(usedK['t'+k])continue;
        var truth=r()<.5,m=gl[k];
        if(!truth){var o=keys.filter(function(x){return x!==k&&gl[x]!==gl[k]});if(!o.length)continue;m=gl[o[Math.floor(r()*o.length)]]}
        usedK['t'+k]=1;return ['True or false: “'+k+'” means “'+m+'”.',['صح','خطأ'],truth?0:1,'tf'];
      }
      return null;
    }
  };
  var seq=['type','tf','order','meaning','type','tf','order','reverse','fill','meaning','tf','fill','reverse','type','order'],i=0,tries=0;
  while(S.q.length<10&&tries<45){
    var q=gens[seq[i%seq.length]]();i++;tries++;
    if(q&&!seenQ[q[0]]){seenQ[q[0]]=1;S.q.push(q)}
  }
  S.qx=1;return true;
}

ld her stories about his years as a travelling musician. Maya laughed in spite of her worries. Then, around three o'clock, a fierce storm struck, and the train came to a sudden halt. The conductor announced that fallen trees were blocking the track."]},{"h":"Morning","p":["They waited for nearly four hours. Maya felt desperate, but the old man stayed calm. 'Worrying will not move the trees,' he told her. 'Tell me about your grandmother instead.' So she did, and the memories made her feel stronger.","At dawn the track was cleared, and the train arrived at last. Maya hurried to the hospital and found her grandmother awake and smiling. 'The doctors say I will recover,' the old woman whispered. Later Maya realised she had never asked the stranger his name, but she kept his kindness in her heart for ever."]}],"gl":{"hospital":"مستشفى","platform":"رصيف","uncomfortable":"غير مريح","option":"خيار","carriage":"عربة قطار","deserted":"مهجور","battered":"مهترئ","anxious":"قلِق","expression":"تعبير الوجه","gently":"بلطف","musician":"موسيقي","worries":"مخاوف","fierce":"عنيف","conductor":"مراقب القطار","blocking":"يسدّ","desperate":"يائس","memories":"ذكريات","recover":"يتعافى","realised":"أدركت","kindness":"لطف"}},{"id":"t4","lv":"B2","t":"The Keeper's Letters","au":"Enotes Reader","d":"رسائل غير مرسلة في كوخ قديم تفتح بابًا لمصالحة مؤجلة.","ch":[{"h":"An Unwelcome Inheritance","p":["When Daniel learned that his estranged uncle had left him a cottage on the northern coast, his first reaction was irritation rather than gratitude. The two men had not spoken for twenty years, ever since a bitter quarrel over money had split the family in two.","Nevertheless, curiosity eventually overcame his reluctance. He drove north through weeks of relentless drizzle and found the cottage perched on a weathered cliff, its windows clouded with salt and its garden swallowed by weeds."]},{"h":"What the Drawer Held","p":["Inside, everything was meticulously tidy. A single drawer in the kitchen table, however, was jammed with envelopes, each one addressed in careful handwriting to Daniel's father. None of them had ever been posted.","Daniel read the first with trembling hands. His uncle had apologised for his temper, admitted his own stubbornness, and begged for a chance to mend what had been broken. The later letters grew shorter and sadder, as though he had slowly accepted that no reply would ever come."]},{"h":"Delivering the Past","p":["Daniel hesitated for days. His father was proud and unforgiving, and he feared that the letters would only reopen old wounds. Yet leaving them hidden in a drawer seemed like a second betrayal of a man who could no longer defend himself.","In the end he drove home and placed the bundle on the table in front of his father without a word. The old man read in silence for a long time. When he finally looked up, his eyes were wet. 'I wasted so many years,' he murmured. 'Take me to the coast. I would like to see his house.'"]}],"gl":{"estranged":"منفصل / متباعد","irritation":"انزعاج","gratitude":"امتنان","bitter":"مرير","quarrel":"شجار","curiosity":"فضول","reluctance":"تردد","relentless":"لا يتوقف","weathered":"متآكل بفعل الطقس","meticulously":"بدقة متناهية","jammed":"مكتظ","apologised":"اعتذر","stubbornness":"عناد","mend":"يُصلح","hesitated":"تردد","unforgiving":"لا يغفر","betrayal":"خيانة","murmured":"تمتم","wounds":"جراح","bundle":"رزمة"}},{"id":"t5","lv":"C1","t":"The Cartographer's Dilemma","au":"Enotes Reader","d":"خريطة قديمة تحمل سرًا يضع صانعة الخرائط أمام معضلة أخلاقية.","ch":[{"h":"The Discrepancy","p":["Elena had spent three decades earning a reputation as the most scrupulous cartographer in the country, so the discrepancy troubled her deeply. On the eighteenth-century chart spread across her desk, a small island lay off the southern coast. Every modern survey insisted that nothing existed there but open water.","She consulted the archives, expecting to find a simple clerical error. Instead she discovered that the island appeared on dozens of maps, always in precisely the same position, always with the same improbable name. Such consistency was not an accident; it was a signature."]},{"h":"A Deliberate Fiction","p":["After weeks of painstaking research, the truth emerged. The founding members of the old mapmaking guild had invented the island on purpose. By planting a single fabricated detail in each of their maps, they could prove that a rival had copied their work, since no honest surveyor would ever record a place that did not exist.","Elena felt a curious mixture of admiration and unease. The trick was ingenious, yet it rested on deception, and the guild's own descendants still revered those founders as paragons of integrity."]},{"h":"The Cost of Honesty","p":["The decision before her was formidable. Publishing her findings would vindicate her scholarship and delight the academic world, but it would also tarnish an institution that had shaped her entire career. Staying silent, on the other hand, would mean relinquishing the very principle that had guided her work.","Late one evening she drew a new map and, in the lower corner, added a tiny note that read: 'Here lies an island that never was.' It was neither a confession nor a cover-up. It was, she decided, the most honest ambiguity she could offer."]}],"gl":{"decades":"عقود","scrupulous":"دقيق الضمير","cartographer":"راسم خرائط","discrepancy":"تناقض","survey":"مسح","archives":"أرشيف","clerical":"كتابي / إداري","improbable":"غير مرجّح","consistency":"اتساق","painstaking":"شاق ودقيق","fabricated":"ملفّق","rival":"منافس","admiration":"إعجاب","unease":"قلق","ingenious":"عبقري","deception":"خداع","revered":"يُوقَّر","paragons":"قدوة مثالية","integrity":"نزاهة","formidable":"هائل","vindicate":"يبرّئ","tarnish":"يُشوّه","relinquishing":"التخلي عن","ambiguity":"غموض"}}];

var BK_APPB=[{"id":"a1","cat":"rom","t":"The Clockmaker's Daughter","au":"Enotes Library","d":"رواية قصيرة عن ساعة قديمة تخبّئ سرًّا في بلدة صغيرة.","ch":[{"h":"Chapter 1: The Silent Shop","p":["The town of Marlow was quiet, and no place was quieter than the clock shop on Bell Street. For forty years Mr. Hale had repaired every clock in town. Now he was gone, and his daughter, Ana, stood alone among hundreds of silent faces.","She had come back only to sell the shop. But on the first night she heard a sound she had not expected: one clock, hidden somewhere in the dark, was still ticking."]},{"h":"Chapter 2: The Hidden Clock","p":["Ana followed the sound to the back wall. Behind a shelf of broken watches she found a small wooden door. Inside was an old silver clock, and its hands were pointing to a time that made no sense: twenty minutes past thirteen.","On the back of the clock, someone had scratched three words: 'Open me, Ana.' Her hands began to shake. It was her father's handwriting."]},{"h":"Chapter 3: Inside","p":["With a thin screwdriver she opened the back. There was no machine inside, only a folded letter and a small brass key. 'If you are reading this,' the letter said, 'then you came home. The key opens the drawer where I kept my best work. Please do not sell the shop until you have seen it.'","Ana looked around the room, at all the quiet clocks. For the first time in years, she smiled. Perhaps she was not ready to leave Marlow after all."]}]},{"id":"a2","cat":"rom","t":"Letters from the Harbour","au":"Enotes Library","d":"مراسلات بين بحّار وفتاة تغيّر مسار حياتهما.","ch":[{"h":"Chapter 1: The First Letter","p":["Nora found the bottle on the beach early one grey morning. Inside was a note written in careful blue ink: 'To whoever finds this, I am a sailor on the ship Marigold. The sea is wide and I am lonely. Write to me if you like.'","She laughed at first. Then she sat down on the cold sand and wrote back, though she did not know where to send the reply."]},{"h":"Chapter 2: Answers from the Sea","p":["Months passed. Then, one rainy afternoon, a thin envelope arrived at the harbour office with her name on it. The sailor, whose name was Leo, had found her address from the old fisherman who knew every family in the village.","They wrote for a whole year. He described storms and strange fish; she described the bakery, the market, and the old cat that slept on her window. Each letter made the distance feel smaller."]},{"h":"Chapter 3: The Marigold Returns","p":["In spring the Marigold came into the harbour at last. Nora stood on the pier with her heart beating fast. A tall man stepped off the ship holding a small blue bottle.","'I believe this belongs to you,' he said, smiling. Nora took it, and found that she could not say a single word. She did not need to. They walked slowly home together, talking all the way."]}]},{"id":"a3","cat":"short","t":"The Garden Gate","au":"Enotes Library","d":"قصة قصيرة عن بوابة قديمة وجارٍ لطيف.","ch":[{"h":"Part 1","p":["Mia moved into the small house at the end of the lane in September. The garden was full of weeds, and the old green gate would not close properly. Every morning it made a loud, sad noise in the wind.","'I will fix it this weekend,' she told herself. But the weekend came and went, and the gate kept singing."]},{"h":"Part 2","p":["On Monday, Mia found a small tin of oil hanging on the gate with a note: 'This helps. — Mr. Brown, next door.' She smiled, oiled the hinges, and the gate became silent at once.","That evening she took a jar of homemade jam to Mr. Brown's door. He was surprised, then very pleased. They talked for an hour about tomatoes, rain, and the best way to grow roses."]}]},{"id":"a4","cat":"short","t":"A Cup of Tea","au":"Enotes Library","d":"لحظة هادئة على طاولة مطبخ تغيّر مزاج يوم كامل.","ch":[{"h":"Part 1","p":["It had been a long and difficult day. Sam came home tired, with a headache and a pile of unfinished work in his bag. He dropped his keys on the table and sat down without taking off his coat.","His grandmother, who was visiting, said nothing. She simply put the kettle on and took out two cups."]},{"h":"Part 2","p":["The tea was hot and sweet. For a few minutes nobody spoke. Outside, the rain tapped gently on the window, and the kitchen smelled of lemon and warm bread.","'Better?' she asked at last. Sam nodded. The work in his bag could wait until morning. Some days, he realised, a cup of tea and a quiet chair are all a person really needs."]}]},{"id":"a5","cat":"short","t":"The Lantern Seller","au":"Enotes Library","d":"بائع فوانيس يعلّم طفلًا معنى الضوء.","ch":[{"h":"Part 1","p":["Every evening, at the edge of the old market, an old man sold paper lanterns. They were red, yellow, and green, and when the sun went down they glowed like small moons. Children stopped to look, but few of them had enough coins to buy one.","One night a boy named Ravi stood in front of the stall for a very long time. He had only two coins in his pocket."]},{"h":"Part 2","p":["'These are not enough,' said Ravi sadly, holding out his hand. The old man looked at the coins, then at the boy. 'Light is cheap,' he said with a smile, and handed him the smallest green lantern.","Ravi walked home through the dark street, and wherever he went the lantern made a little circle of gold. Later he understood the old man's words: a small light shared with others is never wasted."]}]},{"id":"a6","cat":"lang","t":"Ten Everyday Phrases","au":"Enotes Library","d":"عبارات إنجليزية شائعة مع شرح استعمالها اليومي.","ch":[{"h":"Greetings and Thanks","p":["'How are you doing?' is a friendly greeting. It is not a real question about health, so a short answer is best: 'Fine, thanks. And you?' We use 'Nice to meet you' the first time we meet someone, and 'Good to see you' when we already know them.","To thank someone politely, say 'Thank you very much' or 'I really appreciate it.' To reply, 'You're welcome' or 'No problem' are both natural."]},{"h":"Asking for Help","p":["When you do not understand, say 'Could you say that again, please?' or 'Sorry, I didn't catch that.' Both are polite and clear. If you need directions, begin with 'Excuse me, could you tell me how to get to the station?'","Finally, remember that 'Would you mind...?' is very polite. For example: 'Would you mind opening the window?' The answer 'Not at all' means 'Yes, of course.'"]}]},{"id":"a7","cat":"lang","t":"Common Mistakes, Explained","au":"Enotes Library","d":"أخطاء إنجليزية يقع فيها المتعلمون وكيف نتجنبها.","ch":[{"h":"Small Words, Big Mistakes","p":["Many learners say 'I am agree', but the correct sentence is 'I agree'. The verb 'agree' already contains the action, so we do not need 'am'. In the same way, we say 'I have a headache', not 'I am having a headache'.","Another common mistake is confusing 'much' and 'many'. We use 'many' with things we can count (many books) and 'much' with things we cannot count (much water)."]},{"h":"Sounds and Spelling","p":["English spelling can be confusing because the same letters make different sounds. For example, 'though', 'through', and 'tough' end the same way but sound completely different. The best solution is to read a little every day and listen carefully.","Also remember the difference between 'their', 'there', and 'they're'. 'Their' shows ownership, 'there' shows a place, and 'they're' means 'they are'."]}]}];

var BK_COMMON={};'about after again always another around asked because before began being below between bring called could every family first found going great happy having house large later leave light little looked might never night often other people place point right round seemed should small still story thing think those thought three through today together under until using water where which while whole world would young really something someone nothing anything everything without morning evening mother father sister brother friend school change answer himself herself myself yourself itself enough almost already wanted walked turned started moment rather maybe money words heard knew their there these first other years since going whose takes taken makes making coming looking said says'.split(' ').forEach(function(w){BK_COMMON[w]=1});
function bkShort(s){var p=String(s||'').split(/[،,؛;\/]/)[0].trim();return p.length>=2?p:String(s||'').trim()}
function bkShuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function bkWordCount(rd){var n=0;rd.ch.forEach(function(c){c.p.forEach(function(p){n+=p.split(/\s+/).length})});return n}
function bkMeaning(w,gl){
  var k=nz(w);

}
function bkVocab(rd,gl){
  var cnt={},orig={},sent={},total=bkWordCount(rd);
  rd.ch.forEach(function(c){c.p.forEach(function(p){
    var sn=p.match(/[^.!?]+[.!?]*/g)||[p];
    sn.forEach(function(s,si){
      (s.match(/[A-Za-z']+/g)||[]).forEach(function(w,i){
        var lw=w.toLowerCase();
        if(/'/.test(lw))return;
        var inG=gl&&gl[lw];
        if(!inG){
          if(lw.length<5||STOP[lw]||BK_COMMON[lw])return;
          if(/^[A-Z]/.test(w)&&(i>0||si>0))return;
        }
        var k=nz(lw);cnt[k]=(cnt[k]||0)+1;
        if(!orig[k])orig[k]=lw;
        if(!sent[k]&&s.trim().split(/\s+/).length>=6&&s.trim().split(/\s+/).length<=30)sent[k]=s.trim();
      });
    });
  })});
  var ks=Object.keys(cnt).map(function(k){
    var w=orig[k],sc=(gl&&gl[w])?1000+w.length:((w.length>=9?4:w.length>=7?3:2)*10+Math.min(cnt[k],5));
    return {w:w,cnt:cnt[k],sc:sc,sent:sent[k]||''};
  }).sort(function(a,b){return b.sc-a.sc||b.w.length-a.w.length});
  if(gl)ks=ks.filter(function(x){return gl[x.w]});
  var cap=gl?Math.min(40,ks.length):Math.min(60,Math.max(15,Math.ceil(total/90)));
  var words=ks.slice(0,cap).map(function(x){return {w:x.w,ar:bkMeaning(x.w,gl),cnt:x.cnt,sent:x.sent}});
  return words;
}
